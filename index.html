function ingHints(ing){
  const h=[];
  if(ing.cat==='bases'){h.push(ing.d);return h}
  h.push('Principes actifs : '+(ing.pa||PA_AUTO[ing.s])+'.');
  h.push('Se présente sous forme de : '+lcFirst(PART_LABEL[ing.p])+'.');
  h.push('Sa vertu passe surtout '+SOL_LABEL[ing.s]+'.');
  if(ing.v===1)h.push('Ses essences s\'évaporent en partie à la chaleur.');
  if(ing.v===2)h.push('Très volatile : la chaleur chasse ses essences, la distillation les recueille.');
  if((ing.tags||[]).includes('mercure'))h.push('Métal liquide : chauffé, il s\'évapore en vapeurs mortelles.');
  if((ing.tags||[]).includes('fumeux'))h.push('Brûle ou fume au feu.');
  if((ing.tags||[]).includes('sucre'))h.push('Contient des sucres : peut fermenter.');
  if((ing.tags||[]).includes('alcalin'))h.push('Alcalin : saponifie les graisses.');
  if(ing.labile)h.push('La cuisson en adoucit le mordant.');
  if((ing.tags||[]).includes('lent'))h.push('Agit lentement, sans avertir.');
  if(ing.danger)h.push('Dangereux : à manier avec le plus grand soin.');
  return h;
}

function setView(v){

  if(S.play!=='easy'&&v==='easy')v='bench';

  $('#toast').classList.remove('show');
  S.view=v;$('#app').dataset.view=v;

  if(v==='journal')renderJournal();
  if(v==='manual'){renderManual();achMisc('man',S.man.sec)}

  const badge=it?`<span class="badge">${fmtN(it.q)}</span>`:on?`<span class="badge">✓</span>`:'';

function stockCell(c,i){

  const badge=it?`<span class="badge low">${fmtN(it.q)}</span>`:S.solvent===c.id?`<span class="badge low">✓</span>`:'';
  const conf=S.confirmStock===c.id;
  const org=S.organize?`<div class="org"><button data-a="stmove" data-id="${esc(c.id)}" data-d="-1" aria-label="Avancer ${esc(c.name)}" ${i===0?'disabled':''}>‹</button><button class="del${conf?' conf':''}" data-a="stdel" data-id="${esc(c.id)}" aria-label="Supprimer ${esc(c.name)}">${conf?'Suppr. ?':'×'}</button><button data-a="stmove" data-id="${esc(c.id)}" data-d="1" aria-label="Reculer ${esc(c.name)}" ${i===S.reserve.length-1?'disabled':''}>›</button></div>`:'';

function renderShelf(){
  const nf=S.favs.length;
  const cats=[{id:'favs',n:'★ Favoris'+(nf?' ('+nf+')':'')}].concat(CATS,[{id:'reserve',n:'Réserve'+(S.reserve.length?' ('+S.reserve.length+')':'')}]);
  const grid=a0=>{const a=a0.filter(i=>campAvail(i.id));return a.length?`<div class="grid">${favFirst(a).map(cellHTML).join('')}${'<div class="cell"><span class="jar"></span><span class="plank"></span></div>'.repeat((3-a.length%3)%3)}</div>`:'<p class="orghint">Rien de débloqué dans ce rayon pour le moment.</p>'};
  let h=`<div class="cats" role="group" aria-label="Rayons">${cats.map(c=>`<button class="cat" data-a="cat" data-id="${c.id}" aria-pressed="${c.id===S.cat}">${c.n}</button>`).join('')}</div>`;
  if(S.cat==='reserve')h+=reserveHTML();
  else if(S.cat==='favs'){
    const fl=ING.filter(i=>isFav(i.id)&&campAvail(i.id));
    if(!fl.length)h+=`<div class="shelf-empty"><p>Aucun favori pour le moment.</p><p>Touche l'étoile d'un bocal pour l'épingler : il monte en haut de son rayon et apparaît ici.</p></div>`;
    else CATS.forEach(c=>{const l=fl.filter(i=>i.cat===c.id);if(l.length)h+=`<p class="shelf-sub">${c.n}</p>${grid(l)}`});
  }
  else if(S.cat==='bases')h+=`<p class="shelf-sub">Liquides</p>${grid(ING.filter(i=>i.role==='solvant'))}<p class="shelf-sub">Liants</p>${grid(ING.filter(i=>i.role==='adjuvant'))}`;
  else h+=grid(ING.filter(i=>i.cat===S.cat));
  if(S.cat!=='reserve'&&S.cat!=='favs'){const pool=ING.filter(i=>i.cat===S.cat);const n=campLockedIn(pool);if(n)h+=`<div class="lockhint"><span>${n} produit${n>1?'s':''} inédit${n>1?'s':''} à découvrir chez le marchand</span><button class="cat" data-a="campmarket">Marchand</button></div>`}
  h+='<div class="shelf-end"></div>';
  $('#shelf').innerHTML=h;
}

/* ---------- établi : concoction ---------- */
function mixInfo(g){
  const r=g.res,fx=r.fx.slice(0,3).map(f=>FX[f.id].n.toLowerCase());
  return `<small class="mixinfo${r.danger.level>=2?' warn':''}">${esc(TYPES[r.type].n)}, ${esc(r.danger.label.toLowerCase())}${fx.length?' : '+esc(fx.join(', ')):''}</small>`;
}
function qtyCtl(it,g){
  const L=limOf(g);
  return `<div class="qty"><button data-a="qstep" data-id="${esc(it.id)}" data-d="-1" aria-label="Moins de ${esc(g.n)}" ${it.q<=L.min?'disabled':''}>−</button><input class="qin" type="number" inputmode="decimal" min="${L.min}" max="${L.max}" step="${L.unit==='ml'?5:.5}" value="${it.q}" data-i="iq" data-id="${esc(it.id)}" aria-label="Quantité de ${esc(g.n)} en ${L.unit==='ml'?'millilitres':'grammes'}"><span class="u">${L.unit}</span><button data-a="qstep" data-id="${esc(it.id)}" data-d="1" aria-label="Plus de ${esc(g.n)}" ${it.q>=L.max?'disabled':''}>+</button></div>`;
}
function rangeCtl(k,ing){
  if(k==='solv'){
    const mx=ing.mix?Math.max(5,Math.min(500,Math.floor(ing.avail))):VOLS.max,mn=Math.min(VOLS.min,mx),st=ing.mix?5:10;
    return `<div class="rng"><input type="range" min="${mn}" max="${mx}" step="${st}" value="${clamp(S.vol,mn,mx)}" data-i="vol" aria-label="Volume de liquide en millilitres"><output class="rv" data-out="vol">${fmtQty(S.vol,'ml')}</output></div>`;
  }
  return `<div class="rng"><input type="range" min="${ADJQ.min}" max="${ADJQ.max}" step="5" value="${S.adjq}" data-i="adjq" aria-label="Quantité de liant en grammes"><output class="rv" data-out="adjq">${fmtQty(S.adjq,'g')}</output></div>`;
}
function baseSlot(kind){
  const T=TECH[S.tech];const id=kind==='solv'?S.solvent:S.adj;const ing=id?G(id):null;
  const allowed=kind==='solv'?T.solv:T.adj;
  const lab=kind==='solv'?'Liquide':'Liant';
  const need=kind==='solv'?['infuser','decocter','macerer','distiller','fermenter','emulsionner','cristalliser'].includes(S.tech):['petrir','mouler','emulsionner'].includes(S.tech);
  if(ing){
    const ok=kind==='solv'?solvAllowed(T,ing):allowed.includes(id);
    const inner=`<div class="val"><span class="dot" style="background:${ing.col}"></span>${esc(ing.n)}</div>${ing.mix?mixInfo(ing):''}${ok?rangeCtl(kind,ing):'<div class="note">Non utilisé avec cette technique</div>'}${ing.mix?`<small class="mixinfo">Disponible : ${esc(fmtQty(ing.avail,ing.unit))}</small>`:''}${ing.mix&&ing.liquidMix&&kind==='solv'?`<button class="link" data-a="toing" data-id="${esc(id)}">Employer comme ingrédient</button>`:''}<button class="x" data-a="unbase" data-k="${kind}" aria-label="Retirer ${esc(ing.n)}">×</button>`;
    return `<div class="base${ok?'':' off'}"><div class="lab">${lab}</div>${inner}</div>`;
  }
  const hint=allowed.length===0?'Sans '+lab.toLowerCase()+' ici':(need?(kind==='solv'?'Requis, dans les Bases':'Graisse, cire ou huile requise'):'Facultatif');
  return `<div class="base"><div class="lab">${lab}</div><div class="val muted small">${hint}</div></div>`;
}
function concInner(c){
  const line=c.text?`<span>Concentration : <b>${esc(c.text)}</b>${c.label?`, <span class="clab c-${c.label.replace(/\s|é/g,'')}">${esc(c.label)}</span>`:''}</span>`:'<span class="muted">Pose un ingrédient pour voir la concentration.</span>';
  return `${line}<div class="gauge${c.over?' over':''}"><span>Charge ${c.charge} sur ${VCAP}${c.over?' : ça déborde':''}</span><span class="bar"><i style="width:${Math.min(100,c.charge/VCAP*100)}%"></i></span></div>`;
}
const updateConc=()=>{const el=$('#conc');if(el)el.innerHTML=concInner(concInfo(rc(),S.mixes))};
function concoctHTML(){
  const T=TECH[S.tech];
  const chips=S.items.length?`<div class="chips">${S.items.map(it=>{const g=G(it.id);const L=limOf(g);return `<div class="chip"><span class="dot" style="background:${g.col}"></span><div class="nm">${esc(g.n)}<small>${g.mix?esc(g.res.form.toLowerCase())+', disponible : '+esc(fmtQty(g.avail,g.unit)):'ingrédient sec'}</small>${g.mix?mixInfo(g):''}${g.liquidMix&&solvAllowed(T,g)?`<button class="link" data-a="tosolv" data-id="${esc(it.id)}">Employer comme liquide</button>`:''}</div>${qtyCtl(it,g)}<button class="x" data-a="remove" data-id="${esc(it.id)}" aria-label="Retirer ${esc(g.n)}">×</button></div>`}).join('')}</div>`:`<div class="empty">L'établi est vide. Touche un bocal de l'étagère pour le poser ici${isWide()?', ou glisse-le sur le récipient':''}.</div>`;

  <div class="vessel-wrap${S.brewing?' brewing':''}" data-drop style="--mix:${previewColor()}">${toolSVG(S.tech,true)}<div class="bubbles"><i></i><i></i><i></i><i></i></div></div>
  <div class="conc" id="conc">${concInner(concInfo(rc(),S.mixes))}</div>
  <h2 class="h">Sur l'établi</h2>${chips}
  <div class="bases" style="margin-top:8px">${baseSlot('solv')}${baseSlot('adj')}</div>
  <h2 class="h">Chaleur</h2>${heat}
  ${S.msg?`<div class="msg" role="alert">${esc(S.msg)}</div>`:''}
  <div class="actions"><button class="btn primary" id="brew" data-a="brew" ${S.brewing?'disabled':''}>Préparer</button><button class="btn" data-a="clear" ${S.items.length||S.solvent||S.adj?'':'disabled'}>Vider l'établi</button></div>`;

/* ---------- établi : finition ---------- */
function finSources(){
  const a=[];
  if(S.result&&S.result.ok)a.push({id:'res',label:'Fiche en cours : '+S.result.name,res:S.result});
  S.reserve.forEach(c=>a.push({id:c.id,label:c.name+' ('+fmtQty(c.qty,unitOf(c.res))+')',res:c.res}));
  return a;
}
function finishHTML(){
  const srcs=finSources();
  const src=srcs.find(s=>s.id===S.finSrc)||srcs[0];if(src)S.finSrc=src.id;
  const F=FIN[S.finKey];
  if(!src)return `<h2 class="h">Finition</h2><div class="empty">Il n'y a rien à traiter. Prépare une mixture (elle apparaît alors ici, sur la fiche en cours), ou transvase-en une dans la Réserve. Les finitions s'appliquent ensuite, à volonté, sans lancer de technique.</div>`;
  const r=src.res;
  const fins=r.finishes&&r.finishes.length?`<p class="muted small">Déjà fait : ${esc(r.finishes.map(f=>f.l).join(', '))}.</p>`:'';
  const bad=F.liq&&!r.liquid?`${F.n} ne s'applique qu'aux liquides.`:(S.finKey!=='reduire'&&r.finishes&&r.finishes.some(f=>f.k===S.finKey)?'Cette finition a déjà été appliquée.':'');
  return `<h2 class="h">Mixture à traiter</h2>
  <select class="field" data-i="finsrc" aria-label="Mixture à traiter">${srcs.map(s=>`<option value="${esc(s.id)}"${s.id===src.id?' selected':''}>${esc(s.label)}</option>`).join('')}</select>
  <div class="finsum">${sealSVG(r.type,44)}<div><b>${esc(r.name)}</b><div class="muted small">${esc(TYPES[r.type].n)}, ${esc(r.form.toLowerCase())}, ${esc(r.danger.label.toLowerCase())}${r.qty>0?', '+esc(fmtQty(r.qty,unitOf(r)).replace('.',',')):''}</div>${fins}</div></div>
  <h2 class="h">Finition</h2>
  <div class="fins" role="group" aria-label="Finition">${FIN_ORDER.map(k=>`<button data-a="finkey" data-k="${k}" aria-pressed="${S.finKey===k}">${FIN[k].n}</button>`).join('')}</div>
  <p class="fin-desc">${esc(F.d)}</p>
  ${S.finKey==='reduire'?`<div class="seg" role="group" aria-label="Niveau de réduction">${Object.keys(RED_LVL).map(k=>`<button data-a="finlvl" data-k="${k}" aria-pressed="${S.finLvl===k}"><span>${RED_LVL[k].n}</span><span class="small">${RED_LVL[k].t}</span></button>`).join('')}</div>`:''}
  ${bad?`<p class="msg">${esc(bad)}</p>`:''}
  ${S.msg?`<div class="msg" role="alert">${esc(S.msg)}</div>`:''}
  <div class="actions"><button class="btn primary" data-a="dofin" ${bad?'disabled':''}>Appliquer la finition</button></div>

/* ---------- recette : quantité obtenue et proportionnalité ---------- */
const portUnit=r=>r.unit||(r.liquid?'ml':'g');
const portMax=r=>maxPortions(r,id=>S.mixes[id]);
const portN=(r,src)=>Math.max(1,Math.min(portMax(r),Math.round(S.portions[src]||1)));
const portNSrc=src=>{const r=resOfSrc(src);return r?portN(r,src):1};
/* ce que donnerait vraiment la recette pour N portions (quantité exacte si on peut la recalculer, sinon proportionnelle) */
function portQty(r,N){
  const u=portUnit(r),prop=scaleQ(r.qty,N,u);
  if(N<=1)return r.qty;
  const ch=chainOf(r);
  if(ch.some(s=>s.finish))return prop;
  const rc=lastRecipe(r);
  const known=rc&&rc.items.every(x=>BY[x.id]||S.mixes[x.id])&&(!rc.solvent||BY[rc.solvent]||S.mixes[rc.solvent]);
  if(!known)return prop;
  try{const x=prepare(scaleRecipe(rc,N),S.mixes);if(x&&!x.error&&!x.accident&&x.qty>0)return x.qty}catch(e){}
  return prop;
}
function portWarn(r,N){
  const w=[];if(N<=1)return w;
  let made=false;
  chainOf(r).forEach((s,i)=>{
    if(s.finish||!s.recipe)return;const rc=s.recipe;
    const hasMix=rc.items.some(x=>!BY[x.id])||(rc.solvent&&!BY[rc.solvent]);
    const skip=made&&hasMix;made=true;
    const known=!skip&&rc.items.every(x=>BY[x.id]||S.mixes[x.id])&&(!rc.solvent||BY[rc.solvent]||S.mixes[rc.solvent]);
    if(!known)return;
    let r1,rn;try{r1=prepare(rc,S.mixes);rn=prepare(scaleRecipe(rc,N),S.mixes)}catch(e){return}
    if(!r1||r1.error||r1.accident)return;
    if(rn.accident){w.push('Étape '+(i+1)+' : avec '+N+' portions, '+lcFirst(rn.accident.title)+'. Prépare plutôt la recette '+N+' fois.');return}
    if(rn.error){w.push('Étape '+(i+1)+' : '+rn.error);return}
    if(rn.type!==r1.type)w.push('Étape '+(i+1)+' : avec '+N+' portions, la préparation donnerait « '+TYPES[rn.type].n.toLowerCase()+' » au lieu de « '+TYPES[r1.type].n.toLowerCase()+' ». Prépare plutôt la recette '+N+' fois.');
  });
  return w;
}
function portResText(r,src,N){
  const u=portUnit(r),per=r.qty,mx=portMax(r),d=S.portDesired[src];
  let t=N+' portion'+(N>1?'s':'')+' : '+fmtQty(portQty(r,N),u)+' à la fin.';
  if(d>0){
    const need=Math.ceil(d/per-1e-9);
    t=need>mx?'Pour '+fmtQty(d,u)+', il faudrait '+need+' portions : la limite de l\'établi est de '+mx+' ('+fmtQty(portQty(r,mx),u)+'). Prépare la recette en plusieurs fois : les contenants identiques se regroupent.':'Pour '+fmtQty(d,u)+' : '+need+' portion'+(need>1?'s':'')+' ('+fmtQty(portQty(r,need),u)+' à la fin).';
  }
  if(N>=mx&&mx>1&&!(d>0&&Math.ceil(d/per-1e-9)>mx))t+=' C\'est le maximum de l\'établi.';
  return t;
}
function portCtlHTML(r,src,N){

function recipeBodyHTML(r,src,N){

  });
  const tB=`<div class="pscroll"><table class="mt prop propb"><thead><tr><th>Ingrédients</th><th>1 portion</th>${N>1?`<th class="on">${N} portions</th>`:''}</tr></thead><tbody>${rowsB.join('')}</tbody></table></div>`;
  const warn=portWarn(r,N).map(x=>`<p class="portwarn" role="alert">⚠ ${esc(x)}</p>`).join('');
  const li=ch.map((s0,i)=>{

    return `<li class="rstep"><div class="rt"><b>${esc(t.title)}</b>${s0.finish?'':`<span class="rtech">${esc((TECH[s0.tech]||{}).n||'')}</span>`}</div><ul class="plain">${t.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>${btn}</li>`;

}

un bocal l\'<b>épingle</b> en haut de son rayon et dans l\'onglet Favoris. Dans la Réserve, <b>Organiser</b> permet de déplacer ou de supprimer les contenants.</li><li>Le <b>Manuel</b> explique les principes, les techniques, chaque produit, et les savoir-faire : réduire une toxicité, transformer un liquide en baume…</li></ul><div class="actions"><button class="btn primary" data-a="gstartdlg">Commencer le guide</button><button class="btn" data-a="closeDlg">Ouvrir l'officine</button></div>`);

/* ---------- actions ---------- */
function addIng(id){
  const g=G(id);if(!g)return;
  if(!g.mix&&!campAvail(id)){toast('Pas encore débloqué : '+g.n+' (voir le marchand)');return}
  S.msg='';
  if(g.cat==='bases'){
    if(g.role==='solvant')S.solvent=S.solvent===id?null:id;else S.adj=S.adj===id?null:id;
    toast(((g.role==='solvant'?S.solvent:S.adj)===id?'Posé : ':'Retiré : ')+g.n);
  }else if(S.solvent===id){S.solvent=null;toast('Retiré : '+g.n)}
  else{
    const it=S.items.find(i=>i.id===id);
    if(!it&&g.liquidMix&&!S.solvent&&solvAllowed(TECH[S.tech],g)&&['infuser','decocter','macerer','distiller','fermenter','emulsionner','cristalliser'].includes(S.tech)){S.solvent=id;toast('Posé comme liquide : '+g.n)}
    else if(it){const L=limOf(g);if(it.q>=L.max){toast('Quantité maximale pour '+lcFirst(g.n));return}it.q=snapQ(it.q+stepOf(it.q,L.unit),L);toast(g.n+' : '+fmtQty(it.q,L.unit))}
    else{if(S.items.length>=MAX_ITEMS){toast('L\'établi est plein ('+MAX_ITEMS+' ingrédients)');return}S.items.push({id,q:defQ(g)});toast('Posé : '+g.n)}
  }
  sndPlay(g.cat==='bases'?'pour':'clink');
  clampItems();persist();renderShelf();if(S.mode!=='concoct'){S.mode='concoct'}refreshBenchLight();renderChrome();
  const v=$('.vessel-wrap');if(v&&!reduced()){v.classList.remove('plop');void v.offsetWidth;v.classList.add('plop')}
}
function consume(snap){
  if(!S.consume)return;
  const gone=[];
  const take=(id,q)=>{const c=S.reserve.find(x=>x.id===id);if(!c)return;c.qty=Math.round((c.qty-q)*10)/10;if(c.qty<.5)gone.push(c.name)};
  snap.items.forEach(i=>{if(i.id.indexOf('m:')===0)take(i.id,i.q)});
  const sv=snap.solvent&&G(snap.solvent);
  if(sv&&sv.mix&&solvAllowed(TECH[snap.tech],sv))take(snap.solvent,snap.vol);
  S.reserve=S.reserve.filter(c=>c.qty>=.5);
  S.items=S.items.filter(i=>i.id.indexOf('m:')!==0||S.reserve.some(c=>c.id===i.id));
  if(S.solvent&&S.solvent.indexOf('m:')===0&&!S.reserve.some(c=>c.id===S.solvent))S.solvent=null;
  rebuildMixes();persistReserve();clampItems();persist();renderShelf();
  if(gone.length)toast((gone.length>1?'Contenants épuisés : ':'Contenant épuisé : ')+gone.join(', '));
}
function brew(){
  if(S.brewing)return;
  const snap=rc();
  const r=prepare(snap,S.mixes);
  if(r.error){S.msg=r.error;refreshBenchLight();return}
  S.msg='';S.brewing=true;refreshBenchLight();sndBrewStart(snap.tech);
  setTimeout(()=>{
    S.brewing=false;S.result=r;S.savedId=null;S.stockedId=null;S.resultSrc=null;S.fresh=true;S.portions.res=1;S.portDesired.res=null;
    consume(snap);
    if(r.accident){dcOnAccident(r.accident.id,r.recipe||null,r);achOnAccident(r.accident.id);statsOnAccident()}else{dcOnBrew(r);achOnBrew(r);statsOnBrew(r)}
    refreshBenchLight();renderResult();renderChrome();
    sndPlay(r.accident?'thud':r.quality.score>=4?'chime':'done');
    live(r.accident?r.accident.title:('Préparation terminée : '+r.name+', '+TYPES[r.type].n));
    if(S.play==='easy')easyAfterBrew(r);
    else if(!isWide())setView('result');else $('#result').scrollTop=0;
    S.fresh=false;
    if(S.askSave&&!S.guide&&S.play!=='easy'&&r.ok&&!r.accident)setTimeout(()=>{if(S.result===r&&!S.savedId&&!$('#dlg').open)saveDlg(true)},reduced()?0:500);
  },reduced()?0:1400);
}

function doReset(k){
  if(k==='bench'){S.items=[];S.solvent=null;S.adj=null;S.result=null;S.savedId=null;S.stockedId=null;S.mode='concoct';persist()}
  else if(k==='reserve'){S.reserve=[];rebuildMixes();persistReserve();clampItems();persist()}
  else if(k==='camp')resetCamp();
  else if(k==='guide'){gStop();S.guide=null;S.gdone=[];gPersist();gRender()}
  else if(k==='stats'){S.stats=statsDefault();statsSave();if(S.view==='journal')renderJournal()}
  else if(k==='easy'){S.easyP={done:[],used:[]};easySaveP();if(S.play==='easy')renderEasy()}
  else if(k==='ach'){S.ach=achDefault();achQueue=[];achSave()}
  else if(k==='carnet'){S.dc=dcDefault();S.dc.back=true;S.newDisc=null;dcSave();dcSyncCareer(true);S.dc.log=[];dcSave()}
  else if(k==='books'){S.entries=[];S.books=[];S.openBook=null;S.openId=null;ensureBooks();persistBooks();persistEntries()}
  else if(k==='all'){
    LS.keys().filter(x=>x.indexOf('officine.')===0&&x!=='officine.theme'&&x!=='officine.seen').forEach(x=>LS.remove(x));
    closeDlg();location.reload();return;
  }
  closeDlg();renderShelf();renderBench();renderResult();renderChrome();
  if(S.view==='books')renderBooks();else if(S.view==='shop')renderShop();else if(S.view==='guide')renderGuide();else if(S.view==='journal')renderJournal();
  toast('Réinitialisé : '+RESETS.find(r=>r[0]===k)[1].toLowerCase());
}
function loadRecipe(rec){
  S.items=rec.items.filter(i=>G(i.id)&&G(i.id).cat!=='bases'&&(G(i.id).mix||campAvail(i.id))).map(i=>({id:i.id,q:i.q!=null?+i.q:(LEG[i.dose]||QTY.def)})).slice(0,MAX_ITEMS);
  S.solvent=rec.solvent&&G(rec.solvent)&&(G(rec.solvent).mix||campAvail(rec.solvent))?rec.solvent:null;S.adj=rec.adj&&G(rec.adj)&&campAvail(rec.adj)?rec.adj:null;
  if(TECH[rec.tech])S.tech=rec.tech;S.feu=[0,1,2].includes(rec.feu)?rec.feu:1;
  S.vol=rec.vol>0?+rec.vol:VOLS.def;S.adjq=rec.adjq>0?+rec.adjq:ADJQ.def;
  const lockedIds=rec.items.map(i=>i.id).concat(rec.solvent?[rec.solvent]:[],rec.adj?[rec.adj]:[]).filter(id=>G(id)&&!G(id).mix&&!campAvail(id));
  const lost=rec.items.length-S.items.length+((rec.solvent&&!S.solvent)?1:0)-lockedIds.length;
  const short=S.items.filter(i=>{const g=G(i.id);return g&&g.mix&&g.avail<i.q-.01}).map(i=>G(i.id).n);
  const sv=S.solvent&&G(S.solvent);if(sv&&sv.mix&&sv.avail<S.vol-.01)short.push(sv.n);
  S.mode='concoct';S.msg='';clampItems();persist();renderShelf();renderBench();
  return {lost:Math.max(0,lost),short,locked:lockedIds.map(id=>G(id).n)};
}
const redoToast=(o,N)=>o.locked&&o.locked.length?'Recette reposée sans '+joinEt(o.locked.map(lcFirst))+' : pas encore débloqué'+(o.locked.length>1?'s':'')+'. Le mode libre permet de tout utiliser.':o.lost>0?'Recette reposée, mais '+o.lost+' contenant'+(o.lost>1?'s':'')+' n\'existe'+(o.lost>1?'nt':'')+' plus':o.short.length?'Attention : pas assez de '+joinEt(o.short.map(lcFirst))+(N>1?' pour les '+N+' portions':' pour les quantités d\'origine'):(N>1?'Recette remise sur l\'établi pour '+N+' portions':'Recette remise sur l\'établi, quantités d\'origine');
/* deux contenants au contenu strictement identique se regroupent automatiquement */
function resSig(res){
  const st=v=>v===null||typeof v!=='object'?JSON.stringify(v):Array.isArray(v)?'['+v.map(st).join(',')+']':'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+st(v[k])).join(',')+'}';
  return st(res);
}
function mergeReserve(){
  const first={},gone={},out=[];let n=0;
  S.reserve.forEach(c=>{
    const k=resSig(c.res),a=first[k];
    if(!a){first[k]=c;out.push(c);return}
    a.qty=Math.round((a.qty+c.qty)*10)/10;
    if(c.note&&c.note!==a.note)a.note=a.note?a.note+'\n'+c.note:c.note;
    if(c.name&&c.name!==a.name){const tag='Aussi nommé « '+c.name+' ».';if(!(a.note||'').includes(tag))a.note=a.note?a.note+'\n'+tag:tag}
    gone[c.id]=a.id;n++;
  });
  if(!n)return gone;
  S.reserve=out;
  const map=id=>gone[id]||id;
  S.items.forEach(i=>{i.id=map(i.id)});
  const seen={};S.items=S.items.filter(i=>{if(seen[i.id]){seen[i.id].q+=i.q;return false}seen[i.id]=i;return true});
  if(S.solvent)S.solvent=map(S.solvent);
  if(S.resultSrc)S.resultSrc=map(S.resultSrc);
  if(S.finSrc)S.finSrc=map(S.finSrc);
  if(S.stockedId)S.stockedId=map(S.stockedId);
  if(S.confirmStock)S.confirmStock=map(S.confirmStock);
  if(S.guide&&S.guide.made)S.guide.made=S.guide.made.map(map);
  rebuildMixes();clampItems();
  return gone;
}
function newStock(name,res,qty){
  const c={id:'m:'+uid(),t:Date.now(),name:name.slice(0,80),note:'',res,qty:qty>0?qty:qtyOfRes(res)};
  S.reserve.push(c);
  const gone=mergeReserve();

  else if(k==='emove'){
    const en=S.entries.find(x=>x.id===t.dataset.id);if(!en||!t.value||!bookOf(t.value))return;
    en.bookId=t.value;persistEntries();S.openId=null;renderBooks();renderChrome();toast('Déplacé dans « '+bookOf(t.value).name+' »');
  }
  else if(k==='cname'||k==='cnote'){
    const c=S.reserve.find(x=>x.id===t.dataset.id);if(!c)return;
    if(k==='cname'){c.name=(t.value.trim()||c.res.name).slice(0,80);t.value=c.name}else c.note=t.value.slice(0,2000);
    rebuildMixes();persistReserve();renderShelf();refreshBenchLight();
    const ft=$('#dlg .f-title');if(ft&&k==='cname')ft.textContent=c.name;
  }
  else if(k==='ename'||k==='enote'){
    const en=S.entries.find(x=>x.id===t.dataset.id);if(!en)return;
    if(k==='ename'){en.name=(t.value.trim()||en.res.name).slice(0,80);t.value=en.name}
    else en.note=t.value.slice(0,2000);
    persistEntries();renderEntries();
    const ft=$('.openbook .f-title');if(ft&&k==='ename')ft.textContent=en.name;
  }
});
/* glisser-déposer */
document.addEventListener('dragstart',e=>{const s=e.target.closest&&e.target.closest('.slot');if(!s)return;e.dataTransfer.setData('text/plain',s.dataset.id);e.dataTransfer.effectAllowed='copy'});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]')){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(G(id))addIng(id)});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S.view==='books'&&!S.openBook)renderBooks()},150)});

/* ---------- démarrage ---------- */
function init(){
  $('#brand-logo').innerHTML=LOGO;peopleInit();sndInit();
  const th=LS.get('officine.theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
  load();
  renderShelf();renderBench();renderResult();renderChrome();
  setView(S.play==='easy'?'easy':isWide()?'bench':'shelf');
  const fromLink=shareFromHash();
  if(!LS.get('officine.seen')){LS.set('officine.seen','1');LS.set('officine.v1.easynews','1');if(!fromLink)welcomeDlg()}
  else if(!LS.get('officine.v1.easynews')){LS.set('officine.v1.easynews','1');setTimeout(()=>toast('Nouveau : l\'officine du débutant, un mode plus simple. Bouton en haut.'),900)}
}
init();
</script>
