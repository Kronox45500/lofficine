const MAN_SECTIONS=[['principes','Principes'],['techniques','Techniques'],['finitions','Finitions'],['produits','Produits'],['bases','Bases'],['effets','Effets et types'],['reactions','Réactions'],['savoir','Savoir-faire']];

const MAN_PRINCIPES=[
 {t:'Ce qu\'est une préparation',p:[`Une plante, un minéral ou un produit animal porte des <b>principes actifs</b> : des substances qui agissent sur le corps ou sur la matière. Préparer, c'est les extraire (les dissoudre, les évaporer, les concentrer) sans les détruire, puis en faire une forme utilisable : infusion, teinture, onguent, poudre, fumigation.`,`Toute extraction est un compromis : ce qui se dissout bien dans un liquide se dissout mal dans un autre ; ce qui résiste à la chaleur n'y résiste pas toujours ; ce qu'on extrait reste parfois mêlé à des substances indésirables.`]},
 {t:'Quantités et concentration',p:[`Les solides se pèsent en <b>grammes</b>, les liquides se mesurent en <b>millilitres</b>. Mais ce qui compte n'est pas la quantité brute : c'est la <b>concentration</b>, c'est-à-dire les grammes de matière pour 100 ml de liquide.`,`<b>5 g pour 100 ml</b> est la concentration standard : l'ingrédient donne ses vertus à pleine mesure. À 2,5 g pour 100 ml, on n'obtient qu'environ la moitié ; à 10 g pour 100 ml, un peu moins du double. Au-delà de 25 g pour 100 ml, le liquide est <b>saturé</b> : il ne peut plus rien dissoudre, l'excédent est perdu et la préparation en pâtit.`,`Dans un onguent, la même règle vaut pour la proportion de matière dans le corps gras : 5 g de matière pour 20 g de graisse est le standard. <b>À sec</b> (poudre, cendre, fumigation), il n'y a pas de liquide : seules comptent les <b>proportions</b> entre les ingrédients. Une poudre d'actif mêlée à une charge inerte (craie, argile) est diluée d'autant.`,`Le récipient contient au plus 800 (grammes et millilitres additionnés). Au-delà, une part se perd. La fiche indique la <b>quantité obtenue</b> : elle baisse avec l'évaporation (décoction, réduction) ou la distillation, qui ne recueille qu'environ 60 % du liquide.`]},
 {t:'Solubilité',p:[`Chaque famille de principes actifs se dissout dans certains liquides :`,`<div class="soltable" data-soltable></div>`,`Les <b>poudres insolubles</b> (pierres, argiles, pigments) ne se dissolvent nulle part : dans un liquide, elles restent en suspension et n'agissent qu'à moitié.`]},
 {t:'Partie et technique',p:[`Les parties <b>tendres</b> (fleurs, feuilles) cèdent leurs principes très vite : une infusion suffit. Les parties <b>dures</b> (racines, écorces, baies, champignons) demandent une longue décoction ou une macération. Les <b>résines</b> se travaillent à l'alcool ou à l'huile. Le tableau suivant donne la part extraite selon la technique, avant même de tenir compte du solvant :`,`<div class="soltable" data-pftable></div>`]},
 {t:'Chaleur et volatilité',p:[`La chaleur accélère l'extraction mais <b>chasse les substances volatiles</b> : essences, parfums, arômes. Une plante riche en essences (mélisse, lavande, menthe) s'infuse tiède ou se macère à froid ; bouillie, elle perd l'essentiel de ce qui fait sa valeur. À l'inverse, la distillation et la fumigation exploitent la volatilité : seul ce qui s'évapore passe.`,`La chaleur détruit aussi certaines substances fragiles : le mordant de l'ortie disparaît à la cuisson. Et elle est dangereuse avec certains produits : un métal liquide chauffé s'évapore en vapeurs mortelles, l'alcool distillé à feu vif s'enflamme.`]},
 {t:'Suspensions et filtration',p:[`Une poudre insoluble mise dans un liquide reste en suspension : elle agit à moitié et trouble le liquide. Le filtre la retire, avec son effet. C'est utile pour se débarrasser d'un irritant ou d'un toxique en poudre, mais on perd aussi ce qu'on voulait garder : une poudre absorbante (pierre de lune, charbon) qui devait servir d'antidote est retirée par le filtre.`]},
 {t:'Interactions entre effets',p:[`Les effets d'une préparation s'additionnent, puis s'influencent :`,`<div data-antsyn></div>`,`Un effet inférieur à un seuil faible passe inaperçu et n'est pas indiqué. Les effets sont classés en quatre paliers : faible, modérée, forte, intense.`]},
 {t:'La dose fait le poison',p:[`Certains produits changent de nature avec la concentration. À faible concentration (moins de 3 g pour 100 ml), le venin de vipère est un anesthésiant ; à forte concentration (plus de 8 g pour 100 ml), l'herbe de veuve devient toxique. Le niveau de danger (inoffensif, prudence, dangereux, très dangereux, mortel) est calculé à partir de la toxicité, de la paralysie, de la corrosion et, plus faiblement, du délire, de l'effet purgatif et de l'irritation.`,`Une mixture dangereuse qu'on réutilise en petite quantité garde des <b>traces</b> de sa nature. Une dilution réduit le danger ; elle ne l'efface pas toujours.`]},
 {t:'Conservation',p:[`Une préparation se conserve selon sa forme : quelques jours pour une infusion ou une décoction (l'eau se corrompt vite), des semaines pour une eau distillée, des mois pour un onguent, des années pour une teinture ou un esprit. Les substances <b>conservatrices</b> (alcool, sel, miel) rallongent ce délai. Sceller à la cire le triple. Mêler de l'eau et du gras sans émulsifiant raccourcit la vie du mélange.`]},
 {t:'Étapes successives',p:[`Une mixture peut être <b>transvasée</b> dans un contenant nommé, avec la quantité obtenue (sans limite de contenants : la Réserve se trie, se réorganise et se vide à la demande). La fiche de toute préparation garde sa <b>recette complète</b>, étape par étape, y compris celles des contenants employés. Elle devient alors un ingrédient : un solide se traite comme une plante ou un minéral, un liquide sert de solvant ou se mêle à d'autres. Les quantités prélevées sont retirées du contenant.`,`Chaque étape a ses pertes : une poudre décoctée cède une part de ses vertus, un liquide mêlé à un autre se dilue en proportion des volumes. Les <b>finitions</b> (filtrer, décanter, réduire, adoucir, sceller) s'appliquent à part, sur n'importe quelle mixture liquide ou non selon le cas.`]}
];

const MAN_TECH={
 broyer:{sci:`Le broyage divise la matière sans la chauffer ni la dissoudre : aucune perte notable pour les sels et poudres, un peu plus pour les racines dures (75 % passent en poudre fine) et les résines qui collent au pilon (60 %). La poudre est la forme la plus concentrée : rien n'est dilué.`,pour:`Minéraux, pigments, racines sèches, mélanges de départ à retravailler ensuite.`,attention:`Les proportions décident de tout : sans liquide, la puissance dépend de la part de chaque ingrédient. Avec un liant (miel, graisse, cire, glycérine), on obtient un électuaire, un onguent, un cérat ou une pâte.`,out:`Poudre, électuaire, onguent, cérat, pâte.`},
 melanger:{sci:`Le mélange assemble sans extraire ni chauffer : il ne change pas la nature des composants. Deux liquides se diluent l'un l'autre en proportion de leurs volumes (10 ml d'une teinture dans 90 ml d'eau ne gardent qu'un dixième de sa force). Une poudre versée dans un liquide reste en suspension. Mêlé à un corps gras, un liquide à base d'huile s'incorpore bien ; un liquide à base d'eau se sépare, sauf avec un émulsifiant comme la lanoline.`,pour:`Assembler des mixtures déjà préparées, transformer un liquide en onguent ou en cérat, ajuster une force.`,attention:`Les plantes brutes y cèdent très peu (50 % pour les parties tendres, 40 % pour les dures) : pour elles, mieux vaut infuser, macérer ou broyer d'abord.`,out:`Mélange liquide (ou la forme commune de ses composants), poudre, onguent, cérat, savon.`},
 infuser:{sci:`On verse de l'eau chaude sur la matière et on laisse tremper. L'eau extrait très bien les mucilages, les tanins et les sels ; elle prend peu aux racines (45 %), presque rien aux résines (15 %) et aux métaux. Tiède, l'extraction est plus lente (70 %) mais les essences se gardent ; à l'ébullition, elles s'envolent (75 % conservés) et les fragiles se détruisent.`,pour:`Fleurs et feuilles tendres, mucilages, sels solubles.`,attention:`Trop chaud pour la mélisse, la menthe ou la lavande. Les poudres insolubles restent en suspension.`,out:`Infusion.`},
 decocter:{sci:`Faire bouillir longuement : la chaleur et le temps viennent à bout des parties dures (100 % pour les racines et écorces, 60 % pour les résines). En revanche, ce qui est volatil s'échappe presque entièrement (30 % conservés à ébullition vive) et ce qui est fragile se détruit. On perd du volume : 5 % à petit feu, 28 % à ébullition vive.`,pour:`Racines, écorces, baies, champignons, sels.`,attention:`Jamais pour les plantes à essences. Avec du miel, la décoction devient un sirop ; avec un alcali et une graisse, un savon.`,out:`Décoction, sirop, vin médicinal, savon.`},
 macerer:{sci:`Laisser reposer à froid dans un solvant pendant des jours. C'est la technique de l'extraction la plus fidèle : rien ne chauffe, rien ne s'évapore. Le rendement dépend du solvant : l'alcool dissout alcaloïdes, résines et essences (et gagne 10 % sur elles), l'huile prend les corps gras et les essences, le vinaigre attaque les sels et les métaux, l'eau se corrompt.`,pour:`Tout ce qui craint la chaleur ; résines, alcaloïdes, essences ; huiles médicinales.`,attention:`Lent, et le solvant choisi décide de ce qui est extrait. L'eau seule laisse moisir.`,out:`Teinture, élixir (avec du miel), vinaigre médicinal, oxymel, huile médicinale, macérat, vin médicinal.`},
 distiller:{sci:`On chauffe le mélange et on recueille la vapeur condensée. Seules les substances volatiles passent (essences, alcool) : les toxiques fixes, les tanins, les sels, les résines lourdes restent dans la cornue. On obtient un produit pur, léger, et concentré dans un volume réduit (environ 60 % du liquide de départ). L'argent-vif est une exception dangereuse : il passe dans le distillat.`,pour:`Plantes à essences, purification, séparer ce qui est volatil de ce qui ne l'est pas.`,attention:`Feu vif : goût de brûlé ; avec de l'alcool, les vapeurs peuvent s'enflammer. Une plante sans essence ne donne rien.`,out:`Eau distillée, esprit (avec de l'alcool), vinaigre distillé.`},
 calciner:{sci:`Calciner, c'est chauffer à haute température jusqu'à réduire en cendre ou en oxyde. La matière vivante est détruite : il ne reste que ses éléments minéraux, un peu d'astringent, de colorant, de conservateur. Les minéraux gardent leur nature et deviennent plus corrosifs et plus irritants ; ce qui brûle est consumé.`,pour:`Minéraux, obtenir des cendres alcalines ou des pigments.`,attention:`Dangereux avec les substances qui s'évaporent (l'argent-vif) ou qui brûlent en grande quantité à feu de forge.`,out:`Cendre.`},
 petrir:{sci:`Malaxer au bain-marie dans un corps gras : graisse, suif, lanoline, cire ou huile. Les poudres s'y suspendent très bien (85 %). Les plantes n'y cèdent leurs principes que si ceux-ci sont solubles dans le gras ; à défaut, elles s'y mêlent en pulpe (35 % environ). La proportion standard est 5 g de matière pour 20 g de corps gras.`,pour:`Onguents, cérats, emplâtres (cire et résine), savons (alcali et graisse).`,attention:`À feu direct, la graisse fume et grille. L'eau et le gras ne se mêlent pas sans émulsifiant.`,out:`Onguent, cérat, emplâtre, liniment, savon.`},
 fumiger:{sci:`On brûle sur des braises et on respire les fumées. Les substances volatiles passent très bien ; les substances lourdes presque pas (10 %). Le soufre fait exception : il fume abondamment et assainit l'air, mais irrite.`,pour:`Encens, parfums, assainissement d'une pièce, essences volatiles.`,attention:`À la flamme, tout brûle d'un coup et les essences se perdent. Trop de matière inflammable sur feu vif provoque une flambée. Toujours aérer ensuite.`,out:`Fumigation.`},
 fermenter:{sci:`Les sucres travaillent pendant des semaines : des levures les transforment en alcool, qui conserve et enivre un peu. Sans sucre, la mixture tourne. L'extraction est intermédiaire entre celle de l'eau et celle de l'alcool. Sous l'eau et en milieu fermenté, la moisissure bleue devient un puissant antiseptique.`,pour:`Vins et hydromels médicinaux, sève sucrée, moisissure.`,attention:`Il faut une source de sucre : miel ou sang-de-bouleau.`,out:`Vin médicinal, hydromel médicinal.`},
 torrefier:{sci:`Le grillage à sec chauffe la matière sans liquide. Il chasse les essences (une plante très volatile perd presque tout), brunit et détruit les principes fragiles, adoucit les mucilages et concentre les tanins. Les sucres se caramélisent en un colorant brun ; à feu vif, tout végétal se carbonise en un charbon très absorbant.`,pour:`Racines et graines à goût grillé, tanins à concentrer, caramel, charbon végétal.`,attention:`Ne convient pas aux plantes à essences. À feu vif avec beaucoup de matières inflammables, la poêle peut s'enflammer.`,out:`Poudre torréfiée, caramel, charbon végétal.`},
 cristalliser:{sci:`Les sels et les métaux solubles se dissolvent dans l'eau chaude ; en laissant l'eau s'évaporer, ils cristallisent, purs, tandis que les impuretés restent en solution ou sur le filtre. On recueille environ 90 % du sel dissous, mais le produit est bien plus concentré et plus pur qu'au départ. Les végétaux et les poudres insolubles n'apportent rien.`,pour:`Purifier un sel (sel gris, alun, borax, vitriol), obtenir un produit très concentré et de longue conservation.`,attention:`Une ébullition franche donne des cristaux plus fins et moins purs. Sans sel ni métal soluble, rien ne cristallise.`,out:`Cristaux.`},
 sublimer:{sci:`Certains solides passent directement à l'état de vapeur sans fondre, puis se redéposent en fines fleurs sur une paroi froide. C'est la voie de purification des corps volatils : soufre, camphre, benjoin, ambre, sel d'ammoniac. Le rendement est faible (environ 60 %), la pureté excellente. L'argent-vif et le soufre sublimés ensemble donnent un cinabre.`,pour:`Purifier un corps volatil solide, obtenir des fleurs de soufre ou un cinabre pur.`,attention:`L'argent-vif seul, sublimé, s'évapore en vapeurs mortelles. À feu vif, le soufre peut s'enflammer.`,out:`Fleurs (dont fleurs de soufre, cinabre).`},
 emulsionner:{sci:`L'eau et le gras ne se mêlent pas spontanément. Un émulsifiant (lanoline, saponines de la saponaire, gomme d'acacia, jaune d'œuf) entoure les gouttelettes de gras et les maintient dans l'eau : on obtient une crème lisse, ou un lait si l'eau domine. La crème s'étale finement et hydrate, mais se conserve moins bien qu'un onguent, car elle contient de l'eau.`,pour:`Crèmes et laits pour la peau, mélanges d'eau et de corps gras, plantes mucilagineuses dans un véhicule gras.`,attention:`Sans émulsifiant, rien ne tient. Si le volume d'eau dépasse deux fois et demie celui du gras, on obtient un lait liquide.`,out:`Crème, lait.`},
 mouler:{sci:`Les poudres sont liées avec un liant (miel, glycérine, cire, graisse), pressées dans un moule et laissées à prendre. Le miel et la glycérine donnent des pastilles, la cire une bougie qui libère ses parfums en brûlant, une graisse un bâton de baume, un alcali et une graisse une savonnette. La forme solide se dose facilement et se conserve longtemps.`,pour:`Pastilles, bougies parfumées, savonnettes, bâtons de baume, encens moulé.`,attention:`Sans liant, rien ne prend. Un liant trop chaud fume et jaunit.`,out:`Pastilles, bougie, savonnette, bâton.`}
};
const MAN_FIN={
 filtrer:`Le filtre de lin retient les particules en suspension (95 % des poudres insolubles) et une partie des fibres irritantes (l'irritation baisse de 40 %). Il ôte aussi leurs effets aux poudres actives, antitoxiques comprises. On perd 5 % du volume et un peu de force. Conservation multipliée par 1,3.`,
 decanter:`Après une nuit de repos, les dépôts lourds restent au fond : 70 % des poudres en suspension sont retirées, l'irritation baisse de 20 %. C'est plus doux que le filtre et moins complet. On perd 8 % du volume.`,
 reduire:`On évapore à feu doux : le volume baisse (un quart, la moitié ou les trois quarts), ce qui concentre ce qui ne s'envole pas, dangers compris (une réduction de moitié multiplie les effets par 1,9 environ). Les parfums et la clarté d'esprit, volatils, perdent un quart. Le liquide fonce. Conservation multipliée par 1,25.`,
 edulcorer:`Le miel masque l'amertume (l'amer est divisé par deux, le doux monte), apporte un peu d'émollient et améliore la conservation (× 1,25). Le volume augmente de 4 %.`,
 sceller:`Une couche de cire fondue sur le bouchon isole la mixture de l'air : la conservation est triplée. Sans effet sur la force, valable pour tout contenant, liquide ou non.`
};
const TYPE_CRIT={
 poison:`toxicité et paralysie ≥ 1,6 (toxique + 0,9 × paralysant)`,soin:`vertus de soin (fébrifuge, pectoral, digestif, antalgique, cicatrisant, diurétique…) ≥ 1,8, surtout pour une forme à prendre par la bouche`,baume:`vertus apaisantes et réparatrices (cicatrisant, émollient, antiseptique, antalgique, astringent) ≥ 1,8, pour une forme d'application externe`,tonique:`tonique, stimulant et échauffant ≥ 1,8`,sedatif:`calmant et soporifique ≥ 1,8`,stupefiant:`euphorisant et délirant ≥ 1,8`,antidote:`antitoxique ≥ 2`,purgatif:`purgatif ≥ 2`,caustique:`corrosif ≥ 1,5`,incendiaire:`inflammable ≥ 3,2`,parfum:`parfumant ≥ 2,4 et dominant`,colorant:`colorant ≥ 2,4 et dominant, ou réaction connue (encre, vermillon, vert-de-gris)`,conservateur:`conservateur ≥ 2,4 et dominant`,detergent:`détersif ≥ 2`,desinfectant:`antiseptique ≥ 2,4 et dominant`,bourbe:`aucun effet ne dépasse 1,2`
};
const MAN_HOWTO=[
 {t:'Réduire la toxicité d\'un produit',p:[`Il n'y a pas une seule méthode : chacune agit sur un aspect différent.`],l:[
  `<b>Diluer</b>. La force dépend de la concentration : la même quantité de matière dans cinq fois plus de liquide est plusieurs fois moins toxique. Regarde la <i>prise conseillée</i> sur la fiche.`,
  `<b>Choisir un solvant qui la dissout mal</b>. Les alcaloïdes passent surtout dans l'alcool et le vinaigre ; l'eau n'en prend que la moitié.`,
  `<b>Distiller</b>. Seul ce qui est volatil passe : les toxiques fixes (belle-d'ombre, aconit, poudre d'éclat, digitale) restent dans la cornue. Attention à l'argent-vif, qui passe et rend le distillat toxique.`,
  `<b>Cuire</b>. La chaleur détruit certains irritants (l'ortie).`,
  `<b>Filtrer ou décanter</b>. Retire les poudres toxiques en suspension et adoucit les irritants.`,
  `<b>Neutraliser</b>. La pierre de lune blanche, le charbon de saule, la craie, l'argile et la coquille broyée sont antitoxiques : ils annulent une partie de la toxicité et de la paralysie, à condition d'être laissés en suspension le temps de la préparation.`,
  `<b>Adoucir</b>. Un émollient (mauve grasse, glycérine, consoude) réduit l'irritation de 60 %.`,
  `<b>Ne pas réduire</b> : concentrer une mixture concentre aussi ses dangers.`]},
 {t:'Transformer un liquide en baume',p:[`Un baume est une préparation grasse, d'application externe. Trois voies :`],l:[
  `<b>Par l'huile</b>. Macère les plantes à l'huile (huile d'olive ou d'amande douce), puis mélange l'huile médicinale à de la cire brune pour un cérat, ou à de la graisse pour un onguent (technique <i>Mélanger</i>).`,
  `<b>Par le pétrissage</b>. Pétris directement les poudres et les plantes dans le corps gras, au bain-marie doux. Les poudres s'y mêlent très bien ; les plantes moins, sauf celles dont les principes sont solubles dans le gras (résines, essences).`,
  `<b>À partir d'un liquide aqueux</b>. Réduis-le fortement, puis mélange-le à la graisse avec de la lanoline : c'est un émulsifiant. Sans lui, l'eau et le gras se séparent : la qualité baisse et la conservation est divisée par 2,5.`,
  `<b>Choisir le corps gras</b>. Graisse d'oie et suif pour un onguent (souple ou ferme), cire pour un cérat ou, avec de la résine, un emplâtre, lanoline pour une adhérence forte.`]},
 {t:'Obtenir une préparation plus concentrée',l:[
  `Augmente les grammes de matière pour 100 ml de liquide (jusqu'à 25 g environ : au-delà, c'est saturé).`,
  `Réduis un liquide à feu doux (finition <i>Réduire</i>).`,
  `Distille : le distillat concentre les substances volatiles dans environ 60 % du volume.`,
  `Choisis le bon solvant : l'alcool extrait le plus des alcaloïdes, résines et essences.`,
  `Ne mets pas plus de 800 (g et ml) dans le récipient.`]},
 {t:'Extraire ce qui ne se dissout pas à l\'eau',p:[`Consulte la fiche du produit : son tableau de rendement indique, pour chaque technique, la part extraite.`],l:[
  `Résines et alcaloïdes : macération à l'alcool.`,`Principes gras et essences : macération à l'huile ou à l'alcool.`,`Sels métalliques : vinaigre.`,`Poudres insolubles : à broyer, à pétrir dans le gras, ou à laisser en suspension.`]},
 {t:'Conserver longtemps',l:[`Préfère l'alcool (teinture : environ 2 ans), le vinaigre ou le miel à l'eau (infusion : 2 jours).`,`Ajoute des conservateurs : sel gris, sel noir, salpêtre.`,`Scelle à la cire : la durée est triplée.`,`Évite de mêler de l'eau et du gras sans émulsifiant.`,`Une poudre sèche se garde un an ; une cendre presque indéfiniment.`]},
 {t:'Masquer l\'amertume',l:[`Ajoute du miel comme liant, ou applique la finition <i>Adoucir au miel</i> : l'amer est divisé par deux.`,`Distille : le goût est réduit de moitié.`,`Choisis un solvant sans goût (eau distillée).`]},
 {t:'Fabriquer une encre, un pigment, un savon',l:[
  `<b>Encre noire</b>. Vitriol vert et une plante à tanin (cornouille amère) en infusion, décoction ou macération, ou par mélange de leurs liquides.`,
  `<b>Pigments</b>. Ocre rouge, pierre d'azur, résine sanguine, orseille pourpre, craie blanche : à broyer, ou en suspension dans un liquide.`,
  `<b>Vermillon</b>. Argent-vif et soufre jaune broyés : un rouge éclatant, mais toxique.`,
  `<b>Vert-de-gris</b>. Fleur de cuivre et vinaigre : un beau vert qui empoisonne.`,
  `<b>Savon</b>. Un alcali (lait de chaux, sel de soude, cendre de hêtre) et une graisse (oie, suif, lanoline), en décoction ou pétris.`]},
 {t:'Faire un antidote',p:[`Un antidote est une préparation dont l'effet <i>antitoxique</i> domine.`],l:[
  `Pierre de lune blanche et charbon de saule sont les plus efficaces ; craie, argile et coquille broyée aident.`,`Ils agissent en suspension : ne filtre pas.`,`Un astringent (alun, cornouille) retient ce qu'un purgatif voudrait chasser.`,`Un antitoxique mêlé à une mixture toxique en neutralise une partie : 90 % de la toxicité de même poids, 50 % de la paralysie.`]},
 {t:'Enchaîner plusieurs étapes',l:[
  `Prépare une première mixture (par exemple une poudre au mortier), puis <i>Transvaser dans un contenant</i> depuis sa fiche : elle rejoint la Réserve avec sa quantité.`,`Prépare la suivante (par exemple un liquide distillé), transvase-la aussi.`,`Pose les contenants sur l'établi : un solide est un ingrédient ; un liquide peut être le liquide de base, ou être mêlé.`,`Les quantités utilisées sont retirées des contenants (option modifiable dans la Réserve).`]},
 {t:'Faire un parfum ou un encens',l:[`Les essences sont volatiles et solubles dans l'alcool et l'huile : macère la lavande, la menthe, la camomille ou l'encens à l'alcool, ou distille-les.`,`L'ambre gris fixe le parfum : il dure plus longtemps.`,`En fumigation, choisis une braise couvante et des résines volatiles (encens de rocaille, myrrhe).`]},
 {t:'Obtenir une préparation très pure',l:[`Distille : le produit est débarrassé de tout ce qui n'est pas volatil.`,`Filtre ou décante ensuite un liquide trouble.`,`Choisis de l'eau distillée comme solvant.`]},
 {t:'Éviter les accidents',l:[`L'argent-vif ne se chauffe jamais : distillation à feu vif, calcination et fumigation le font s'évaporer en vapeurs mortelles.`,`L'alcool ne se distille pas à feu vif : les vapeurs s'enflamment.`,`Trop de matières inflammables (soufre, charbon, salpêtre, résines) sur un feu vif provoquent une flambée.`,`Aère toujours après une fumigation, surtout au soufre.`]},
 {t:'Réussir ses commandes en campagne',p:[`Chaque client détaille ce qu'il veut : un type de préparation, des vertus à atteindre, parfois un usage, une couleur, une conservation minimale, une quantité. La paie dépend de la correspondance avec la commande, de la qualité de fabrication et de la quantité livrée.`],l:[
  `<b>Lis toute la commande</b>. « Forte au moins » signifie un effet d'intensité au moins forte sur la fiche ; « à boire » exclut un baume.`,
  `<b>Pèse assez</b>. Une commande de 60 ml demande au moins 60 ml : sinon le client ne paie qu'au prorata. Augmente ensemble les ingrédients et le liquide pour garder la même concentration.`,
  `<b>Vise la qualité</b>. Une bonne technique, sans ingrédient gaspillé, fait monter la note de fabrication et la paie.`,
  `<b>Tous les types de concoctions</b> se commandent : soins, baumes, toniques, calmants, vins et hydromels, purges, antidotes, poisons contre les nuisibles, parfums, colorants, conservateurs, détergents, désinfectants, caustiques, allume-feux. Les clients ne fixent pas de niveau de danger : c'est à toi de juger ce que tu livres.`,
  `<b>Les clients fidèles</b> reviennent : leur histoire avance à chaque commande réussie (au moins 50 % de correspondance), et leur amitié fait monter la paie. Retrouve-les dans l'onglet Clients du Comptoir.`,
  `<b>La Gazette</b> annonce des événements : épidémie, foire, bal, hiver rigoureux… Pendant quelques clients, certains types de commandes sont plus fréquents et mieux payés, et le marchand peut changer ses prix.`,
  `<b>Conserve les surplus</b> : ce que le client n'emporte pas est rangé dans un contenant, prêt pour la commande suivante.`,
  `<b>Demande conseil</b> (15 F) si tu bloques : l'apothicaire propose une recette qui répond à la commande.`,
  `<b>Réinvestis</b> : chaque produit inédit acheté chez le marchand ouvre de nouvelles commandes, mieux payées, et de nouvelles recettes à inventer. Les produits recherchés et rares demandent une bonne note.`]},
 {t:'Choisir ses produits selon l\'effet voulu',l:[`Dans l\'onglet <b>Produits</b>, « Chercher par effet » liste les produits qui portent un ou plusieurs effets (calmant, digestif, cicatrisant…), du plus puissant au moins puissant.`,`Coche « tous ces effets » pour ne garder que ceux qui les réunissent : une seule plante peut faire tout le travail.`,`Chaque ligne donne la meilleure façon de travailler le produit (à l\'eau, à l\'alcool, à l\'huile…) et un bouton pour le poser sur l\'établi.`,`Les effets des produits se combinent, s\'annulent ou se renforcent : regarde les synergies et les antagonismes avant d\'associer.`,`Depuis l\'onglet « Effets et types », ou depuis la fiche d\'un produit, un clic sur le nom d\'un effet ouvre directement la recherche.`]},
 {t:'Le matériel de l\'atelier (carrière)',l:['L\'onglet « Atelier » du comptoir vend cinq pièces de matériel, chacune en deux niveaux.','Balance, mortier, marmite, alambic et four donnent un bonus de qualité selon la technique. L\'alambic rend plus de distillat, le four évite des flambées.','Le matériel n\'agit qu\'en carrière, et pas pendant les missions du guide. Le journal de la préparation dit ce qu\'il a apporté.']},
 {t:'Spécialités, rival et mentor (carrière)',l:['Au 6ᵉ client, tu peux choisir une spécialité : médecin, parfumeur, herboriste ou alchimiste de l\'ombre. Elle attire plus de commandes de son domaine, mieux payées, et donne des rabais sur le matériel.','Les poisons, caustiques et incendiaires font grandir ta notoriété : elle rend ces commandes plus chères, mais les inspections coûtent des amendes.','Maître Corvin, un rival, arrive à 10 clients et 2,5 étoiles : guerre des prix, étals raflés et duels. Pour gagner un duel, vise 80 % de correspondance et une qualité de 4 sur 5.','Sœur Agnès, une herboriste, propose ses leçons dès 3 étoiles : conseils gratuits, rabais chez le marchand, histoire en cinq chapitres. Tout se suit dans l\'onglet « Réputation ».']},
 {t:'Comparer, partager, imprimer',l:['« Comparer » (grimoires) ou « Comparer avec… » (fiche) met deux préparations côte à côte : qualité, quantité, conservation, danger et chaque effet. Choisis l\'effet que tu cherches pour savoir laquelle convient le mieux.','« Partager… » crée une carte lisible : tu peux l\'imprimer, l\'enregistrer en image, ou copier le code de la recette.','Un autre joueur colle ce code dans « Importer une recette » (grimoires) pour l\'ajouter à son grimoire. En ligne, le lien de partage ouvre l\'import directement.']},
 {t:'Statistiques, sons et musique',l:['L\'onglet « Statistiques » du carnet compte tes préparations, tes techniques, tes ingrédients favoris, la qualité de ton travail, tes meilleures créations et tes meilleurs clients.','Le bouton en forme de haut-parleur règle les bruitages (bocaux, chaudron, mortier, pièces) et la musique d\'ambiance, avec le volume. Tout est synthétisé, sans fichier.']},
 {t:'Remplir le carnet des découvertes',l:[`Le <b>Carnet</b> (en haut) note tout ce que tu observes : produits étudiés, effets, types, formes, réactions, phénomènes, techniques et finitions. Un pourcentage indique où tu en es.`,`Un produit n'a que trois étoiles quand tous ses effets ont été observés et qu'il a été travaillé sous au moins cinq techniques : broie-le pur, macère-le à l'alcool, distille-le, infuse-le tiède et chaud…`,`Les effets ont quatre intensités, qui se découvrent séparément : concentre ou dilue pour les faire toutes apparaître.`,`Les réactions notent la recette qui les a provoquées, et les accidents disent comment les éviter. Les zones grisées donnent un indice sur ce qui reste à trouver.`,`Tu peux écrire une note personnelle sur chaque produit et sur chaque effet, et copier un résumé du carnet.`]},
 {t:'Faire un pigment plus vif et plus tenace',l:[`Broie les pigments minéraux (azur, lapis, ocre, malachite) : ils sont insolubles.`,`Pour un colorant végétal ou animal (garance, safran, cochenille), fais une décoction avec de l'<b>alun</b> : c'est une <i>laque</i>, plus vive et deux fois plus durable.`,`Un vitriol vert <i>calciné</i> donne un rouge de fer (colcotar).`,`Pour une couleur brune, torréfie un sucre : c'est un caramel.`]},
 {t:'Purifier une substance',l:[`<b>Cristalliser</b> un sel : les cristaux sont plus purs et se gardent des années.`,`<b>Sublimer</b> un corps volatil solide (soufre, camphre, benjoin, ambre).`,`<b>Distiller</b> un liquide ou une plante à essences.`,`<b>Filtrer</b> ou <b>décanter</b> un liquide trouble.`]},
 {t:'Faire une crème ou un lait pour la peau',l:[`Choisis l'<i>émulsion</i> : un liquide aqueux (eau de rose, eau de fleur d'oranger), un corps gras (beurre de noix, suif) et un émulsifiant (lanoline, saponaire, gomme d'acacia, jaune d'œuf).`,`Peu d'eau (moins de 2,5 fois le gras) : une crème. Beaucoup d'eau : un lait liquide.`,`Ajoute des plantes mucilagineuses (mauve, consoude) pour hydrater.`,`Une crème se garde environ deux mois : elle contient de l'eau.`]},
 {t:'Faire des pastilles, des bougies ou des savonnettes',l:[`<b>Mouler</b> est une technique de liants : miel ou glycérine pour des pastilles, cire pour une bougie parfumée, graisse pour un bâton de baume.`,`Un alcali (sel de soude) et une graisse donnent une savonnette.`,`Les poudres se dosent facilement : c'est la forme solide la plus durable.`]},
 {t:'Faire un charbon ou un caramel',l:[`<b>Torréfier</b> à feu vif un végétal sec : il se carbonise. Le charbon végétal est un antidote.`,`Torréfier un sucre (miel, sang-de-bouleau) à feu franc donne un caramel : colorant brun.`,`Les plantes à essences (mélisse, menthe, lavande) perdent tout au grillage : ne les torréfie pas.`]},
 {t:'Choisir la bonne dose',l:[`Chaque fiche donne une <i>prise conseillée</i>, calculée à partir de la force de la mixture : plus elle est puissante, plus la prise est petite.`,`Si la mixture est dangereuse, réduis la dose de moitié, voire davantage.`,`Un poison n'a pas de prise conseillée : il ne se prend pas.`]}
];

const SOLV_NAMES=[['eau','Eau'],['alcool','Alcool'],['huile','Huile'],['vinaigre','Vinaigre']];
const CLS_LABEL={mucil:'Mucilages et tanins',alcal:'Alcaloïdes et amers',resine:'Résines',gras:'Corps gras',sel:'Sels solubles',metal:'Métaux',ess:'Essences',inerte:'Poudres insolubles'};
function pctCell(v){const p=Math.round(v*100);return `<td class="pc" style="--p:${Math.min(100,p)}%">${p}</td>`}
function solTableHTML(){
  return `<table class="mt"><thead><tr><th>Principes actifs</th>${SOLV_NAMES.map(s=>`<th>${s[1]}</th>`).join('')}</tr></thead><tbody>${['mucil','alcal','resine','ess','sel','metal','gras','inerte'].map(c=>`<tr><th>${CLS_LABEL[c]}</th>${SOLV_NAMES.map(s=>pctCell(SOL[c][s[0]])).join('')}</tr>`).join('')}</tbody></table><p class="mnote">Part dissoute, en pourcentage.</p>`;
}
function pfTableHTML(){
  const rows=[['tendre','Fleurs, feuilles'],['dur','Racines, écorces, baies'],['resine','Résines'],['sel','Sels'],['metal','Métaux'],['animal','Substances animales'],['inerte','Poudres insolubles']];
  return `<table class="mt"><thead><tr><th>Partie</th><th>Infusion</th><th>Décoction</th><th>Macération</th></tr></thead><tbody>${rows.map(([p,l])=>`<tr><th>${l}</th>${['infuser','decocter','macerer'].map(t=>pctCell(PF[t][p]||0)).join('')}</tr>`).join('')}</tbody></table><p class="mnote">Part extraite avant le solvant. Une poudre insoluble reste en suspension (50 %) ou est retirée par le filtre.</p>`;
}
function antsynHTML(){
  const n=k=>FX[k].n.toLowerCase();
  return `<p><b>S'annulent en partie :</b></p><ul class="plain">${ANT.map(a=>`<li>${n(a[0])} et ${n(a[1])}${a[3]?' (l\'émollient adoucit l\'irritant, sans se consommer)':''}</li>`).join('')}</ul><p><b>Se renforcent :</b></p><ul class="plain">${SYN.map(s=>`<li>${n(s[0])} et ${n(s[1])} (× ${String(s[2]).replace('.',',')})</li>`).join('')}</ul>`;
}
function yieldTable(g){
  const cols=[['Broyage','broyer',null],['Infusion','infuser','eau'],['Décoction','decocter','eau'],['Macération, alcool','macerer','alcool'],['Macération, huile','macerer','huile'],['Macération, vinaigre','macerer','vinaigre'],['Distillation, eau','distiller','eau'],['Onguent','petrir','huile'],['Fumigation','fumiger',null],['Calcination','calciner',null],['Torréfaction','torrefier',null],['Cristallisation','cristalliser','eau'],['Sublimation','sublimer',null],['Émulsion','emulsionner','eau'],['Moulage','mouler',null]];
  const cells=cols.map(([l,t,sk])=>{
    let e=0;try{e=extractionOf(g,{tech:t,feu:1,sk,spw:1,fin:{filtrer:false}}).e}catch(x){}
    return [l,Math.round(e*100)];
  });
  return `<table class="mt"><thead><tr><th>Technique</th><th>Part extraite</th></tr></thead><tbody>${cells.map(([l,p])=>`<tr><th>${l}</th>${pctCell(p/100)}</tr>`).join('')}</tbody></table><p class="mnote">À chaleur moyenne, en pourcentage. Plus la part est haute, plus les vertus passent dans la préparation. La calcination ne conserve que les effets astringent, colorant, conservateur et antiseptique.</p>`;
}
function productHTML(id){
  const g=BY[id];if(!g)return '';
  const cat=CATS.find(c=>c.id===g.cat);
  const pa=g.pa||PA_AUTO[g.s]||'';
  let h=`<div class="pd-head"><div class="pd-jar">${jarSVG(g)}</div><div><h3>${esc(g.n)}</h3><p class="muted">${esc(cat?cat.n:'')}${g.role?', '+(g.role==='solvant'?'liquide':'liant'):''}</p><p>${esc(g.d)}</p></div></div>`;
  if(g.cat==='bases'){
    h+=`<h4>Propriétés</h4><ul class="plain"><li>${g.role==='solvant'?`Liquide de type <b>${esc(g.kind)}</b>${g.pw?` (extraction à ${Math.round(g.pw*100)} % de celle du solvant pur)`:''}.`:`Liant de type <b>${esc(g.kind==='gras'?'corps gras':g.kind==='cire'?'cire':g.kind)}</b>.`}</li>`;
    if(g.role==='solvant'){
      h+=`<li>Dissout : ${SOLV_NAMES.filter(s=>s[0]===g.kind).length?`selon la famille de principes actifs (voir le tableau de solubilité).`:''}</li>`;
      const tt=TECH_ORDER.filter(t=>TECH[t].solv.includes(g.id)).map(t=>TECH[t].n.toLowerCase());
      h+=`<li>S'emploie avec : ${esc(joinFr(tt))}.</li>`;
    }else{
      const tt=TECH_ORDER.filter(t=>TECH[t].adj.includes(g.id)).map(t=>TECH[t].n.toLowerCase());
      h+=`<li>S'emploie avec : ${esc(joinFr(tt))}.</li>`;

function entriesHTML(){

  if(!all.length)return `<div class="empty">Ce grimoire est vide. Prépare une mixture, puis inscris-la depuis sa fiche.</div>`;
  if(!a.length)return `<div class="empty">Aucune recette ne correspond à cette recherche.</div>`;
  const fmt=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  return a.map(e=>{const top=e.res.fx.slice(0,2).map(f=>FX[f.id].n.toLowerCase());return `<button class="entry" data-a="open" data-id="${esc(e.id)}" aria-current="${S.openId===e.id}">${sealSVG(e.res.type,40)}<div><div class="en">${esc(e.name)}</div><div class="em">${esc(TYPES[e.res.type].n)}, ${esc(e.res.form.toLowerCase())}${top.length?', '+esc(top.join(' et ')):''}</div><div class="em">Inscrite le ${fmt(e.t)}</div>${e.res.qty>0?`<div class="em">Une portion donne ${esc(fmtQty(e.res.qty,e.res.unit||(e.res.liquid?'ml':'g')))}</div>`:''}${lockTag(e)}</div></button>`}).join('');
}
function renderEntries(){const el=$('#entries');if(el)el.innerHTML=entriesHTML()}
function openBookHTML(){
  const b=bookOf(S.openBook);
  if(!b){S.openBook=null;return libraryHTML()}
  const all=entriesOf(b.id),cur=S.openId&&all.find(e=>e.id===S.openId);
  const counts={};all.forEach(e=>counts[e.res.type]=(counts[e.res.type]||0)+1);
  const filt=`<div class="filters" role="group" aria-label="Filtrer par type"><button data-a="filter" data-id="all" aria-pressed="${S.filter==='all'}">Toutes (${all.length})</button>${Object.keys(counts).map(t=>`<button data-a="filter" data-id="${t}" aria-pressed="${S.filter===t}">${TYPES[t].n} (${counts[t]})</button>`).join('')}</div>`;
  const left=`<button class="btn small back" data-a="closebook">Retour à l'étagère</button><header class="bk-head"><span class="bk-emb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[b.icon]||ICON.flask}</svg></span><div><h2>${esc(b.name)}</h2><p class="pm">${all.length} recette${all.length>1?'s':''}</p></div></header><div class="row"><button class="btn small" data-a="editbook" data-id="${esc(b.id)}">Modifier ce grimoire</button></div><div class="toolbar"><input type="search" placeholder="Chercher dans ce grimoire" aria-label="Chercher dans ce grimoire" data-i="bq" value="${esc(S.q)}"><select data-i="bsort" aria-label="Trier"><option value="recent"${S.sort==='recent'?' selected':''}>Les plus récentes</option><option value="nom"${S.sort==='nom'?' selected':''}>Par nom</option><option value="type"${S.sort==='type'?' selected':''}>Par type</option><option value="qualite"${S.sort==='qualite'?' selected':''}>Par qualité</option></select>${filt}</div><div class="entries" id="entries">${entriesHTML()}</div>`;
  const right=cur?`<button class="btn small back2" data-a="closeEntry">Retour à la liste</button>${ficheHTML(cur.res,{mode:'entry',entry:cur})}`:`<div class="empty-res">${toolSVG('macerer',true)}<h2>Choisis une recette</h2><p>Sa fiche complète s'affiche sur cette page, avec tes notes.</p></div>`;
  return `<div class="openwrap"><div class="openbook${cur?' has-detail':''}" style="--cover:${colOf(b)}"><section class="page left" aria-label="Sommaire">${left}</section><section class="page right" aria-label="Recette">${right}</section></div></div>`;
}

const RXKEY=n=>n&&n.indexOf('Laque')===0?'Laque':n;
function achOnBrew(r){
  const st=S.ach.st,rc=r.recipe;
  st.brews++;
  const t=rc.tech;st.techs[t]=(st.techs[t]||0)+1;
  st.types[r.type]=1;st.forms[r.form]=1;
  if(r.special){const k=RXKEY(r.special.name);if(RX.some(x=>x[0]===k))st.rx[k]=1}
  (r.comps||[]).forEach(c=>{if(BY[c.id]&&!BY[c.id].role)st.ings[c.id]=1});
  r.ingr.forEach(i=>{if(BY[i.id]&&BY[i.id].cat!=='bases')st.ings[i.id]=1});
  st.maxDanger=Math.max(st.maxDanger,r.danger.level);
  if(r.quality.score>=5)st.q5++;
  st.maxChain=Math.max(st.maxChain,(r.chain||[]).filter(s=>!s.finish).length);
  if((r.journal||[]).some(j=>/^Saturation/.test(j)))st.sat++;
  if(r.load>r.cap)st.over++;
  if((r.notes||[]).some(n=>/se séparer/.test(n)))st.emul++;
  st.shelfMax=Math.max(st.shelfMax,r.shelf.days||0);
  st.qtyMax=Math.max(st.qtyMax,r.qty||0);
  if(r.danger.level<=1&&r.ingr.some(i=>i.dg&&/mortel|très dangereux/i.test(i.dg)))st.dilute++;
  achCheck();
}
function achOnAccident(id){S.ach.st.acc[id]=1;achCheck()}
function achOnFinish(k,r){
  const st=S.ach.st;st.fins[k]=(st.fins[k]||0)+1;
  if((r.finishes||[]).length>=3)st.finCascade++;
  achCheck();
}
function achOnStock(){S.ach.st.stocked++;achCheck()}
function achOnServe(ev,order,pay){
  const st=S.ach.st;
  if(ev.sat>=.98)st.perfect++;
  if(order.event)st.evSales=(st.evSales||0)+1;
  const t=ordOf(order.tpl);if(t&&t.spec.types.includes('poison')&&pay>0)st.poisonSales++;
  achCheck();
}

let achQueue=[];
function achCheck(silent){
  if(typeof dcSyncCareer==='function'&&S.dc)dcSyncCareer();
  const s=achStats();let n=0;
  ACH.forEach(a=>{
    if(S.ach.got[a.id])return;
    let ok=false;try{ok=!!a.test(s)}catch(e){}
    if(ok){S.ach.got[a.id]=Date.now();n++;if(!silent)achQueue.push(a)}
  });
  if(n){achSave();achFlush();if(S.view==='shop'&&S.shopTab==='ach')renderShop()}
}
let achBusy=false;
function achFlush(){
  if(achBusy||!achQueue.length)return;
  const box=document.getElementById('achpop');if(!box){achQueue=[];return}
  achBusy=true;const a=achQueue.shift();if(typeof sndPlay==='function')sndPlay('bell');
  const el=document.createElement('div');el.className='achtoast';el.setAttribute('role','status');
  el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[a.ic]||ICON.star)+'</svg><div><small>'+esc(a.label||'Succès débloqué')+'</small><b>'+esc(a.n)+'</b><span>'+esc(a.d)+'</span></div>';
  box.appendChild(el);
  setTimeout(()=>el.classList.add('out'),4200);
  setTimeout(()=>{el.remove();achBusy=false;achFlush()},4700);
}

  };

}

const STATS_KEY='officine.v1.stats';
const statsDefault=()=>({v:1,since:Date.now(),brews:0,ml:0,g:0,byTech:{},byType:{},byIng:{},qual:[0,0,0,0,0,0],best:[],acc:0,clients:{},salesBest:null,maxQty:0});
function statsLoad(){
  try{const d=JSON.parse(LS.get(STATS_KEY)||'null');S.stats=d&&d.v===1?Object.assign(statsDefault(),d):statsDefault()}catch(e){S.stats=statsDefault()}
}
const statsSave=()=>LS.set(STATS_KEY,JSON.stringify(S.stats));
function statsOnBrew(r){
  const s=S.stats;if(!s||!r||!r.recipe||!r.type)return;
  s.brews++;
  const u=r.unit||(r.liquid?'ml':'g'),q=r.qty>0?r.qty:0;
  if(u==='ml')s.ml=Math.round((s.ml+q)*10)/10;else s.g=Math.round((s.g+q)*10)/10;
  s.maxQty=Math.max(s.maxQty,q);
  s.byTech[r.recipe.tech]=(s.byTech[r.recipe.tech]||0)+1;
  s.byType[r.type]=(s.byType[r.type]||0)+1;
  (r.recipe.items||[]).forEach(i=>{if(BY[i.id])s.byIng[i.id]=(s.byIng[i.id]||0)+1});
  s.qual[clamp(r.quality.score,0,5)]++;
  if(r.type!=='bourbe'){
    const pw=r.fx.length?r.fx[0].raw:0;
    s.best.push({n:r.name,t:r.type,q:r.quality.score,qr:r.qraw||r.quality.score,pw:+pw.toFixed(1),tech:r.recipe.tech,d:Date.now()});
    s.best.sort((a,b)=>b.qr-a.qr||b.pw-a.pw);if(s.best.length>8)s.best.length=8;
  }
  statsSave();
}
function statsOnAccident(){if(S.stats){S.stats.acc++;statsSave()}}
function statsOnServe(camp,order,ev,pay,res){
  const s=S.stats;if(!s)return;
  const k=order.client.name,c=s.clients[k]||(s.clients[k]={n:0,pay:0,st:0,job:order.client.job});
  c.n++;c.pay+=pay;c.st+=ev.stars;
  if(!s.salesBest||pay>s.salesBest.pay)s.salesBest={pay,product:res.name,client:k};
  statsSave();
}

const cmpFxRaw=(r,id)=>{const f=r.fx.find(x=>x.id===id);return f?f.raw:0};
/* score global d'une préparation, éventuellement selon un effet recherché */
function cmpScore(r,focus){
  const top=r.fx.slice(0,3).reduce((s,f)=>s+f.raw,0);
  if(focus)return cmpFxRaw(r,focus)*3+r.quality.score-r.danger.level*.5;
  return r.quality.score*1.5+top*.5-r.danger.level;
}
function cmpVerdict(A,B,na,nb,focus){
  const w=[];const add=(k,a,b,hi)=>{if(Math.abs(a-b)<1e-9)return;w.push({k,who:(hi?a>b:a<b)?'A':'B'})};
  add('la qualité',A.quality.score,B.quality.score,true);
  add('la puissance',A.fx.length?A.fx[0].raw:0,B.fx.length?B.fx[0].raw:0,true);
  add('la quantité',A.qty||0,B.qty||0,true);
  add('la conservation',A.shelf.days,B.shelf.days,true);
  add('la sécurité',A.danger.level,B.danger.level,false);
  const sa=cmpScore(A,focus),sb=cmpScore(B,focus);
  const win=Math.abs(sa-sb)<.15?null:sa>sb?'A':'B';
  const name=x=>x==='A'?na:nb;
  const why=k=>{const l=w.filter(x=>x.who===k).map(x=>x.k);return l.length?'Meilleure pour '+joinEt(l)+'.':''};
  let head;
  if(!win)head='Les deux se valent'+(focus?' pour '+FX[focus].n.toLowerCase():'')+'.';
  else head='« '+name(win)+' » est la meilleure'+(focus?' pour '+FX[focus].n.toLowerCase():'')+'.';
  return {win,head,a:why('A'),b:why('B')};
}

  ${row('Type',esc(TYPES[A.type].n),esc(TYPES[B.type].n),0,0,true)}

/* ============ PARTAGE ET IMPRESSION D'UNE RECETTE ============ */
const B64={
  enc:u8=>{let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
};
async function shareEncode(name,res){
  const bytes=new TextEncoder().encode(JSON.stringify({v:1,name:String(name).slice(0,80),res}));
  if(typeof CompressionStream!=='undefined'){
    try{
      const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(bytes).catch(()=>{});w.close().catch(()=>{});
      return 'OFFICINE1.'+B64.enc(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
    }catch(e){}
  }
  return 'OFFICINE0.'+B64.enc(bytes);
}
/* une préparation reçue doit avoir toute la forme d'une vraie préparation : on ne fait pas confiance au texte reçu */
function shareResSane(r){
  try{
    if(!resOK(r))return false;
    const num=x=>Number.isFinite(x);
    if(!r.quality||!num(r.quality.score)||r.quality.score<0||r.quality.score>5||typeof r.quality.label!=='string')return false;
    if(!r.shelf||typeof r.shelf.label!=='string'||!num(r.shelf.days))return false;
    if(!r.danger||!num(r.danger.level)||typeof r.danger.label!=='string')return false;
    if(!r.sensory||typeof r.sensory.aspect!=='string'||typeof r.sensory.smell!=='string')return false;
    if(typeof r.name!=='string'||typeof r.form!=='string'||typeof r.dose!=='string')return false;
    if(!r.fx.every(f=>num(f.raw)&&num(f.tier)&&f.tier>=0&&f.tier<=3))return false;
    if(!Array.isArray(r.alt)||!r.alt.every(a=>TYPES[a]))return false;
    if(!TECH[(r.recipe||{}).tech])return false;
    ficheHTML(r,{fresh:false,mode:'ro'});chainOf(r).forEach(s=>stepLines(s));
    return true;
  }catch(e){return false}
}
async function shareDecode(text){
  text=String(text||'').trim();if(text.length>400000)return null;
  const m=text.match(/OFFICINE([01])\.([A-Za-z0-9_-]+)/);if(!m)return null;
  try{
    let bytes=B64.dec(m[2]);
    if(m[1]==='1'){
      if(typeof DecompressionStream==='undefined')return null;
      const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes).catch(()=>{});w.close().catch(()=>{});
      bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
    }
    if(bytes.length>1500000)return null;
    const d=JSON.parse(new TextDecoder().decode(bytes));
    if(!d||d.v!==1||typeof d.name!=='string'||!shareResSane(d.res))return null;
    return {name:d.name.slice(0,80),res:d.res};
  }catch(e){return null}
}

}

  });
  y+=30;g.push(`<line x1="${P}" y1="${y-14}" x2="${W-P}" y2="${y-14}" stroke="#b79b62" stroke-width="1"/>`);
  text('L\'officine · recette partagée',W/2,y+6,13,{a:'middle',c:'#8a7448',i:1});
  const H=y+34;
  return {w:W,h:H,svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect x="0" y="0" width="${W}" height="${H}" rx="14" fill="#f3e8cc"/><rect x="10" y="10" width="${W-20}" height="${H-20}" rx="10" fill="none" stroke="#b79b62" stroke-width="2.5"/>${g.join('')}</svg>`};

/* ---------- construction d'une recette de la bibliothèque ---------- */
function libBuild(def){
  const MIX={},made=[];let cur=null;
  const tok=id=>(typeof id==='string'&&id[0]==='@')?made[+id.slice(1)]:id;
  for(let k=0;k<def.s.length;k++){
    const [t,f,items,sv,ad]=def.s[k];
    const rc={items:items.map(([id,q])=>({id:tok(id),q})),solvent:sv?tok(sv[0]):null,vol:sv?sv[1]:100,adj:ad?ad[0]:null,adjq:ad?ad[1]:20,tech:t,feu:f==null?1:f};
    cur=prepare(rc,MIX);if(cur.error||cur.accident)return null;
    if(k<def.s.length-1){const id='m:lib'+k;MIX[id]=mixIng(id,cur.name,cur,cur.qty);made.push(id)}
  }
  for(const [fin,lvl] of (def.fin||[])){const r2=applyFinish(cur,fin,lvl);if(r2.error)return null;cur=r2}
  return cur;
}
const LIB_BOOKS=[...new Set(LIB.map(d=>d.b))];
const libOf=b=>LIB.filter(d=>d.b===b);
/* combien de recettes de ce livre manquent encore dans tes grimoires ? */
function libMissing(b){
  const bk=S.books.find(x=>x.name===b);
  const have=new Set(bk?S.entries.filter(e=>e.bookId===bk.id).map(e=>e.name):[]);
  return libOf(b).filter(d=>!have.has(d.n)).length;
}
function libDlg(){
  const rows=LIB_BOOKS.map(b=>{const n=libOf(b).length,m=libMissing(b);return `<label class="librow"><input type="checkbox" data-i="libpick" value="${esc(b)}" ${m?'checked':'disabled'}><span><b>${esc(b)}</b><small>${n} recette${n>1?'s':''}${m===n?'':' · '+(m?m+' à ajouter':'déjà toutes ajoutées')}</small></span></label>`}).join('');
  const tot=LIB.length;
  openDlg(`<h2>Bibliothèque de recettes</h2><p class="small muted">${tot} recettes prêtes à l'emploi, rangées par type de mixture dans tes grimoires : remèdes, baumes, toniques, poisons, parfums, couleurs, savons et bien d'autres. Chaque recette a un nom clair et une note (à quoi elle sert, comment l'employer). Les livres qui n'existent pas encore sont créés. Rien n'est jamais écrasé.</p><div class="libbox">${rows}</div><p class="small muted">Les recettes qui demandent un produit du marchand indiquent lequel dans leur note ; en carrière, elles s'affichent « à refaire en mode libre » tant que tu ne l'as pas acheté.</p><div class="actions"><button class="btn primary" data-a="libgo">Ajouter à mes grimoires</button><button class="btn" data-a="closeDlg">Fermer</button></div>`,'libdlg');
}
function libGo(){
  const names=$$('#dlg [data-i="libpick"]:checked').map(x=>x.value);
  if(!names.length){toast('Choisis au moins un livre');return}
  ensureBooks();
  let n=0,nb=0,base=Date.now();
  names.forEach(b=>{
    let bk=S.books.find(x=>x.name===b);
    if(!bk){const st=LIB_STYLE[b]||['bordeaux','flask'];bk=newBook(b,st[0],st[1]);nb++}
    const have=new Set(S.entries.filter(e=>e.bookId===bk.id).map(e=>e.name));
    libOf(b).forEach(d=>{
      if(have.has(d.n))return;
      const r=libBuild(d);if(!r)return;
      S.entries.push({id:'e'+uid(),t:base+(n++),name:d.n,note:d.note,res:r,bookId:bk.id});
    });
  });
  persistBooks();persistEntries();achCheck();
  closeDlg();if(S.view==='books')renderBooks();renderChrome();
  toast(n?n+' recette'+(n>1?'s':'')+' ajoutée'+(n>1?'s':'')+(nb?', '+nb+' grimoire'+(nb>1?'s':'')+' créé'+(nb>1?'s':''):''):'Rien de nouveau à ajouter');
}
const LBCA={libopen:libDlg,libgo:libGo};
/* ============ GUIDE : missions guidées ============ */
let gTimerId=null;
const gfmt=n=>String(Math.round(n*10)/10).replace('.',',');
const gTok=id=>(typeof id==='string'&&id[0]==='@')?(S.guide&&S.guide.made[+id.slice(1)]):id;
const gG=id=>{const r=gTok(id);return r&&(BY[r]||S.mixes[r])};
const gname=id=>{const g=gG(id);return g?g.n:'le contenant'};
const gcat=id=>{const g=gG(id);return !g?'plantes':g.mix?'reserve':g.cat};
const gwhy=id=>{const g=gG(id);return !g?'':g.mix?g.res.form+' : '+TYPES[g.res.type].n.toLowerCase()+', '+g.res.danger.label.toLowerCase()+'.':g.d};
function gLoad(){try{const g=JSON.parse(LS.get('officine.v1.guide')||'null');if(g){S.gdone=Array.isArray(g.done)?g.done.filter(id=>gMission(id)):[];if(g.mode==='mission'||g.mode==='tuto')S.gmode=g.mode}}catch(e){}}
function gPersist(){LS.set('officine.v1.guide',JSON.stringify({done:S.gdone,mode:S.gmode}))}

/* ---------- construction des étapes ---------- */
function gConcWhy(E){
  const g=E.items.filter(i=>i.id[0]!=='@').reduce((s,i)=>s+i.q,0);
  if(!E.solvent||!g||!['infuser','decocter','macerer','distiller','fermenter'].includes(E.tech))return '';
  const c=g*100/E.vol;return 'Cela fait '+gfmt(c)+' g pour 100 ml : concentration '+concLabel(c)+'.';
}
function gDiff(rec,E){
  const out=[],T=TECH[E.tech];
  if(rec.tech!==E.tech)out.push('technique « '+TECH[rec.tech].n+' » au lieu de « '+T.n+' »');
  E.items.forEach(it=>{const id=gTok(it.id),got=rec.items.find(x=>x.id===id);if(!got)out.push('il manque '+gname(it.id));else if(Math.abs(got.q-it.q)>.01)out.push(gname(it.id)+' : '+gfmt(got.q)+' au lieu de '+gfmt(it.q));});
  rec.items.forEach(x=>{if(!E.items.some(it=>gTok(it.id)===x.id))out.push('« '+(G(x.id)?G(x.id).n:x.id)+' » n\'est pas prévu')});
  const es=E.solvent?gTok(E.solvent):null;
  if((rec.solvent||null)!==(es||null))out.push(es?'le liquide devrait être « '+gname(E.solvent)+' »':'aucun liquide n\'est prévu');
  else if(es&&rec.vol!==E.vol)out.push('liquide : '+rec.vol+' ml au lieu de '+E.vol+' ml');
  if((rec.adj||null)!==(E.adj||null))out.push(E.adj?'le liant devrait être « '+gname(E.adj)+' »':'aucun liant n\'est prévu');
  else if(E.adj&&rec.adjq!==E.adjq)out.push('liant : '+rec.adjq+' g au lieu de '+E.adjq+' g');
  if(T.heat&&rec.tech===E.tech&&rec.feu!==E.feu)out.push('chaleur « '+T.heat[rec.feu]+' » au lieu de « '+T.heat[E.feu]+' »');
  return out;
}
function gBuild(m){
  const steps=[],st=()=>S.guide;
  const add=o=>steps.push(o);
  const R=()=>st().res[st().res.length-1];
  const setCat=id=>{const c=gcat(id);S.cat=c;renderShelf()};
  let exp=null,prevK=null,last=null;
  const addRead=(sel,text,why,label)=>add({kind:'say',ack:true,view:'result',label,sel,text,why});
  const reads=sg=>{
    if(sg.lesson){
      addRead(()=>'#result .f-head',()=>{const r=R();return 'Voici « '+r.name+' » : '+TYPES[r.type].n.toLowerCase()+', qualité '+r.quality.label.toLowerCase()+', '+r.danger.label.toLowerCase()+'.'},()=>sg.lesson,'Lire la fiche');
      addRead(()=>R()&&R().danger.level>=1?'#result .danger-g':'#result .fx',()=>{const r=R();return (r.danger.level>=1?'Niveau de danger : '+r.danger.label+'. ':'')+'Ses principales vertus : '+gTop(r,3)+'. Chaque barre indique l\'intensité, du faible à l\'intense.'},()=>'','Vertus et dangers');
    }
    if(sg.after)addRead(()=>'#result .kv',()=>sg.after(R(),st().res),()=>'','Comparer');
  };
  const brew=sg=>{
    if(sg.same)exp=JSON.parse(JSON.stringify(exp));else exp=gRecipe(sg);
    const E=exp,T=TECH[E.tech];
    const prev=last;if(!sg.same)last={tech:E.tech,feu:E.feu};
    if(!sg.same){
      if(sg.clear)add({kind:'clear',view:'bench',label:'Vider l\'établi',sel:()=>'[data-a="clear"]',text:()=>'Vide l\'établi pour repartir de zéro.',why:()=>'Garde ta fiche précédente : elle reste sur le côté.',enter:()=>{S.mode='concoct';renderBench()},done:()=>!S.items.length&&!S.solvent&&!S.adj});
      if(!(prev&&prev.tech===E.tech))add({kind:'tech',arg:E.tech,view:'bench',label:'Technique : '+T.n,sel:()=>'.tech [data-id="'+E.tech+'"]',text:()=>'Choisis la technique « '+T.n+' ».',why:()=>T.d,
        enter:()=>{S.mode='concoct';if(S.tech===E.tech){S.tech=E.tech==='broyer'?'infuser':'broyer';persist()}renderBench()},done:()=>S.tech===E.tech});
      const addItem=it=>{
        const id=it.id,isTok=id[0]==='@',unit=()=>{const g=gG(id);return g&&g.liquidMix?'ml':'g'};
        add({kind:'add',arg:id,view:'shelf',label:()=>'Poser : '+gname(id),sel:()=>'.slot[data-id="'+gTok(id)+'"]',
          text:()=>isTok?'Prends « '+gname(id)+' » dans la Réserve et pose-le sur l\'établi.':'Pose « '+gname(id)+' » sur l\'établi (touche son bocal).',why:()=>(sg.why&&sg.why[id])||gwhy(id),
          enter:()=>{S.mode='concoct';setCat(id);renderBench()},done:()=>S.items.some(i=>i.id===gTok(id))});
        add({kind:'qty',arg:id,val:it.q,view:'bench',label:()=>'Quantité de '+gname(id)+' : '+gfmt(it.q)+' '+unit(),up:'.chip',sel:()=>'.qin[data-id="'+gTok(id)+'"]',
          text:()=>'Règle la quantité de « '+gname(id)+' » sur '+gfmt(it.q)+' '+unit()+'.',why:()=>'Utilise − et +, ou tape la valeur dans la case.',
          done:()=>{const x=S.items.find(i=>i.id===gTok(id));return !!x&&Math.abs(x.q-it.q)<.01}});
      };
      E.items.filter(i=>i.id[0]!=='@').forEach(addItem);
      if(E.solvent){
        const sid=E.solvent;
        add({kind:'solv',arg:sid,view:'shelf',label:()=>'Liquide : '+gname(sid),sel:()=>'.slot[data-id="'+gTok(sid)+'"]',text:()=>'Pose « '+gname(sid)+' » comme liquide'+(sid[0]==='@'?'.':' (rayon Bases).'),why:()=>gwhy(sid),
          enter:()=>{setCat(sid)},done:()=>S.solvent===gTok(sid)});
        add({kind:'vol',arg:E.vol,val:E.vol,view:'bench',label:'Volume : '+E.vol+' ml',up:'.base',sel:()=>'[data-i="vol"]',text:()=>'Règle le volume de liquide sur '+E.vol+' ml (le curseur de la case « Liquide »).',why:()=>gConcWhy(E),done:()=>S.vol===E.vol});
      }
      E.items.filter(i=>i.id[0]==='@').forEach(addItem);
      if(E.adj){
        const aid=E.adj;
        add({kind:'adj',arg:aid,view:'shelf',label:()=>'Liant : '+gname(aid),sel:()=>'.slot[data-id="'+aid+'"]',text:()=>'Pose « '+gname(aid)+' » comme liant (rayon Bases).',why:()=>gwhy(aid),enter:()=>{setCat(aid)},done:()=>S.adj===aid});
        add({kind:'adjq',arg:E.adjq,val:E.adjq,view:'bench',label:'Liant : '+E.adjq+' g',up:'.base',sel:()=>'[data-i="adjq"]',text:()=>'Règle la quantité de liant sur '+E.adjq+' g (le curseur de la case « Liant »).',why:()=>'Le liant fait le corps de la préparation : plus il y en a, plus la matière y est diluée.',done:()=>S.adjq===E.adjq});
      }
      if(T.heat&&!(prev&&prev.tech===E.tech&&prev.feu===E.feu))add({kind:'heat',arg:E.feu,view:'bench',label:'Chaleur : '+T.heat[E.feu],sel:()=>'.seg [data-a="feu"][data-n="'+E.feu+'"]',text:()=>'Règle la chaleur sur « '+T.heat[E.feu]+' ».',why:()=>T.heatTip[E.feu],
        enter:()=>{if(S.feu===E.feu){S.feu=E.feu===1?0:1;persist();renderBench()}},done:()=>S.feu===E.feu});
    }
    add({kind:'brew',view:'bench',label:'Préparer',sel:()=>'#brew',text:()=>'Appuie sur « Préparer ».',why:()=>S.msg?'Message de l\'établi : '+S.msg:'Il ne reste qu\'à lancer la préparation.',
      done:()=>{
        const g=st(),r=S.result;if(!r||r===g.ref.result)return false;
        g.ref.result=r;
        if(r.accident){g.warn='Accident : '+r.accident.title+'. Reprends la préparation avec les valeurs indiquées.';return false}
        const diff=gDiff(r.recipe,E);
        if(diff.length){g.warn='Ce n\'est pas la recette prévue : '+diff.join(' ; ')+'. Corrige et prépare de nouveau.';return false}
        if(sg.expect&&r.type!==sg.expect&&!(r.alt||[]).includes(sg.expect)){g.warn='La préparation n\'a pas donné ce qui était attendu : « '+TYPES[r.type].n+' » au lieu de « '+TYPES[sg.expect].n+' ». Vide l\'établi et reprends l\'étape avec les valeurs indiquées, en vérifiant surtout le contenant utilisé et la chaleur.';return false}
        g.warn='';g.res.push(r);return true;
      }});
    reads(sg);
  };
  m.stages.forEach(sg=>{
    if(sg.k==='tour')sg.steps.forEach(s=>add({kind:'say',ack:true,view:s.view,label:'Découvrir',sel:()=>s.sel,text:()=>s.t,why:()=>'',enter:()=>{if(s.view==='shelf'||s.view==='bench'){S.mode='concoct';renderBench()}}}));
    else if(sg.k==='brew')brew(sg);
    else if(sg.k==='tweak'){
      exp=JSON.parse(JSON.stringify(exp));
      if(sg.qty)Object.keys(sg.qty).forEach(id=>{const q=sg.qty[id];exp.items.find(i=>i.id===id).q=q;
        add({kind:'qty',arg:id,val:q,view:'bench',label:'Quantité de '+gname(id)+' : '+gfmt(q)+' g',up:'.chip',sel:()=>'.qin[data-id="'+id+'"]',text:()=>(sg.t?sg.t+' ':'')+'Règle « '+gname(id)+' » sur '+gfmt(q)+' g.',why:()=>'Regarde la ligne « Concentration » se mettre à jour.',done:()=>{const x=S.items.find(i=>i.id===id);return !!x&&Math.abs(x.q-q)<.01}})});
      if(sg.feu!=null){const T2=TECH[exp.tech];exp.feu=sg.feu;if(last)last.feu=sg.feu;
        add({kind:'heat',arg:sg.feu,view:'bench',label:'Chaleur : '+T2.heat[sg.feu],sel:()=>'.seg [data-a="feu"][data-n="'+sg.feu+'"]',text:()=>(sg.t?sg.t+' ':'')+'Règle la chaleur sur « '+T2.heat[sg.feu]+' ».',why:()=>T2.heatTip[sg.feu],done:()=>S.feu===sg.feu})}
      if(sg.adjq!=null){exp.adjq=sg.adjq;add({kind:'adjq',arg:sg.adjq,val:sg.adjq,view:'bench',label:'Liant : '+sg.adjq+' g',up:'.base',sel:()=>'[data-i="adjq"]',text:()=>(sg.t?sg.t+' ':'')+'Règle la quantité de liant sur '+sg.adjq+' g.',why:()=>'Moins de liant : la matière est moins diluée.',done:()=>S.adjq===sg.adjq})}
      if(sg.vol){exp.vol=sg.vol;add({kind:'vol',arg:sg.vol,val:sg.vol,view:'bench',label:'Volume : '+sg.vol+' ml',up:'.base',sel:()=>'[data-i="vol"]',text:()=>(sg.t?sg.t+' ':'')+'Règle le liquide sur '+sg.vol+' ml.',why:()=>'Plus de liquide pour la même matière : la concentration baisse.',done:()=>S.vol===sg.vol})}
    }
    else if(sg.k==='finish'){
      if(prevK!=='finish')add({kind:'finmode',view:'bench',label:'Onglet Finition',sel:()=>'.modetabs [data-m="finish"]',text:()=>'Ouvre l\'onglet « Finition » de l\'établi.',why:()=>'Les finitions s\'appliquent à part, sur n\'importe quelle mixture, sans relancer de technique.',
        enter:()=>{if(S.mode==='finish')S.mode='concoct';renderBench()},done:()=>S.mode==='finish'});
      add({kind:'finkey',arg:sg.fin,view:'bench',label:'Finition : '+FIN[sg.fin].n,sel:()=>'.fins [data-k="'+sg.fin+'"]',text:()=>'Choisis la finition « '+FIN[sg.fin].n+' ».',why:()=>FIN[sg.fin].d,
        enter:()=>{S.mode='finish';S.finSrc='res';if(S.finKey===sg.fin)S.finKey=sg.fin==='filtrer'?'sceller':'filtrer';renderBench()},done:()=>S.finKey===sg.fin});
      if(sg.lvl)add({kind:'finlvl',arg:sg.lvl,view:'bench',label:'Niveau : '+RED_LVL[sg.lvl].n,sel:()=>'[data-a="finlvl"][data-k="'+sg.lvl+'"]',text:()=>'Choisis le niveau « '+RED_LVL[sg.lvl].n+' » ('+RED_LVL[sg.lvl].t+').',why:()=>'Plus on réduit, plus la préparation est concentrée, dangers compris.',
        enter:()=>{if(S.finLvl===sg.lvl){S.finLvl=sg.lvl==='moyen'?'leger':'moyen';renderBench()}},done:()=>S.finLvl===sg.lvl});
      add({kind:'dofin',view:'bench',label:'Appliquer',sel:()=>'[data-a="dofin"]',text:()=>'Appuie sur « Appliquer la finition ».',why:()=>S.msg||'Le résultat s\'affiche sur la fiche.',
        done:()=>{const g=st(),r=S.result;if(!r||r===g.ref.result)return false;g.ref.result=r;if(r.finishes&&r.finishes.some(f=>f.k===sg.fin)){g.res.push(r);return true}return false}});
      if(sg.lesson||sg.after)addRead(()=>'#result .kv',()=>sg.after?sg.after(R(),st().res):'Finitions appliquées : '+R().finishes.map(f=>f.l).join(', ')+'.',()=>sg.lesson||'','Lire le résultat');
    }
    else if(sg.k==='stock')add({kind:'stock',view:'result',label:'Transvaser',sel:()=>'#result [data-a="stock"]',
      text:()=>'Transvase la préparation dans un contenant : elle rejoint la Réserve avec sa quantité ('+fmtQty(S.result.qty,S.result.liquid?'ml':'g')+').',why:()=>'Un contenant devient un ingrédient : tu pourras le mélanger, le traiter ou le diluer à l\'étape suivante.',
      done:()=>{const g=st();if(S.stockedId&&S.stockedId!==g.ref.stocked){g.made.push(S.stockedId);return true}return false}});
    else if(sg.k==='save')add({kind:'save',view:'result',label:'Inscrire au grimoire',sel:()=>'#result [data-a="save"]',text:()=>'Appuie sur « Inscrire au grimoire… » : une fenêtre te demande le nom de la mixture et le grimoire où la ranger.',why:()=>'La préparation y reste avec sa recette complète, que tu pourras refaire à l\'identique.',
      done:()=>{const g=st();return !!S.savedId&&S.savedId!==g.ref.saved}});
    prevK=sg.k;
  });
  return steps;
}

/* ---------- déroulement ---------- */
function gStart(id){
  const m=gMission(id);if(!m)return;
  S.guide={id,i:-1,steps:[],ref:{},made:[],res:[],warn:'',open:false,acked:false};
  S.guide.steps=gBuild(m);
  S.items=[];S.solvent=null;S.adj=null;S.vol=VOLS.def;S.adjq=ADJQ.def;S.mode='concoct';S.msg='';S.organize=false;
  persist();renderShelf();renderBench();renderChrome();
  gEnter(0);
  clearInterval(gTimerId);gTimerId=setInterval(gTick,250);
}
function gStop(){clearInterval(gTimerId);gTimerId=null}
function gNav(s){
  const wide=isWide();
  if(['books','manual','guide'].includes(S.view))setView(wide?'bench':(s.view||'bench'));
  else if(!wide&&s.view&&S.view!==s.view)setView(s.view);
}
function gEnter(i){
  const g=S.guide;if(!g)return;
  g.i=i;g.warn='';g.acked=false;g.lastEl=null;g.ref.result=S.result;g.ref.saved=S.savedId;g.ref.stocked=S.stockedId;
  const s=g.steps[i];
  if(s.enter)s.enter();
  gNav(s);
  gRender();
}
function gAdvance(){
  const g=S.guide;if(!g)return;
  if(g.i+1>=g.steps.length)gComplete();else gEnter(g.i+1);
}
function gTick(){
  const g=S.guide;if(!g){gStop();return}
  let n=0;
  while(S.guide&&n++<40){
    const s=g.steps[g.i];
    let ok=false;try{ok=s.ack?g.acked:s.done()}catch(e){ok=false}
    if(ok)gAdvance();else break;
  }
  if(S.guide)gRender();
}
function gComplete(){
  const g=S.guide,m=gMission(g.id);
  if(!S.gdone.includes(m.id))S.gdone.push(m.id);gPersist();achCheck();
  S.gfinal=S.result;S.gnext=(()=>{const i=MISSIONS.findIndex(x=>x.id===m.id);return MISSIONS[i+1]?MISSIONS[i+1].id:null})();
  gStop();S.guide=null;gRender();renderChrome();if(S.view==='guide')renderGuide();
  const nx=S.gnext&&gMission(S.gnext);
  openDlg('<h2>Mission accomplie</h2><p><b>'+esc(m.t)+'</b></p><p>'+esc(m.end)+'</p><h3 class="gh">À ta sauce</h3><ul>'+m.variants.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul><div class="actions"><button class="btn primary" data-a="gfinal">Poser cette recette sur l\'établi</button>'+(nx?'<button class="btn" data-a="gnextm" data-id="'+nx.id+'">Mission suivante : '+esc(nx.t)+'</button>':'')+'<button class="btn" data-a="gback">Retour au guide</button></div>');
}

/* ---------- affichage : barre de mission, surbrillance, bulle ---------- */
function gInfo(g,s){
  const safe=f=>{try{return typeof f==='function'?f():(f||'')}catch(e){return ''}};
  return {title:gMission(g.id).t,n:g.i+1,total:g.steps.length,text:safe(s.text),why:safe(s.why),warn:g.warn,ack:!!s.ack};
}
function gTarget(s){
  if(!s||!s.sel)return null;
  let q;try{q=s.sel()}catch(e){return null}
  if(!q)return null;
  let el=null;try{el=document.querySelector(q)}catch(e){return null}
  if(el&&s.up)el=el.closest(s.up)||el;
  if(!el)return null;
  const r=el.getBoundingClientRect();
  if(r.width<2||r.height<2)return null;
  const cs=getComputedStyle(el);if(cs.visibility==='hidden'||cs.display==='none')return null;
  return {el,r};
}
function gReveal(t){
  const pn=t.el.closest('.panel');if(!pn)return;
  const pr=pn.getBoundingClientRect(),r=t.el.getBoundingClientRect();
  if(r.top<pr.top+50||r.bottom>pr.bottom-20)pn.scrollTop+=(r.top-pr.top)-(pr.height/2-r.height/2);
}
function gHide(){const sp=$('#gspot'),po=$('#gpop');if(sp)sp.hidden=true;if(po)po.hidden=true}
function gBtns(g,info,missing){
  return (info.ack?'<button class="btn small primary" data-a="gnext">Compris</button>':'')+(missing?'<button class="btn small" data-a="gshow">Y aller</button>':'')+'<button class="btn small" data-a="gskip">Passer</button><button class="btn small" data-a="gmode">'+(S.gmode==='tuto'?'Mode mission':'Tutoriel guidé')+'</button><button class="btn small" data-a="gquit">Quitter</button>';
}
function gRender(){
  const g=S.guide,bar=$('#gbar'),po=$('#gpop'),sp=$('#gspot');
  if(!bar)return;
  if(!g){bar.className='gbar';if(bar.dataset.h){bar.innerHTML='';bar.dataset.h=''}gHide();return}
  const s=g.steps[g.i],info=gInfo(g,s),pct=Math.round(g.i/g.steps.length*100);
  if(S.gmode==='mission'){
    gHide();
    const list=g.steps.map((x,i)=>{let l='';try{l=typeof x.label==='function'?x.label():x.label}catch(e){l=''}return '<li class="'+(i<g.i?'ok':i===g.i?'cur':'')+'">'+esc(l||'Étape')+'</li>'}).join('');
    const h='<div class="gb-in"><div class="gb-top"><span class="gb-tag">Mission</span><b class="gb-title">'+esc(info.title)+'</b><span class="gb-step">Étape '+info.n+' sur '+info.total+'</span></div><div class="gb-bar"><i style="width:'+pct+'%"></i></div><p class="gb-text">'+esc(info.text)+'</p>'+(info.why?'<p class="gb-why">'+esc(info.why)+'</p>':'')+(info.warn?'<p class="gb-warn">'+esc(info.warn)+'</p>':'')+'<div class="gb-btns">'+gBtns(g,info,false)+'</div><details class="gb-list"'+(g.open?' open':'')+'><summary>Toutes les étapes</summary><ol>'+list+'</ol></details></div>';
    if(bar.dataset.h!==h){bar.innerHTML=h;bar.dataset.h=h}
    bar.className='gbar on';
    return;
  }
  // tutoriel guidé
  if(bar.dataset.h){bar.innerHTML='';bar.dataset.h=''}bar.className='gbar';
  const dlg=$('#dlg');
  if(S.view==='guide'||(dlg&&dlg.open)){gHide();return}
  const t=gTarget(s);
  const hasSel=(()=>{try{return !!(s.sel&&s.sel())}catch(e){return false}})();
  if(t&&g.lastEl!==t.el){g.lastEl=t.el;gReveal(t)}
  const r=t?t.el.getBoundingClientRect():null;
  const h='<div class="gp-head"><span class="gp-tag">Tutoriel</span><span class="gp-step">Étape '+info.n+' sur '+info.total+'</span><button class="gp-x" data-a="gquit" aria-label="Quitter le tutoriel">×</button></div><div class="gb-bar"><i style="width:'+pct+'%"></i></div><p class="gp-text">'+esc(info.text)+'</p>'+(info.why?'<p class="gp-why">'+esc(info.why)+'</p>':'')+(info.warn?'<p class="gp-warn">'+esc(info.warn)+'</p>':'')+(!t&&hasSel?'<p class="gp-why">L\'élément à montrer n\'est pas visible ici.</p>':'')+'<div class="gb-btns">'+gBtns(g,info,!t&&hasSel)+'</div>';
  if(po.dataset.h!==h){po.innerHTML=h;po.dataset.h=h}
  po.hidden=false;
  if(r){
    sp.hidden=false;
    const pad=6,L=Math.max(0,r.left-pad),T=Math.max(0,r.top-pad),W=Math.min(innerWidth-L,r.width+pad*2),H=Math.min(innerHeight-T,r.height+pad*2);
    sp.style.cssText='left:'+L+'px;top:'+T+'px;width:'+W+'px;height:'+H+'px';
  }else sp.hidden=true;
  gPlace(po,r);
}
function gPlace(po,r){
  const vw=innerWidth,vh=innerHeight,pw=po.offsetWidth,ph=po.offsetHeight,m=10;
  const dock=isWide()?0:(($('#dock')||{}).offsetHeight||0);
  const hdr=(($('.top')||{}).offsetHeight||50);
  let x=(vw-pw)/2,y=vh-dock-ph-m;
  if(r){
    if(vw<700){y=(r.top+r.height/2>vh/2)?hdr+m:vh-dock-ph-m}
    else{
      const cand=[[r.left+r.width/2-pw/2,r.bottom+14],[r.left+r.width/2-pw/2,r.top-ph-14],[r.right+14,r.top],[r.left-pw-14,r.top]];
      let ok=null;
      for(const [cx,cy] of cand){const px=Math.min(vw-pw-m,Math.max(m,cx)),py=Math.min(vh-ph-m,Math.max(hdr,cy));
        const hit=!(px+pw<r.left-6||px>r.right+6||py+ph<r.top-6||py>r.bottom+6);
        if(!hit){ok=[px,py];break}}
      if(ok){x=ok[0];y=ok[1]}else{x=vw-pw-m;y=vh-ph-m}
    }
  }
  po.style.left=Math.max(m,x)+'px';po.style.top=Math.max(hdr>0?m:0,y)+'px';
}

const CAMP_KEY='officine.v1.camp';

function campDefault(){return {money:CAMP_START.money,rating:CAMP_START.rating,unlocked:[],day:1,served:0,earned:0,cur:null,history:[],regs:{},event:null,evLog:[],evSeen:{},lastReg:0,typesServed:{},storiesDone:0,equip:{},spec:null,specAsked:false,shadow:0,rival:null,mentorOn:false,market:{}}}

function ticketHTML(o){

  const dr=o.after-o.before,i=o.info||{};

    story+=`<div class="tk-reg">♥ ${REG_LVL[i.lvl0]}${i.lvl1!==i.lvl0?' → <b>'+REG_LVL[i.lvl1]+'</b>':''}</div>`;

  }
  const duelTxt=i.duel?`<p class="tk-duel ${i.duel.won?'ok':'ko'}"><b>${i.duel.won?'Duel gagné !':'Duel perdu.'}</b> ${i.duel.won?'Ta mixture l\'emporte sur celle de Corvin.':'Corvin a fait mieux, ou pas assez de qualité.'}${i.duel.left?' <b>Corvin plie bagage et quitte le quartier.</b>':''}</p>`:'';
  const shTxt=i.shadowUp?`<p class="muted small">Ta notoriété grandit : on te dit maintenant « ${esc(SHADOW_NAMES[i.shadowUp].toLowerCase())} ».</p>`:'';
  const evEnd=i.eventEnd&&evOf(i.eventEnd)?`<p class="muted small">L'événement « ${esc(evOf(i.eventEnd).n)} » est terminé.</p>`:'';
  const tag=o.order.event&&evOf(o.order.event)?`<p class="muted small">Vente en période de « ${esc(evOf(o.order.event).n)} » : commande mieux payée.</p>`:'';

function campReward(){
  const c=S.camp;
  if(c.served>0&&c.served%4===0){c.day++;const e=campMaybeEvent(c);if(e&&e.id==='inspection')peopleInspection(c);toast(e?'Gazette du jour : '+e.n:'Un nouveau jour se lève sur l\'officine')}

const CA={
  campreset:()=>{
    if(S.campConfirm){
      S.campConfirm=false;resetCamp();S.shopTab='counter';renderShop();$('#shop').scrollTop=0;toast('Carrière réinitialisée');return;
    }
    S.campConfirm=true;renderShop();setTimeout(()=>{if(S.campConfirm){S.campConfirm=false;if(S.view==='shop')renderShop()}},4000);
  },
  shoptab:b=>{S.shopTab=b.dataset.id;renderShop();$('#shop').scrollTop=0},
  campmarket:()=>{S.shopTab='market';setView('shop')},
  campserve:()=>{
    const c=S.camp,cur=c.cur;if(!cur)return;
    const srcs=campSources(),src=srcs.find(s=>s.id===S.shopSrc)||srcs[0];
    if(!src){toast('Rien à livrer');return}
    const deliver=Math.min(src.qty,cur.spec.qty);
    const ev=campEval(cur.spec,src.res,deliver);ev.res=src.res;const pay=campPayFull(c,cur,ev,src.res);
    // le produit quitte l'officine
    if(src.id==='res'){
      const left=Math.round((src.qty-deliver)*10)/10;
      if(left>=5)newStock(src.res.name+' (reste)',src.res,left);
      S.result=null;S.savedId=null;S.stockedId=null;S.resultSrc=null;
    }else{
      const ct=S.reserve.find(x=>x.id===src.id);
      if(ct){ct.qty=Math.round((ct.qty-deliver)*10)/10;if(ct.qty<.5)removeStock(ct.id);else{rebuildMixes();persistReserve();clampItems();persist()}}
    }
    const before=c.rating;let r=before+(ev.stars-before)*.14;
    c.rating=clamp(r,.5,5);c.money+=pay;c.earned+=pay;c.served++;
    c.history.unshift({day:c.day,client:cur.client.name,job:cur.client.job,tpl:cur.tpl,ty:cur.ty||cur.spec.types[0],reg:cur.reg||null,pay,stars:ev.stars,sat:+ev.sat.toFixed(2),product:src.res.name});
    if(c.history.length>40)c.history.length=40;
    const info=campAfterServe(c,cur,ev);
    const mood=campMood(ev),react=campReact(ev,Math.random);
    statsOnServe(c,cur,ev,pay,src.res);if(pay>0)sndPlay('coin');campReward();achOnServe(ev,cur,pay);
    peopleAfterServe(c,info);
    campSpawn();S.shopSrc='res';
    renderShelf();renderBench();renderResult();renderChrome();renderShop();
    openDlg(ticketHTML({client:cur.client,order:cur,ev,pay,react,mood,before,after:c.rating,deliver,info}),'ticketdlg');
    peopleFlush();
  },
  campdecline:()=>{
    const c=S.camp;if(!c.cur)return;
    c.rating=clamp(c.rating-.06,.5,5);campSpawn();renderChrome();renderShop();toast('Le client repart, un peu vexé');achMisc('declined');
  },
  camphint:()=>{
    const c=S.camp,cur=c.cur;if(!cur)return;
    const cost=mentorMet(c)?0:15;
    if(c.money<cost){toast('Il te faut 15 F pour un conseil');return}
    c.money-=cost;campSave();renderChrome();renderShop();achMisc('hints');
    const o=ordOf(cur.tpl),rec=gRecipe(o.ref);
    const T=TECH[o.ref.tech],its=o.ref.items.map(([id,q])=>gfmt(q)+' g '+de(BY[id].n)),lines=[];
    lines.push('Technique : '+T.n.toLowerCase()+(T.heat?', chaleur « '+T.heat[rec.feu].toLowerCase()+' »':''));
    lines.push('Ingrédients : '+joinEt(its));
    if(o.ref.solvent)lines.push('Liquide : '+o.ref.solvent[1]+' ml '+de(BY[o.ref.solvent[0]].n));
    if(o.ref.adj)lines.push('Liant : '+o.ref.adj[1]+' g '+de(BY[o.ref.adj[0]].n));
    openDlg(`<h2>Le conseil de l'apothicaire</h2><p class="small muted">Une recette qui répond à cette commande. Adapte les quantités pour obtenir assez de produit.</p><ul>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><div class="actions"><button class="btn primary" data-a="camphintload">Poser sur l'établi</button><button class="btn" data-a="closeDlg">Fermer</button></div>`);
  },
  camphintload:()=>{
    const cur=S.camp.cur;if(!cur)return;
    const rec=gRecipe(ordOf(cur.tpl).ref);closeDlg();
    S.mode='concoct';const o=loadRecipe(rec);setView('bench');toast(redoToast(o));
  },
  campbuy:b=>{
    const c=S.camp,id=b.dataset.id,p=campPriceNow(id),t=campTierOf(id);
    if(c.unlocked.includes(id)||c.money<p||c.rating<TIER_INFO[t].min)return;
    c.money-=p;c.unlocked.push(id);campSave();achCheck();renderShelf();renderChrome();renderShop();
    const en=campEnables(id).filter(e=>!e.miss.length);
    toast(BY[id].n+' est sur ton étagère'+(en.length?' : nouvelles commandes possibles':''));
  }
};

const EQ_DISC={medecin:{balance:.85},parfumeur:{alambic:.8,mortier:.9},herboriste:{marmite:.8},alchimiste:{four:.8,alambic:.9}};
function equipPrice(id){
  const e=equipOf(id),l=eqLv(id),lv=e.lv[l];if(!lv)return 0;

}

/* score d'un résultat par rapport à un but */
function easyScore(r,goal,cfg){
  if(!r||r.error||r.accident)return -1e9;
  let s=r.quality.score*12-r.danger.level*18;
  if(r.type==='bourbe')return -300+r.quality.score;
  const top=r.fx.length?r.fx[0].raw:0;
  if(goal){
    if(goal.types.includes(r.type))s+=100;else if((r.alt||[]).some(a=>goal.types.includes(a)))s+=45;
    const need=Math.max(0,...r.fx.filter(f=>goal.fx.includes(f.id)).map(f=>f.raw));
    s+=Math.min(need,4.4)*7;if(need<1.8)s-=60;
    if(goal.ext&&r.ext!==goal.ext&&r.ext!=='mixte')s-=30;
  }else s+=Math.min(top,4.4)*5;
  if(cfg){
    const pf=(goal?EASY_PREF[goal.id]:EASY_PREF._none)||{};s+=pf[cfg.tech]||0;
    const heavy={distiller:22,emulsionner:8,mouler:10,fumiger:8,macerer:3}[cfg.tech]||0;if(!(pf[cfg.tech]>=4))s-=heavy;
    if(cfg.adj)s-=1;
  }
  return s;
}

function easySized(best,size,M){

  const mx=maxPortions(best.r),k=Math.max(1,Math.min(size,mx));

}

/* limites de quantité pour un ingrédient posé sur l'établi */
function limOf(g){
  if(g.mix){const av=g.avail>0?g.avail:1;return g.liquidMix?{min:Math.min(5,Math.floor(av)||1),max:Math.max(1,Math.min(500,Math.floor(av))),unit:'ml'}:{min:Math.min(QTY.min,av),max:Math.max(QTY.min,Math.min(QTY.max,Math.floor(av*2)/2)),unit:'g'}}
  return {min:QTY.min,max:QTY.max,unit:'g'};
}
const stepOf=(q,u)=>u==='ml'?(q<50?5:10):(q<5?.5:q<20?1:5);
const snapQ=(q,L)=>{let v=L.unit==='ml'?Math.round(q):Math.round(q*2)/2;return Math.min(L.max,Math.max(L.min,v))};
const defQ=g=>{const L=limOf(g);return snapQ(g.mix&&g.liquidMix?50:QTY.def,L)};
function clampItems(){
  S.items.forEach(it=>{const g=G(it.id);if(g)it.q=snapQ(+it.q||defQ(g),limOf(g))});
  const sv=S.solvent&&G(S.solvent);
  S.vol=clamp(Math.round(+S.vol||VOLS.def),sv&&sv.mix?Math.min(5,Math.floor(sv.avail)||5):VOLS.min,sv&&sv.mix?Math.max(5,Math.min(500,Math.floor(sv.avail))):VOLS.max);
  S.adjq=clamp(Math.round(+S.adjq||ADJQ.def),ADJQ.min,ADJQ.max);
}

function loadPlayState(){
  const suf=playSuf();
  S.reserve=[];S.items=[];S.solvent=null;S.adj=null;
  try{const rs=JSON.parse(LS.get('officine.v1.reserve'+suf)||'[]');S.reserve=(Array.isArray(rs)?rs:[]).filter(validStock);S.reserve.forEach(c=>{if(!(c.qty>0))c.qty=qtyOfRes(c.res)});S.reserve=S.reserve.filter(c=>c.qty>=.5)}catch(e){S.reserve=[]}
  rebuildMixes();const rm=mergeReserve();if(Object.keys(rm).length)persistReserve();
  try{
    const b=JSON.parse(LS.get('officine.v1.bench'+suf)||'null');
    if(b){
      S.items=(b.items||[]).map(i=>({id:rm[i.id]||i.id,q:i.q!=null?+i.q:(LEG[i.dose]||QTY.def)}))  .filter(i=>G(i.id)&&G(i.id).cat!=='bases'&&i.q>0&&(G(i.id).mix||campAvail(i.id))).slice(0,MAX_ITEMS);
      const bsv=rm[b.solvent]||b.solvent;S.solvent=bsv&&G(bsv)&&(G(bsv).mix||campAvail(bsv))&&(G(bsv).role==='solvant'||G(bsv).liquidMix)?bsv:null;
      S.adj=b.adj&&G(b.adj)&&G(b.adj).role==='adjuvant'&&campAvail(b.adj)?b.adj:null;
      if(TECH[b.tech])S.tech=b.tech;
      if([0,1,2].includes(b.feu))S.feu=b.feu;
      if(b.vol>0)S.vol=+b.vol;if(b.adjq>0)S.adjq=+b.adjq;
    }
  }catch(e){}
  clampItems();
}

function previewColor(){
  if(!S.items.length)return 'transparent';
  const T=TECH[S.tech];const list=S.items.map(i=>({c:G(i.id).col,w:Math.max(.2,i.q/(G(i.id).liquidMix?25:5))}));
  if(S.solvent&&G(S.solvent)&&solvAllowed(T,G(S.solvent)))list.push({c:G(S.solvent).col,w:S.vol/50});
  return mixHex(list);
}
