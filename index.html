<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'officine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#cfd7d8;--panel:#e0e6e5;--panel-2:#d2dad9;--line:#b1bebe;--text:#1d2a31;--muted:#53636b;
  --wood:#7a5637;--wood-2:#5d3f27;--wood-hi:#a88259;--shelf-back:#977753;--shelf-back-2:#7f6142;
  --paper:#f0e5c6;--paper-2:#e2d3aa;--paper-ink:#2a2116;--paper-mut:#6a583b;--paper-line:#a58f62;
  --btn-bg:#a9802d;--btn-ink:#fffaf0;--verdigris:#2f7d69;--madder:#b23f37;--brass:#a9802d;
  --glass-line:rgba(38,30,22,.55);--glass-fill:rgba(255,255,255,.32);
  --k-soin:#2f7d69;--k-esprit:#4a55a0;--k-danger:#a8382f;--k-matiere:#a8792a;
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ui:"Alegreya Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#111a22;--panel:#17222c;--panel-2:#1f2d39;--line:#2c3d4b;--text:#e8e1cf;--muted:#98a7b1;
  --wood:#6a4a2f;--wood-2:#4d3420;--wood-hi:#8d6640;--shelf-back:#0e151b;--shelf-back-2:#151f27;
  --paper:#e6d8b6;--paper-2:#d8c79d;--paper-ink:#2a2116;--paper-mut:#65533a;--paper-line:#a58f62;
  --btn-bg:#c9a14f;--btn-ink:#1c1710;--verdigris:#4fa38b;--madder:#c9574d;--brass:#c9a14f;
  --glass-line:rgba(232,226,210,.55);--glass-fill:rgba(190,220,232,.07);
}}
:root[data-theme="dark"]{
  --wall:#111a22;--panel:#17222c;--panel-2:#1f2d39;--line:#2c3d4b;--text:#e8e1cf;--muted:#98a7b1;
  --wood:#6a4a2f;--wood-2:#4d3420;--wood-hi:#8d6640;--shelf-back:#0e151b;--shelf-back-2:#151f27;
  --paper:#e6d8b6;--paper-2:#d8c79d;--paper-ink:#2a2116;--paper-mut:#65533a;--paper-line:#a58f62;
  --btn-bg:#c9a14f;--btn-ink:#1c1710;--verdigris:#4fa38b;--madder:#c9574d;--brass:#c9a14f;
  --glass-line:rgba(232,226,210,.55);--glass-fill:rgba(190,220,232,.07);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--wall);color:var(--text);font:17px/1.4 var(--ui);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:3px}
svg{display:block}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--brass);margin-right:auto}
.brand h1{font:400 26px/1 var(--display);color:var(--text);letter-spacing:.2px;white-space:nowrap}
@media (max-width:480px){.brand h1{font-size:21px}.top{padding:6px 12px;gap:8px}}
.nav{display:none;gap:6px}
.nav button,.iconbtn{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;color:var(--text)}
.nav button[aria-current="page"]{border-color:var(--line);background:var(--panel-2)}
.nav button:hover,.iconbtn:hover{background:var(--panel-2)}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;padding:0;font:600 18px var(--display)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--brass);color:var(--btn-ink);font-size:14px;font-weight:700;text-align:center}

.stage{min-height:0;display:block;position:relative}
.panel{display:none;height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.app[data-view="shelf"] .panel-shelf,.app[data-view="bench"] .panel-bench,.app[data-view="result"] .panel-result,.app[data-view="books"] .panel-books,.app[data-view="manual"] .panel-manual,.app[data-view="guide"] .panel-guide,.app[data-view="shop"] .panel-shop{display:block}

/* dock mobile */
.dock{display:grid;grid-template-columns:repeat(8,1fr);background:var(--panel);border-top:1px solid var(--line)}
.dock button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--muted);position:relative}
.dock button[aria-current="page"]{color:var(--text);box-shadow:inset 0 3px 0 var(--brass)}
.dock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock .count{position:absolute;top:3px;left:calc(50% + 6px);margin:0;font-size:12px;min-width:18px;line-height:18px;padding:0 4px}

@media (min-width:1000px){
  .cats{flex-wrap:wrap}
  .nav{display:flex}
  .dock{display:none}
  .app{grid-template-rows:auto auto minmax(0,1fr)}
  .stage{display:grid;grid-template-columns:minmax(300px,350px) minmax(0,1fr) minmax(340px,410px)}
  .panel-shelf,.panel-bench,.panel-result{display:block}
  .panel-books,.panel-manual,.panel-guide,.panel-shop{display:none}
  .app[data-view="shop"] .panel-shelf,.app[data-view="shop"] .panel-bench,.app[data-view="shop"] .panel-result{display:none}
  .app[data-view="shop"] .stage{display:block}
  .app[data-view="shop"] .panel-shop{display:block}
  .app[data-view="books"] .panel-shelf,.app[data-view="books"] .panel-bench,.app[data-view="books"] .panel-result,.app[data-view="manual"] .panel-shelf,.app[data-view="manual"] .panel-bench,.app[data-view="manual"] .panel-result,.app[data-view="guide"] .panel-shelf,.app[data-view="guide"] .panel-bench,.app[data-view="guide"] .panel-result{display:none}
  .app[data-view="books"] .stage,.app[data-view="manual"] .stage,.app[data-view="guide"] .stage{display:block}
  .app[data-view="books"] .panel-books,.app[data-view="manual"] .panel-manual,.app[data-view="guide"] .panel-guide{display:block}
  .panel-bench{border-inline:1px solid var(--line)}
}

/* ---------- étagère ---------- */
.panel-shelf{background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 8%,transparent 92%,rgba(0,0,0,.18)),repeating-linear-gradient(90deg,var(--shelf-back) 0 46px,var(--shelf-back-2) 46px 47px);position:relative}
.cats{position:sticky;top:0;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:10px 10px 9px;background:linear-gradient(var(--shelf-back) 70%,transparent);scrollbar-width:none}
.cat{flex:none;border:0;background:var(--paper);color:var(--paper-ink);font:400 15px/1 var(--display);padding:6px 11px 5px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 0 0 1px var(--paper-line);opacity:.62}
.cat[aria-pressed="true"]{opacity:1;box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 0 0 2px var(--brass)}
.shelf-sub{font:italic 400 18px var(--display);color:var(--paper);padding:10px 14px 0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));padding-top:8px}
.cell{position:relative}
.slot{display:block;width:100%;padding:0;border:0;background:none;text-align:center}
.jar{display:block;height:112px;padding:6px 6px 0;transition:transform .15s}
.jar svg{width:100%;height:100%}
.slot:hover .jar{transform:translateY(-4px)}
.plank{display:flex;align-items:center;justify-content:center;height:48px;background:linear-gradient(var(--wood-hi) 0 3px,transparent 3px),repeating-linear-gradient(92deg,transparent 0 17px,rgba(0,0,0,.09) 17px 18px,rgba(255,255,255,.035) 18px 34px),linear-gradient(var(--wood),var(--wood-2));box-shadow:0 9px 10px -6px rgba(0,0,0,.6),inset 0 -2px 0 rgba(0,0,0,.28)}
.tag{display:block;max-width:calc(100% - 10px);background:var(--paper);color:var(--paper-ink);font:400 13.5px/1.02 var(--display);padding:3px 6px 2px;border-radius:1px;box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 0 0 1px var(--paper-line)}
.cell.on .tag{background:var(--brass);color:var(--btn-ink)}
.badge{position:absolute;top:10px;right:14px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--brass);color:var(--btn-ink);font:700 14px/24px var(--ui);text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
.info{position:absolute;top:8px;left:12px;width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--glass-line);background:rgba(0,0,0,.35);color:#f2ead6;font:italic 700 15px/1 var(--display);opacity:.75}
.info:hover,.info:focus-visible{opacity:1}
.shelf-end{height:40px}

/* ---------- établi ---------- */
.pad{padding:16px 18px 28px;max-width:640px;margin:0 auto}
.h{font:400 21px/1.15 var(--display);margin:22px 0 9px;color:var(--text)}
.h:first-child{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tech button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:16px}
.tech svg{width:54px;height:45px;color:var(--brass)}
.tech button[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);background:var(--panel)}
.tech-desc{margin-top:10px;font-size:16px;color:var(--muted)}
.tech-desc strong{color:var(--text);font-weight:700}
.vessel-wrap{position:relative;margin-top:16px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(120% 90% at 50% 0,var(--panel-2),var(--panel));padding:8px 10px 12px}
.vessel-wrap .tool{width:min(190px,58%);margin:0 auto;color:var(--text);overflow:visible}
.mixfill{fill:var(--mix,transparent);stroke:none;opacity:.92}
.vessel-wrap.plop .tool{animation:plop .28s ease-out}
@keyframes plop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.vessel-wrap.brewing .tool{animation:shake .32s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:10px;display:none}
.vessel-wrap.brewing .bubbles{display:block}
.bubbles i{position:absolute;bottom:20%;width:9px;height:9px;border-radius:50%;border:2px solid var(--text);opacity:0;animation:rise 1.1s ease-out infinite}
.bubbles i:nth-child(1){left:42%}.bubbles i:nth-child(2){left:52%;animation-delay:.3s}.bubbles i:nth-child(3){left:60%;animation-delay:.6s}.bubbles i:nth-child(4){left:47%;animation-delay:.85s}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.7}100%{transform:translateY(-90px);opacity:0}}
.gauge{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px;color:var(--muted)}
.gauge .bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.gauge .bar i{display:block;height:100%;background:var(--verdigris);border-radius:4px}
.gauge.over .bar i{background:var(--madder)}
.gauge.over{color:var(--madder)}
.chips{display:grid;gap:7px}
.chip{display:grid;grid-template-columns:14px minmax(0,1fr) auto 32px;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 6px 6px 10px}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.chip .nm{font:400 17px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis}
.chip .nm small{display:block;font:400 14px var(--ui);color:var(--muted)}
.dose{display:flex;align-items:center;gap:2px}
.dose button,.x{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font:700 18px/1 var(--ui);display:grid;place-items:center;padding:0}
.dose button:disabled{opacity:.35;cursor:default}
.dose .pips{display:flex;gap:3px;padding:0 6px}
.dose .pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--brass)}
.dose .pips i.f{background:var(--brass)}
.x{border-color:transparent;background:none;color:var(--muted);font-size:20px}
.x:hover{background:var(--panel);color:var(--madder)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:16px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.base{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:58px;position:relative}
.base .lab{font-size:14px;color:var(--muted)}
.base .val{font:400 17px/1.15 var(--display);display:flex;align-items:center;gap:8px;margin-top:2px}
.base .val .dot{flex:none}
.base.off{opacity:.6}
.base .x{position:absolute;right:2px;top:2px;width:26px;height:26px;font-size:17px}
.base .note{font-size:13.5px;color:var(--madder)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;border-inline-start:1px solid var(--line);padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--btn-ink)}
.seg svg{width:18px;height:18px;fill:currentColor}
.seg[aria-disabled="true"]{opacity:.45;pointer-events:none}
.fins{display:flex;flex-wrap:wrap;gap:8px}
.fins button{padding:7px 12px;border:1px solid var(--line);border-radius:18px;background:var(--panel-2);font-size:16px}
.fins button[aria-pressed="true"]{background:var(--brass);color:var(--btn-ink);border-color:transparent}
.fin-desc{margin-top:8px;font-size:15px;color:var(--muted);min-height:2.6em}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);font:700 17px var(--ui);color:var(--text)}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent;flex:1;min-width:150px}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--madder);border-color:var(--madder)}
.btn.small{padding:7px 12px;font-size:15px}
.msg{margin-top:14px;padding:10px 12px;border-radius:7px;border:1px solid var(--madder);color:var(--text);background:color-mix(in srgb,var(--madder) 14%,transparent);font-size:16px}

/* ---------- fiche ---------- */
.panel-result{background:var(--panel)}
.result-pad{padding:18px 16px 30px}
.fiche{position:relative;background:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .15  0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");color:var(--paper-ink);border-radius:3px;padding:22px 20px 20px;box-shadow:0 14px 26px -12px rgba(0,0,0,.65),inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--paper-line)}
.f-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.f-head .seal{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.fiche.fresh .f-head .seal{animation:stamp .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{0%{transform:scale(1.7) rotate(-14deg);opacity:0}70%{opacity:1}100%{transform:scale(1) rotate(0)}}
.f-title{font:400 27px/1.08 var(--display);color:var(--paper-ink);overflow-wrap:anywhere}
.f-type{font:700 16px var(--ui)}
.f-type,.f-meta{margin-top:5px}
.f-meta{font-size:15.5px;color:var(--paper-mut)}
.f-blurb{margin-top:12px;font:italic 400 17px/1.3 var(--display);color:var(--paper-mut)}
.f-sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--paper-line)}
.f-sec h3{font:italic 400 20px/1.1 var(--display);margin-bottom:8px;color:var(--paper-ink)}
.f-body{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-top:16px;align-items:start}
.vessel{width:96px;height:112px;color:#6a583b}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:16px}
dl.kv dt{color:var(--paper-mut)}
dl.kv dd{margin:0}
.fx{display:grid;gap:11px}
.fx-row .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fx-row b{font-weight:700}
.tier{font-size:14.5px;color:var(--paper-mut)}
.fx-row .track{height:6px;background:var(--paper-2);border-radius:3px;margin:4px 0 3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--paper-line)}
.fx-row .track i{display:block;height:100%;border-radius:3px}
.fx-row p{font:italic 400 16px/1.25 var(--display);color:var(--paper-mut)}
.k-soin i{background:var(--k-soin)}.k-esprit i{background:var(--k-esprit)}.k-danger i{background:var(--k-danger)}.k-matiere i{background:var(--k-matiere)}
.danger-g{display:flex;gap:4px;margin:2px 0 6px}
.danger-g i{flex:1;height:8px;border-radius:2px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--paper-line)}
.danger-g i.f0{background:#6f9a54}.danger-g i.f1{background:#b7a53a}.danger-g i.f2{background:#d48a2e}.danger-g i.f3{background:#c2552d}.danger-g i.f4{background:#8f2523}
.dlabel{font-weight:700}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:2px 0}
.qdots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.qdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--paper-ink)}
.qdots i.f{background:var(--paper-ink)}
.fiche details{margin-top:14px;border-top:1px solid var(--paper-line);padding-top:10px}
.fiche summary{cursor:pointer;font:italic 400 20px/1.1 var(--display);padding:2px 0}
.yield{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0 0;font-size:15.5px}
.yield .track{grid-column:1/-1;height:5px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-bottom:5px}
.yield .track i{display:block;height:100%;background:var(--paper-mut)}
.call{margin-top:10px;padding:9px 11px;border-left:3px solid var(--k-matiere);background:color-mix(in srgb,var(--paper-2) 70%,transparent);font-size:16px}
.savebar{margin-top:18px;padding-top:14px;border-top:1px solid var(--paper-line);display:grid;gap:8px}
.savebar label{font-size:15px;color:var(--paper-mut)}
.savebar .row{display:flex;gap:8px;flex-wrap:wrap}
.fiche input[type=text],.fiche textarea,.field{width:100%;padding:9px 11px;border-radius:5px;border:1px solid var(--paper-line);background:rgba(255,255,255,.45);color:var(--paper-ink);font:400 18px var(--display)}
.fiche textarea{min-height:88px;font:400 17px/1.35 var(--ui);resize:vertical}
.fiche .btn{background:var(--paper-2);color:var(--paper-ink);border-color:var(--paper-line)}
.fiche .btn.primary{background:var(--paper-ink);color:var(--paper);border-color:transparent}
.fiche .btn.danger{color:#8f2523;border-color:#8f2523;background:transparent}
.saved-ok{font:italic 400 18px var(--display);color:var(--k-soin)}
.fiche.accident{background-color:#e0cfb0}
.fiche.accident .f-title{color:#7d2620}
.empty-res{text-align:center;padding:40px 22px;color:var(--muted)}
.empty-res svg{width:110px;margin:0 auto 12px;color:var(--brass);opacity:.8}
.empty-res h2{font:400 22px var(--display);color:var(--text);margin-bottom:6px}

/* ---------- étagère à grimoires ---------- */
.panel-books,.panel-manual{background:var(--panel)}
.toolbar{display:grid;gap:9px;margin-bottom:12px}
.toolbar input,.toolbar select,.dlg>input,.dlg>textarea{padding:9px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);width:100%}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:none;font-size:15px}
.filters button[aria-pressed="true"]{background:var(--brass);color:var(--btn-ink);border-color:transparent}
.entries{display:grid;gap:8px}

/* ---------- l'officine du débutant ---------- */

.ecols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}

.esel>span:nth-child(2){flex:1;display:grid}.esel small{font-size:13px;color:var(--muted)}
.eempty{padding:10px;color:var(--muted);font-size:15px;border:1.5px dashed var(--line);border-radius:9px}

.eside .btn.small{margin-top:8px}

.ehead{display:flex;gap:16px;align-items:center;margin-bottom:8px}
.ehead h2{font:400 30px/1.1 var(--display);margin:0}.etype2{margin:4px 0 0;color:var(--paper-mut)}

.eblurb{font-style:italic;margin:10px 0}
.efx{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:5px}

.etasks{margin:26px auto 0;max-width:760px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2)}

        return F('Mélange',true,'mixte','fiole');
      }

    case 'calciner': return F('Cendre',false,'mixte','sachet');

    case 'fumiger': return F('Fumigation',false,'inhale','cone');

function extractionOf(ing,c){
  if(ing.mix){
    if(c.tech==='melanger')return {e:.95,mfx:null,suspended:false};
    if(ing.liquidMix&&['torrefier','sublimer','cristalliser'].includes(c.tech))return {e:0,mfx:null,suspended:false};
    if(ing.liquidMix&&c.tech==='mouler')return {e:.5,mfx:null,suspended:false};
    if(ing.liquidMix)return extractionOf({p:'tendre',s:'dis_'+ing.kind,v:ing.v||0,tags:ing.tags||[],id:ing.id},c);
    const rs=(ing.comps||[]).map(k=>({w:k.w,r:extractionOf(k.ing,c)}));
    const W=rs.reduce((s,o)=>s+o.w,0)||1;
    const We=rs.reduce((s,o)=>s+o.w*o.r.e,0);
    const mf=rs.some(o=>o.r.mfx)?(k=>We?rs.reduce((s,o)=>s+o.w*o.r.e*(o.r.mfx?o.r.mfx(k):1),0)/We:1):null;
    return {e:clamp(We/W,0,1.25),mfx:mf,suspended:rs.some(o=>o.r.suspended)};
  }
  const P=ing.p,S=SOL[ing.s],tags=ing.tags||[],feu=c.feu,sk=c.sk;
  let e=0,mfx=null,suspended=false;
  const organic=['tendre','dur','resine','animal'].includes(P);
  const inertish=['inerte','sel','metal'].includes(P);
  switch(c.tech){
    case 'broyer':
      e={tendre:.9,dur:.75,resine:.6,sel:1,metal:.6,inerte:1,animal:.9}[P]; break;
    case 'melanger':
      e={tendre:.5,dur:.4,resine:.3,sel:.9,metal:.6,inerte:.95,animal:.6}[P];
      if(P==='inerte'&&c.fin.filtrer)e=.08;
      break;
    case 'infuser': case 'decocter': case 'macerer': case 'fermenter': {
      const tbl=PF[c.tech==='fermenter'?'macerer':c.tech];
      const aff=c.tech==='fermenter'?(S.eau+S.alcool)/2:S[sk];
      e=tbl[P]*aff*(c.spw||1);
      if(c.tech==='infuser')e*=[.7,1,1.05][feu];
      if(c.tech==='decocter')e*=[.85,1,1.1][feu];
      if(ing.v){ if(c.tech==='infuser')e*=[1.05,1,.7][feu]; if(c.tech==='decocter')e*=[.8,.55,.3][feu]; }
      if(c.tech==='macerer'&&sk==='alcool'&&['alcal','resine','ess'].includes(ing.s))e*=1.1;
      if(c.tech==='fermenter')e*=.9;
      if(P==='inerte'){e=c.fin.filtrer?.08:.5;suspended=true}
      break; }
    case 'distiller':
      if(tags.includes('mercure'))e=.9;
      else if(ing.v)e=.7*ing.v*S[sk]*(c.spw||1)*[.9,1,.85][feu]; else e=0;
      break;
    case 'calciner':
      if(tags.includes('fumeux')||tags.includes('mercure')){e=.3}
      else if(organic){e=.7;mfx=k=>CALC_KEEP[k]||0}
      else{e=1;mfx=k=>k==='combustible'?0:k==='corrosif'?1.25:k==='irritant'?1.2:1}
      e*=[.7,1,1][feu]; break;
    case 'petrir':
      if(inertish)e=P==='metal'?.7:.85;
      else e=Math.max(PF.macerer[P]*S.huile,.35*(P==='dur'?.8:1));
      e*=[1,1,.7][feu];
      if(ing.v)e*=[1.05,1,.7][feu];
      break;
    case 'torrefier':
      if(inertish)e=1;
      else{e=({tendre:.85,dur:.8,resine:.5,animal:.75})[P]*[1,1,.7][feu];if(ing.v)e*=[.6,.35,.1][feu];mfx=k=>k==='emollient'?.6:k==='parfumant'?.4:k==='astringent'?1.15:1}
      break;
    case 'cristalliser':
      if(tags.includes('mercure')||!['sel','metal'].includes(P))e=0;
      else{e=(P==='metal'?.8:1)*(S[sk]||0)*[1,1,.85][feu];mfx=k=>k==='combustible'?0:1}
      break;
    case 'sublimer':
      if(tags.includes('sublimable'))e=.9*[.85,1,.9][feu];else if(tags.includes('mercure'))e=.9;else e=0;
      break;
    case 'emulsionner':
      e=(PF.infuser[P]||0)*(S[sk]||0)*.9;if(P==='inerte'){e=.6;suspended=true}
      break;
    case 'mouler':
      e=({tendre:.9,dur:.7,resine:.6,sel:1,metal:.6,inerte:1,animal:.9})[P]*[1,1,.85][feu];
      break;
    case 'fumiger':
      if(tags.includes('fumeux'))e=1;
      else if(inertish)e=.1;
      else{e=(.2+.45*ing.v)*[1,1.1,.75][feu]; if(feu===2&&ing.v)e*=1-.15*ing.v}
      mfx=k=>(k==='colorant'||k==='combustible')?0:1;
      break;
  }
  return {e:clamp(e,0,1.25),mfx,suspended};
}
function fxOf(ing,c){
  if(ing.id==='moisissure_bleue'){
    if(c.tech==='fermenter'||(c.tech==='macerer'&&c.sk==='eau'))return {antiseptique:3,conservateur:1,toxique:.4};

function typeScores(raw,form,special){
  const g=k=>raw[k]||0;
  const vals=Object.values(raw);const top=vals.length?Math.max(...vals):0;
  const dom=k=>g(k)>=.6*top;
  const sc={};
  const P=g('toxique')+.9*g('paralysant');
  sc.poison=P>=1.6?P*1.4:0;
  sc.caustique=g('corrosif')>=1.5?g('corrosif')*1.5:0;
  sc.incendiaire=g('combustible')>=3.2?g('combustible')*1.0:0;
  sc.antidote=g('antitoxique')>=2?g('antitoxique')*1.3:0;
  sc.purgatif=g('purgatif')>=2?g('purgatif')*1.1:0;
  const sed=g('calmant')+g('soporifique');sc.sedatif=sed>=1.8?sed*.9:0;
  const stu=g('euphorisant')+g('delirant');sc.stupefiant=stu>=1.8?stu:0;
  const ton=g('tonique')+g('stimulant')+.3*g('echauffant');sc.tonique=ton>=1.8?ton*.9:0;
  const heal=g('febrifuge')+g('pectoral')+g('digestif')+g('antalgique')+g('cicatrisant')+.5*g('antiseptique')+.5*g('astringent')+g('diuretique')+.6*g('tonique');
  const topical=g('cicatrisant')+g('emollient')+g('antiseptique')+g('antalgique')+g('astringent')+.5*g('echauffant');
  const ext=form.ext;
  sc.soin=heal>=1.8?heal*.85*(ext==='interne'?1:ext==='mixte'?.9:ext==='externe'?.5:.4):0;
  sc.baume=(ext==='externe'||ext==='mixte')&&topical>=1.8?topical*1.05*(ext==='externe'?1.2:1):0;
  sc.parfum=g('parfumant')>=2.4&&dom('parfumant')?g('parfumant')*1.1:0;
  sc.colorant=g('colorant')>=2.4&&dom('colorant')?g('colorant')*1.1:0;
  sc.conservateur=g('conservateur')>=2.4&&dom('conservateur')?g('conservateur')*1.05:0;
  sc.detergent=g('detersif')>=2?g('detersif')*1.2:0;
  sc.desinfectant=g('antiseptique')>=2.4&&dom('antiseptique')?g('antiseptique'):0;
  if(special&&special.type)sc[special.type]=99;
  return sc;
}

function resolveBases(rc,T,lk){

  const sid=solv?(solv.mix?KID[solv.kind]:(CANON[solv.id]||solv.id)):null;
  return {solv0,adj0,solv,adj,solvOK,adjOK,vol,adjq,sid,aid:adj?adj.id:null,akind:adj?adj.kind:null,rid:solv&&!solv.mix?solv.id:null};
}
function phaseInfo(tech,items,B){
  const liq=items.filter(i=>i.ing.mix&&i.ing.liquidMix);
  const Vliq=liq.reduce((s,i)=>s+i.q,0), Vtot=(B.solvOK?B.vol:0)+Vliq+(tech==='emulsionner'&&B.aid?B.adjq:0);
  const tg=i=>i.ing.tags||[];
  const elig=i=>tech==='cristalliser'?(['sel','metal'].includes(i.ing.p)&&!tg(i).includes('mercure')):tech==='sublimer'?(tg(i).includes('sublimable')||tg(i).includes('mercure')):true;
  const Msol=items.filter(i=>!(i.ing.mix&&i.ing.liquidMix)&&elig(i)).reduce((s,i)=>s+i.q,0);
  let mode='dry',phase=0;
  const fatA=B.akind==='gras'||B.akind==='cire';
  if(tech==='cristalliser'||tech==='sublimer'){mode='dry'}
  else if(tech==='petrir'){mode='paste';phase=(fatA?B.adjq:0)+(B.sid==='huile'?B.vol:0);if(!phase)phase=B.adjq}
  else if(fatA&&tech==='melanger'){mode='paste';phase=B.adjq}
  else if(Vtot>0)mode='wet';
  else if(B.aid){mode='paste';phase=B.adjq}
  const Ms=Msol||1;
  const Veff=tech==='distiller'?Vtot*.6:Vtot;
  const cOf=q=>mode==='wet'?q*100/Veff:mode==='paste'?q*100/(phase*5):12*q/Ms;
  return {mode,phase,Vtot,Vliq,Msol,Ms,cOf,cref:mode==='dry'?12:5,den:(Vtot+(mode==='paste'?phase:0))||1,charge:Msol+(mode==='paste'?phase:Vtot)+(mode==='paste'?Vliq:0)};
}
function concLabel(c){return c<2.5?'faible':c<7?'standard':c<14?'forte':c<26?'très forte':'saturée'}
function concInfo(rc,MIX){
  MIX=MIX||{};const lk=id=>BY[id]||MIX[id];const T=TECH[rc.tech];
  const items=rc.items.map(i=>({ing:lk(i.id),q:qOf(i)})).filter(i=>i.ing);
  const B=resolveBases(rc,T,lk);const P=phaseInfo(rc.tech,items,B);
  let text='',label='';
  if(P.mode==='wet'&&P.Msol>0){const c=P.Msol*100/P.Vtot;text=fmtN(c)+' g pour 100 ml';label=concLabel(c)}
  else if(P.mode==='paste'&&P.Msol>0){text=Math.round(P.Msol/(P.Msol+P.phase)*100)+' % de matière dans le corps gras';label=concLabel(P.Msol*100/(P.phase*5))}
  else if(P.mode==='dry'&&P.Msol>0){text='à sec : seules les proportions comptent'}
  return {mode:P.mode,text,label,charge:Math.round(P.charge),over:P.charge>VCAP};
}

function stepFromRes(res){

const chainOf=res=>(res.chain&&res.chain.length)?res.chain:[stepFromRes(res)];
function stepLines(s){
  if(s.finish)return {title:'Finition : '+s.label,lines:s.qty>0?['Il reste '+fmtQty(s.qty,s.unit)+'.']:[]};
  const L=[],T=TECH[s.tech]||{};

  if(s.solvent)L.push('Mesurer '+fmtQty(s.solvent.vol,'ml')+' '+de(s.solvent.n)+(s.solvent.mix?' (contenant)':'')+'.');
  if(s.adj)L.push('Préparer '+fmtQty(s.adj.q,'g')+' '+de(s.adj.n)+'.');
  L.push((TECH_VERB[s.tech]||T.n||'')+(T.heat&&s.feu!=null?', chaleur : '+T.heat[s.feu].toLowerCase():'')+'.');
  if(s.qty>0)L.push('Obtenu : '+fmtQty(s.qty,s.unit)+(s.conc?' (concentration : '+s.conc+')':'')+'.');
  return {title:s.name,lines:L};
}
/* proportionnalité : toutes les quantités de la recette (chaque étape) sont multipliées par le nombre de portions */
const scaleQ=(q,k,u)=>u==='ml'?Math.round(q*k):Math.round(q*k*2)/2;
function scaleRecipe(rc,k){
  if(!rc||k===1)return rc;
  const r=JSON.parse(JSON.stringify(rc));
  r.items.forEach(i=>{i.q=Math.round(i.q*k*100)/100});
  if(r.solvent)r.vol=Math.round(rc.vol*k);
  if(r.adj)r.adjq=Math.round(rc.adjq*k);

}
function scaleStepObj(s,k){
  if(k===1)return s;
  const c=JSON.parse(JSON.stringify(s));
  if(c.qty>0)c.qty=scaleQ(c.qty,k,c.unit);
  if(c.finish)return c;
  c.items.forEach(i=>{i.q=Math.round(i.q*k*100)/100});
  if(c.solvent)c.solvent.vol=Math.round(c.solvent.vol*k);
  if(c.adj)c.adj.q=Math.round(c.adj.q*k*100)/100;
  if(c.recipe)c.recipe=scaleRecipe(c.recipe,k);

}
/* nombre maximal de portions que l'établi peut préparer d'un seul coup (lk : retrouve un contenant par son identifiant) */
function maxPortions(res,lk){
  let mx=99,made=false;
  chainOf(res).forEach(s=>{
    if(s.finish||!s.recipe)return;const rc=s.recipe;
    rc.items.forEach(i=>{
      if(!(i.q>0))return;
      const m=BY[i.id]?null:(lk?lk(i.id):null);
      let lim=BY[i.id]?QTY.max:(m?(m.liquidMix?500:QTY.max):(made?(rc.tech==='melanger'||i.q>=20?500:QTY.max):null));
      /* un contenant fabriqué par une étape précédente de la recette sera refait en plus grande quantité : seul le stock d'un contenant de départ limite */
      if(m&&m.avail>0&&!made)lim=Math.min(lim,m.avail);
      if(lim!=null)mx=Math.min(mx,Math.floor(lim/i.q+1e-9));
    });
    made=true;
    if(rc.solvent&&rc.vol>0)mx=Math.min(mx,Math.floor(VOLS.max/rc.vol+1e-9));
    if(rc.adj&&rc.adjq>0)mx=Math.min(mx,Math.floor(ADJQ.max/rc.adjq+1e-9));
    const charge=rc.items.reduce((a,i)=>a+i.q,0)+(rc.solvent?rc.vol:0)+(rc.adj?rc.adjq:0);
    if(charge>0)mx=Math.min(mx,Math.floor(VCAP/charge+1e-9));
  });
  return Math.max(1,mx);
}
function recipeText(res,k){
  k=k||1;const u=res.unit||(res.liquid?'ml':'g');
  const out=[res.name+(res.qty>0?' ('+fmtQty(scaleQ(res.qty,k,u),u)+(k>1?', pour '+k+' portions':'')+')':'')];
  chainOf(res).forEach((s0,i)=>{const s=scaleStepObj(s0,k);const t=stepLines(s);out.push('','Étape '+(i+1)+' : '+t.title);t.lines.forEach(l=>out.push('  '+l))});
  return out.join('\n');
}
function lastRecipe(res){const ch=chainOf(res);for(let i=ch.length-1;i>=0;i--)if(ch[i].recipe)return ch[i].recipe;return res.recipe}

/* matériel de l'atelier (carrière) : bonus de qualité selon la technique */
const EQ_TECH={mortier:['broyer','petrir','mouler','emulsionner','melanger'],marmite:['infuser','decocter','macerer','fermenter'],alambic:['distiller'],four:['torrefier','calciner','sublimer','fumiger']};
const EQ_Q={mortier:[0,.4,.7],marmite:[0,.3,.6],alambic:[0,.4,.7],four:[0,.4,.7],balance:[0,.3,.5]};
function equipBonus(tech,nItems,eq){
  if(!eq)return 0;let b=0;
  for(const k in EQ_TECH)if(EQ_TECH[k].includes(tech))b+=(EQ_Q[k]||[])[eq[k]||0]||0;
  b+=nItems>=2?((EQ_Q.balance||[])[eq.balance||0]||0):(eq.balance||0)*.1;
  return Math.round(b*10)/10;
}
function prepare(rc,MIX){
  MIX=MIX||{};const lk=id=>BY[id]||MIX[id];
  const T=TECH[rc.tech];
  const items=rc.items.map(i=>({ing:lk(i.id),q:clamp(qOf(i),.1,500)}));
  if(!items.length)return {error:'L\'établi est vide. Prends quelques ingrédients sur l\'étagère.'};
  if(items.some(i=>!i.ing)||(rc.solvent&&!lk(rc.solvent)))return {error:'Un contenant posé sur l\'établi n\'existe plus. Retire-le.'};
  const B=resolveBases(rc,T,lk);
  const {solv0,adj0,solv,adj,solvOK,adjOK,vol,adjq,sid,aid,akind,rid}=B;
  const names=ids=>joinFr(ids.map(id=>lcFirst(BY[id].n)));
  const needSolv=['infuser','decocter','macerer','distiller','fermenter','cristalliser','emulsionner'].includes(rc.tech);
  if(needSolv&&!solvOK)return {error:solv0?`${T.n} ne se fait pas avec ${lcFirst(solv0.n)}. Prends plutôt : ${names(T.solv)}.`:`${T.n} demande un liquide. Prends-en un dans l'étagère des bases : ${names(T.solv)}.`};
  const fatMixIn=items.some(i=>i.ing.mix&&!i.ing.liquidMix&&['Onguent','Cérat','Emplâtre'].includes(i.ing.res.form));
  if(rc.tech==='petrir'&&!(akind==='gras'||akind==='cire'||sid==='huile'||fatMixIn))return {error:'Un onguent demande un corps gras : graisse d\'oie, suif, lanoline, cire brune ou huile.'};
  if(rc.tech==='fermenter'&&!(items.some(i=>(i.ing.tags||[]).includes('sucre'))||aid==='miel'))return {error:'Rien à faire fermenter : sans sucre (miel, sang-de-bouleau), la mixture tourne.'};

  if(eqb>0){q+=eqb;journal.push('Ton matériel affine le résultat (+'+fmtN(eqb)+' de qualité).')}
  if(main==='bourbe')q=Math.min(q,1.6);
  q=clamp(q,1,5);const qs=Math.round(q);
  const quality={score:qs,label:QUAL_LBL[qs]};
  // quantité obtenue
  let qty,unit;
  const Vl=P.Vliq;
  if(form.liquid){
    unit='ml';
    const loss={infuser:.95,macerer:.95,fermenter:.94,melanger:1,petrir:1,broyer:1,decocter:[.95,.88,.72][feu],distiller:Math.min(.92,[.55,.6,.6][feu]*(1+[0,.15,.3][(rc.eq&&rc.eq.alambic)||0])),emulsionner:.95}[rc.tech];
    qty=Math.max(5,Math.round(P.Vtot*(loss==null?1:loss)));
  }else{
    unit='g';
    if(rc.tech==='calciner')qty=items.reduce((s,it)=>s+it.q*(['tendre','dur','resine','animal'].includes(it.ing.p)?.22:it.ing.mix?.6:.9),0);
    else if(rc.tech==='torrefier')qty=items.reduce((s,it)=>s+it.q*(['tendre','dur','resine','animal'].includes(it.ing.p)?(feu===2?.3:.75):.95),0)+(P.mode==='paste'?P.phase*.8:0);
    else if(rc.tech==='cristalliser'||rc.tech==='sublimer')qty=items.reduce((s,it,i)=>s+(ex[i].e>0?it.q*Math.min(1,ex[i].e)*(rc.tech==='sublimer'?.7:.9):0),0);
    else if(rc.tech==='emulsionner')qty=(P.Msol+P.Vtot)*.97;
    else if(rc.tech==='mouler')qty=(P.Msol+P.phase)*.97;
    else qty=(P.Msol+(P.mode==='paste'?P.phase:0)+Vl*.9)*(rc.tech==='broyer'?.95:1);
    qty=Math.max(.5,Math.round(qty*2)/2);
  }
  const mode=P.mode;
  let conc;
  if(mode==='wet'&&P.Msol>0){const c=P.Msol*100/P.Vtot;conc={mode,text:fmtN(c)+' g pour 100 ml',label:concLabel(c)}}
  else if(mode==='paste'&&P.Msol>0){conc={mode,text:Math.round(P.Msol/(P.Msol+P.phase)*100)+' % de matière dans le corps gras',label:concLabel(P.Msol*100/(P.phase*5))}}
  else conc={mode:'dry',text:'à sec',label:''};
  // nom
  const mains=items.map((it,i)=>({n:it.ing.n,w:weights[i]})).sort((a,b)=>b.w-a.w).filter(o=>o.w>.05).slice(0,2);
  const nm=mains.length?mains.map(o=>de(o.n)).join(' et '):'';
  let noun=form.n;
  if(special)noun=null;
  else if(rc.tech==='melanger')noun=form.liquid?'Mélange':form.n;
  else if(main==='baume')noun=form.liquid&&form.ext!=='externe'?'Lotion':'Baume';
  else if(main==='poison')noun=form.liquid?'Breuvage':form.n==='Poudre'||form.n==='Cendre'?'Poudre':form.n==='Fumigation'?'Fumées':form.n;
  else if(main==='bourbe')noun='Mixture';
  else if(main==='incendiaire')noun=form.n==='Poudre'?'Poudre':'Mixture';
  if(!special&&NEWFORM.includes(form.n)&&main!=='poison'&&main!=='bourbe')noun=form.n;
  let name;
  if(special)name=special.name;
  else{
    name=nm?`${noun} ${nm}`:`${noun} sans vertu`;
    const first=mains[0]&&mains[0].n.toLowerCase();
    if(mains.length===1&&first&&first.split(' ')[0]===noun.toLowerCase())name=ucFirst(mains[0].n);
    if(main==='colorant'&&form.n!=='Poudre')name=`Teinture ${nm}`;
  }
  // composition

  items.forEach((it,i)=>{

    if(it.ing.mix){const tt=(it.ing.comps||[]).reduce((s,k)=>s+k.w,0)||1;(it.ing.comps||[]).forEach(k=>{cm[k.ing.id]=(cm[k.ing.id]||0)+k.w/tt*wg})}
    else cm[it.ing.id]=(cm[it.ing.id]||0)+wg;
  });
  const comps=Object.keys(cm).map(id=>({id,w:+cm[id].toFixed(3)}));
  const Wc=comps.reduce((s,c)=>s+c.w,0)||1;
  const va=comps.reduce((s,c)=>s+c.w*(BY[c.id].v||0),0)/Wc;
  let vol2=va>=1.4?2:va>=.5?1:0;if(form.liquid&&sid==='alcool')vol2=Math.min(2,vol2+1);
  let solvKind=null;
  if(form.liquid){const dm=items.filter(i=>i.ing.liquidMix).sort((a,b)=>b.q-a.q)[0];solvKind=sk||(dm?dm.ing.kind:'eau')}
  const step={name,form:form.n,tech:rc.tech,feu:T.heat?feu:null,
    items:ingr.map(i=>({id:i.id,n:i.n,q:i.q,unit:i.unit,mix:!BY[i.id]})),
    solvent:solvOK?{id:solv.id,n:solv.n,vol,mix:!!solv.mix}:null,
    adj:adjOK?{id:adj.id,n:adj.n,q:adjq}:null,
    qty,unit,conc:conc.mode!=='dry'?conc.text:'',recipe:JSON.parse(JSON.stringify(rc))};
  const prior=[],seen=new Set();
  items.concat(solvOK&&solv.mix?[{ing:solv}]:[]).forEach(it=>{if(it.ing.mix&&it.ing.res)chainOf(it.ing.res).forEach(s=>{const k=JSON.stringify([s.name,s.tech,s.finish,s.items,s.qty]);if(!seen.has(k)){seen.add(k);prior.push(s)}})});
  const chain=prior.concat([step]).slice(-14);
  return {
    ok:true,comps,solvKind,v:vol2,sens:{taste:tArr.map(e=>[e[0],+e[1].toFixed(2)]),smell:sArr.map(e=>[e[0],+e[1].toFixed(2)])},
    name,form:form.n,formShape:form.shape,liquid:form.liquid,ext:form.ext,
    type:main,alt,fx:fxList,danger,quality,qraw:+q.toFixed(2),shelf,dose:doseText(main,form.n,dl,special&&special.name),prise:priseOf(main,form.liquid,form.ext,raw,dl),sides,notes,tips:tips.slice(0,4),
    color,colorName:colorName(color),sensory,special:special?{name:special.name,note:special.note}:null,stype,lent,
    qty,unit,conc,chain,vis,susp:+susp.toFixed(2),suspFx,finishes:[],
    ingr,base:{solvent:solvOK?solv.n:null,adj:adjOK?adj.n:null},
    load:Math.round(P.charge),cap:VCAP,journal:journal,
    hint:main==='bourbe'?(wasted.length?'Une partie des ingrédients n\'a presque rien cédé.':'Trop faible : augmente les quantités, ou change de technique.'):'',
    recipe:JSON.parse(JSON.stringify(rc))
  };
}

/* ---------- finitions : s'appliquent à n'importe quelle mixture ---------- */
function applyFinish(res,key,lvl){
  const F=FIN[key];if(!F)return {error:'Finition inconnue.'};
  if(!res||!res.ok)return {error:'Il n\'y a rien à traiter.'};
  if(F.liq&&!res.liquid)return {error:`${F.n} ne s'applique qu'aux liquides. Une poudre, un onguent ou une cendre n'a rien à filtrer ni à réduire.`};
  const r=JSON.parse(JSON.stringify(res));
  if(r.qty==null){r.qty=r.liquid?100:20;r.unit=r.liquid?'ml':'g'}
  r.finishes=r.finishes||[];
  if(key!=='reduire'&&r.finishes.some(f=>f.k===key))return {error:'Cette finition a déjà été appliquée à cette mixture.'};
  const raw={};r.fx.forEach(f=>{raw[f.id]=f.raw});
  const sfx=r.suspFx||{};
  if(r.susp==null){const a=(r.sensory&&r.sensory.aspect)||'';r.susp=/avec un dépôt/.test(a)?1.4:/légèrement trouble/.test(a)?.6:.1}
  let lab=F.n.toLowerCase(),shMul=1,dq=0;
  switch(key){
    case 'filtrer':for(const k in sfx)raw[k]=Math.max(0,(raw[k]||0)-sfx[k]*.95);if(raw.irritant)raw.irritant*=.6;for(const k in raw)raw[k]*=.95;r.qty*=.95;r.susp=0;r.suspFx={};lab='filtrée';shMul=1.3;dq=.6;break;
    case 'decanter':for(const k in sfx)raw[k]=Math.max(0,(raw[k]||0)-sfx[k]*.7);if(raw.irritant)raw.irritant*=.8;r.qty*=.92;r.susp*=.3;for(const k in sfx)sfx[k]*=.3;r.suspFx=sfx;lab='décantée';shMul=1.1;dq=.3;break;
    case 'reduire':{const L=RED_LVL[lvl]||RED_LVL.moyen,g=Math.pow(1/L.f,.9);for(const k in raw)raw[k]*=VOL_FX.includes(k)?.75:g;r.qty*=L.f;r.susp*=g;r.color=mixHex([{c:r.color,w:1},{c:'#000000',w:.1*(1-L.f)}]);r.colorName=colorName(r.color);lab='réduite ('+L.t+')';shMul=1.25;break}
    case 'edulcorer':raw.emollient=(raw.emollient||0)+.5;r.qty*=1.04;{const t=(r.sens&&r.sens.taste)||[];const m={};t.forEach(([w,s])=>{m[w]=s});if(m.amer)m.amer*=.5;m.doux=(m.doux||0)+1.2;r.sens=r.sens||{taste:[],smell:[]};r.sens.taste=Object.entries(m).filter(e=>e[1]>=.7).sort((a,b)=>b[1]-a[1]).slice(0,2);r.sensory.taste=sensText(r.sens.taste,'sans goût marqué')}lab='adoucie au miel';shMul=1.25;dq=.1;break;
    case 'sceller':lab='scellée';shMul=3;dq=.2;r.sealed=true;break;
  }
  Object.keys(raw).forEach(k=>{if(raw[k]<.45)delete raw[k]});
  r.fx=fxListOf(raw);
  const lent=(r.comps||[]).some(c=>BY[c.id]&&(BY[c.id].tags||[]).includes('lent'));
  r.danger=dangerOf(raw,lent);
  let stype=r.stype;
  if(stype===undefined&&r.special)stype=r.special.name==='Savon'?'detergent':'colorant';
  const cl=classify(raw,r.ext,stype);r.type=cl.main;r.alt=cl.alt;
  let q=(r.qraw!=null?r.qraw:r.quality.score)+dq;q=clamp(q,1,5);r.qraw=+q.toFixed(2);
  r.quality={score:Math.round(q),label:QUAL_LBL[Math.round(q)]};
  r.shelf.days=Math.round(r.shelf.days*shMul);r.shelf.label=fmtDays(r.shelf.days);
  if(r.liquid&&r.sensory&&r.sensory.aspect){
    const cl2=clarityOf(r.susp,key==='filtrer'||/limpide/.test(r.sensory.aspect)&&r.susp<.3);
    r.sensory.aspect=r.sensory.aspect.replace(/(limpide|légèrement trouble|trouble, avec un dépôt)/,cl2);
    if(key==='reduire')r.sensory.aspect=r.sensory.aspect.replace(/^[^,]+/,colorName(r.color));
  }
  r.dose=doseText(r.type,r.form,r.danger.level,r.special&&r.special.name);
  r.prise=priseOf(r.type,r.liquid,r.ext,raw,r.danger.level);
  r.qty=Math.max(1,Math.round(r.qty*10)/10);
  r.finishes.push({k:key,l:lab});
  r.chain=JSON.parse(JSON.stringify(chainOf(res).concat([{finish:key,label:lab,lvl:lvl||null,qty:r.qty,unit:r.unit||(r.liquid?'ml':'g'),name:r.name}]))).slice(-14);
  r.notes=(r.notes||[]).slice();
  if(key==='reduire'&&r.danger.level>=1)r.notes.push('Réduite, la mixture est plus concentrée : ses dangers aussi.');
  r.journal=(r.journal||[]).concat([`Finition : ${lab}.`]);
  return r;
}

/* Une mixture rangée dans un contenant devient un ingrédient à part entière */
function mixIng(id,name,res,qty){
  const liquid=!!res.liquid;
  let cl=res.comps;
  if(!cl||!cl.length)cl=(res.ingr||[]).filter(i=>BY[i.id]).map(i=>({id:i.id,w:(i.q!=null?i.q/5*1.2:(LEG[i.dose]||5)/5*1.2)*Math.max(.05,i.pct/100)}));
  const comps=cl.filter(c=>BY[c.id]).map(c=>({ing:BY[c.id],w:c.w}));
  const W=comps.reduce((s,c)=>s+c.w,0)||1;
  const fx={};res.fx.forEach(f=>{if(FX[f.id])fx[f.id]=f.raw});
  const tags=[...new Set(comps.reduce((a,c)=>a.concat(c.ing.tags||[]),[]))];
  const kind=res.solvKind||(res.recipe&&BY[res.recipe.solvent]?BY[res.recipe.solvent].kind:null)||'eau';
  let v=res.v;
  if(v==null){const va=comps.reduce((s,c)=>s+c.w*(c.ing.v||0),0)/W;v=va>=1.4?2:va>=.5?1:0;if(liquid&&kind==='alcool')v=Math.min(2,v+1)}
  let sens=res.sens;
  if(!sens){
    const acc={taste:{},smell:{}};
    comps.forEach(c=>['taste','smell'].forEach(k=>{const t=c.ing[k]||[];if(t[1]>0&&t[0]!=='aucune')acc[k][t[0]]=(acc[k][t[0]]||0)+t[1]*Math.min(1.3,c.w/W*3)}));
    sens={};['taste','smell'].forEach(k=>{sens[k]=Object.entries(acc[k]).sort((a,b)=>b[1]-a[1]).slice(0,2)});
  }
  const sh=res.formShape;
  const unit=liquid?'ml':'g';
  const avail=qty!=null?qty:(res.qty!=null?res.qty:(liquid?100:20));
  const ing={id,n:name,cat:'reserve',mix:true,res,liquidMix:liquid,kind,fx,comps,tags,col:res.color,v,sens,unit,avail,
    side:res.sides||[],danger:res.danger&&res.danger.level>=3?1:0,
    jar:sh==='fiole'?'bouteille':sh==='pot'?'pot':'bocal',sh:sh==='fiole'?'liquide':sh==='pot'?'pate':sh==='sachet'?'poudre':'pepites',
    d:res.form+', '+(TYPES[res.type]?TYPES[res.type].n.toLowerCase():'')};
  if(liquid){ing.p='tendre';ing.s='dis_'+kind}
  return ing;
}

  {k:'tweak',vol:300,t:'Garde les 15 g, mais passe le liquide à 300 ml.'},
  {k:'brew',same:true,expect:'soin',after:(r,h)=>`15 g dans 300 ml font de nouveau 5 g pour 100 ml : le pectoral revient à ${String(gFx(r,'pectoral')).replace('.',',')}, comme au départ (${String(gFx(h[0],'pectoral')).replace('.',',')}). Tu as fait trois fois plus de préparation avec la même force.`}],
 variants:['Essaie 30 g pour 100 ml : au-delà d\'environ 25 g, le liquide sature et l\'excédent est perdu.','Compare avec 2,5 g pour 100 ml : la force est à peu près divisée par deux.','Regarde la « prise conseillée » de chaque fiche : plus c\'est concentré, plus elle est petite.'],
 end:'Retiens : la force dépend de la concentration. Pour un poison, c\'est aussi ce qui distingue le remède de la dose mortelle.'},

{id:'baume-apaisant',cat:'soins',lvl:1,t:'Un baume apaisant',d:'Pétris de la consoude et de la camomille dans de la graisse d\'oie.',learn:'Les corps gras, et pourquoi on pétrit au lieu d\'infuser.',
 stages:[
  {k:'brew',tech:'petrir',feu:0,items:[['grande_consoude',6],['camomille_sauvage',3]],adj:['graisse_oie',20],expect:'baume',
   lesson:'Dans un corps gras, les plantes ne cèdent pas leurs principes : elles s\'y mêlent en pulpe. Mais la graisse est elle-même émolliente, et la consoude cicatrise.',
   why:{grande_consoude:'Racine à mucilages : elle cicatrise et adoucit.',camomille_sauvage:'Elle apaise la peau et les nerfs.',graisse_oie:'Une graisse souple : elle fait le corps du baume.'}},
  {k:'save'}],
 variants:['Remplace la graisse d\'oie par du suif (plus ferme) ou de la lanoline (plus adhérente).','Ajoute 2 g de propolis brune pour un baume antiseptique.','Passe à la cire brune : tu obtiens un cérat, plus ferme.'],
 end:'Un baume s\'applique sur la peau. Le manuel (Savoir-faire) explique comment en faire à partir d\'un liquide.'},

{id:'sirop-pectoral',cat:'soins',lvl:1,t:'Un sirop pour la poitrine',d:'Décoction de sureau et de bourrache, liée au miel.',learn:'Le miel comme liant, et la décoction douce.',
 stages:[
  {k:'brew',tech:'decocter',feu:0,items:[['sureau_pale',6],['bourrache_noire',4]],solvent:['eau_pluie',100],adj:['miel',20],expect:'soin',
   lesson:'Le miel adoucit, masque l\'amertume et conserve : une décoction au miel devient un sirop.',why:{sureau_pale:'Fait transpirer et dégage la poitrine.'}},
  {k:'save'}],
 variants:['Change la chaleur : à ébullition vive, les essences fragiles disparaissent.','Remplace l\'eau par du vin blanc : c\'est un vin médicinal.','Ajoute 4 g de menthe glaciale pour rafraîchir (infuse-la plutôt : ses essences sont fragiles).'],
 end:'Un sirop se garde plusieurs mois. Essaie de le sceller à la cire pour tripler ce délai.'},

{id:'teinture-calmante',cat:'soins',lvl:2,t:'Une teinture calmante',d:'Macère de la valériane et de la camomille dans l\'alcool.',learn:'Le choix du solvant : l\'alcool extrait ce que l\'eau laisse.',
 stages:[
  {k:'brew',tech:'macerer',items:[['valeriane_marais',6],['camomille_sauvage',4]],solvent:['alcool',100],expect:'sedatif',
   lesson:'Les essences de la valériane passent bien dans l\'alcool. Refais la même recette à l\'eau, en infusion : tu n\'obtiens presque rien.',why:{valeriane_marais:'Une racine : dure, elle demande un solvant fort.'}},
  {k:'save'}],
 variants:['Essaie la même recette à l\'eau en infusion, puis compare avec la fiche de celle-ci.','Ajoute 20 g de miel comme liant : la teinture devient un élixir plus doux.','Remplace l\'alcool par du vin blanc : plus léger, moins d\'extraction.'],
 end:'Choisir le bon solvant est la moitié du métier. Le tableau de rendement de chaque produit, dans le manuel, te dit lequel prendre.'},

{id:'electuaire',cat:'soins',lvl:1,t:'Un électuaire fortifiant',d:'Broie une racine et un lichen, puis lie la poudre avec du miel.',learn:'Le broyage à sec, où seules les proportions comptent.',
 stages:[
  {k:'brew',tech:'broyer',items:[['racine_amere',6],['lichen_roche',4]],adj:['miel',20],expect:'soin',
   lesson:'À sec, il n\'y a pas de liquide : la force dépend seulement des proportions entre les ingrédients. Le miel lie la poudre en pâte.'},
  {k:'save'}],
 variants:['Ajoute 10 g de craie blanche : elle dilue la poudre, qui perd de sa force.','Remplace le miel par de la glycérine pour une pâte.','Ne mets pas de liant : tu obtiens une poudre pure, plus concentrée.'],
 end:'Une poudre pure est la forme la plus concentrée. Pour la diluer, mêle-la à une charge inerte.'},

{id:'lotion-antiseptique',cat:'soins',lvl:2,t:'Une lotion antiseptique',d:'Macère de la propolis dans l\'alcool pour nettoyer les plaies.',learn:'Les résines se travaillent à l\'alcool.',
 stages:[
  {k:'brew',tech:'macerer',items:[['propolis_brune',6]],solvent:['alcool',100],expect:'baume',
   lesson:'Les résines ne se dissolvent presque pas dans l\'eau, mais très bien dans l\'alcool. Attention : l\'alcool brûle sur une plaie ouverte.'},
  {k:'save'}],
 variants:['Essaie la propolis à l\'eau en décoction : compare le rendement.','Ajoute de la myrrhe sèche pour un effet cicatrisant plus marqué.','Passe à l\'huile : tu obtiens un liniment qui ne brûle pas.'],
 end:'Regarde le tableau de rendement de la propolis dans le manuel : il confirme la leçon.'},

{id:'poison-puissant',cat:'poisons',lvl:3,t:'Un poison puissant',d:'Extrais l\'aconit à l\'alcool, puis concentre-le. Pour comprendre la dose et le danger.',learn:'Pourquoi un poison est un affaire de solvant, de dose et de concentration.',
 stages:[
  {k:'brew',tech:'macerer',items:[['aconit_bleu',6]],solvent:['alcool',100],expect:'poison',
   lesson:'L\'alcool extrait très bien les alcaloïdes de l\'aconit : ce sont eux qui paralysent et empoisonnent.',why:{aconit_bleu:'Une racine très toxique. Dans l\'officine, elle sert à comprendre le danger, pas à en abuser.'},
   after:r=>`Niveau de danger : « ${r.danger.label} ». Regarde aussi les effets secondaires : un poison prévient rarement.`},
  {k:'finish',fin:'reduire',lvl:'moyen',lesson:'Réduire évapore le liquide et concentre ce qui ne s\'envole pas, dangers compris.'},
  {k:'save'}],
 variants:['Macère la même racine dans l\'eau : moins de principes passent, donc moins de danger.','Compare avec la digitale pourprée : elle agit lentement et sans avertir.','Passe à la mission « Apprivoiser un poison » pour voir comment on le rend inoffensif.'],
 end:'Un poison n\'est qu\'une préparation dont la toxicité domine. La dose, la concentration et le solvant décident de tout.'},

{id:'antidote',cat:'poisons',lvl:2,t:'Un antidote',d:'Prépare une infusion de pierre de lune et de charbon, qui captent les poisons.',learn:'Les poudres insolubles et l\'effet antitoxique.',
 stages:[
  {k:'brew',tech:'infuser',feu:0,items:[['pierre_lune',8],['charbon_saule',6]],solvent:['eau_pluie',100],expect:'antidote',
   lesson:'Ces poudres ne se dissolvent pas : elles restent en suspension et captent les poisons. C\'est cette suspension qui soigne.'},
  {k:'save'}],
 variants:['Ajoute 4 g d\'argile blanche : elle renforce l\'effet antitoxique et apporte de l\'astringent.','Filtre la préparation (onglet Finition) : tu retires la suspension, donc l\'antidote.','Mêle-la à une teinture toxique et regarde ce qui reste du danger.'],
 end:'Ne filtre jamais un antidote à base de poudres : le filtre les retire avec leur effet.'},

{id:'apprivoiser-poison',cat:'poisons',lvl:3,t:'Apprivoiser un poison',d:'Prépare une teinture toxique, puis dilue-la de moitié.',learn:'La dilution réduit le danger, sans toujours l\'effacer.',
 stages:[
  {k:'brew',tech:'macerer',items:[['aconit_bleu',6]],solvent:['alcool',100],expect:'poison',lesson:'Voici une teinture mortelle. Transvasons-la pour la travailler.'},
  {k:'stock'},
  {k:'brew',tech:'melanger',items:[['@0',50]],solvent:['eau_pluie',50],expect:'poison',
   lesson:'50 ml de teinture dans 50 ml d\'eau : la moitié de la force. Le poison reste un poison, mais le danger baisse.',
   after:(r,h)=>`Avant dilution : « ${h[0].danger.label} ». Après : « ${r.danger.label} ». La dilution baisse le danger sans l\'effacer.`},
  {k:'save'}],
 variants:['Dilue davantage (20 ml dans 80 ml) : la mixture perd sa vertu de poison.','Dilue avec de l\'alcool au lieu d\'eau : le liquide ne change pas la dose de poison.','Ajoute un antitoxique (pierre de lune) à la dilution.'],
 end:'Dans le manuel, « Réduire la toxicité d\'un produit » résume toutes les méthodes : diluer, changer de solvant, distiller, filtrer, neutraliser.'},

{id:'eau-parfumee',cat:'parfums',lvl:2,t:'Une eau parfumée',d:'Distille de la lavande pour en recueillir les essences.',learn:'La distillation : seul ce qui s\'évapore passe.',
 stages:[
  {k:'brew',tech:'distiller',feu:1,items:[['lavande_roche',8]],solvent:['eau_pluie',150],expect:'parfum',
   lesson:'Les essences de la lavande sont très volatiles : elles passent dans le distillat, pendant que le reste demeure dans la cornue. On ne recueille qu\'environ 60 % du liquide.',why:{lavande_roche:'Très volatile : ses essences s\'envolent à la chaleur.'}},
  {k:'save'}],
 variants:['Mets la chauffe sur « Douce » : les essences fines se conservent mieux.','Remplace l\'eau par de l\'eau de rose pour un parfum plus doux.','Macère la lavande dans l\'alcool avec un peu d\'ambre gris : le parfum tient plus longtemps.'],
 end:'Une eau distillée est très pure. Essaie de distiller une plante sans essences : il ne passe presque rien.'},

{id:'encens',cat:'parfums',lvl:1,t:'Un encens',d:'Brûle de l\'encens de rocaille et de la myrrhe sur des braises.',learn:'La fumigation, qui exploite la volatilité.',
 stages:[
  {k:'brew',tech:'fumiger',feu:0,items:[['encens_rocaille',6],['myrrhe_seche',4]],expect:'parfum',
   lesson:'Les essences volatiles passent très bien dans la fumée ; les substances lourdes presque pas. Une braise couvante donne une fumée douce.'},
  {k:'save'}],
 variants:['Mets la chaleur sur « Flamme » : tout brûle d\'un coup et les essences se perdent.','Ajoute du soufre jaune : la fumée assainit l\'air, mais elle prend à la gorge.','Ajoute de la cire brune comme liant.'],
 end:'Aère toujours la pièce après une fumigation.'},

{id:'encre-noire',cat:'parfums',lvl:2,t:'Une encre noire',d:'Mêle du vitriol vert et de la cornouille amère : ils noircissent ensemble.',learn:'Les réactions entre ingrédients.',
 stages:[
  {k:'brew',tech:'infuser',feu:1,items:[['vitriol_vert',4],['cornouille_amere',6]],solvent:['eau_pluie',100],expect:'colorant',
   lesson:'Le fer du vitriol et le tanin de la cornouille noircissent quand ils se rencontrent : c\'est une encre. Le vitriol reste corrosif : regarde les dangers.'},
  {k:'save'}],
 variants:['Remplace la cornouille par une autre plante à tanins (le manuel les signale).','Ajoute de la résine sanguine pour un ton rougeâtre.','Filtre l\'encre (onglet Finition) pour la clarifier.'],
 end:'Certaines associations font naître un produit nouveau. D\'autres : l\'argent-vif et le soufre donnent du vermillon, le cuivre et le vinaigre du vert-de-gris.'},

{id:'savon',cat:'parfums',lvl:2,t:'Un savon',d:'Fais bouillir du sel de soude avec du suif.',learn:'L\'alcali et la graisse se marient.',
 stages:[
  {k:'brew',tech:'decocter',feu:1,items:[['sel_soude',10]],solvent:['eau_pluie',100],adj:['suif',40],expect:'detergent',
   lesson:'Un alcali (le sel de soude) et une graisse (le suif) donnent un savon : c\'est la saponification.'},
  {k:'save'}],
 variants:['Remplace le suif par de la graisse d\'oie (plus souple) ou de la lanoline.','Remplace le sel de soude par de la cendre de hêtre (moins efficace).','Ajoute de la lavande pour parfumer.'],
 end:'Un alcali sans graisse est un détergent brutal, et une graisse sans alcali reste un onguent.'},

{id:'pigment-bleu',cat:'parfums',lvl:1,t:'Un pigment bleu',d:'Broie de la pierre d\'azur avec un peu de craie.',learn:'Les pigments insolubles se broient.',
 stages:[
  {k:'brew',tech:'broyer',items:[['pierre_azur',6],['craie_blanche',4]],expect:'colorant',
   lesson:'Un pigment ne se dissout pas : il se broie, puis se délaye. La craie blanche l\'éclaircit et le dilue.'},
  {k:'save'}],
 variants:['Broie la pierre d\'azur seule : la couleur est plus profonde.','Remplace la craie par de l\'argile blanche.','Mets la poudre en suspension dans un liquide, en infusion.'],
 end:'Un pigment se dose comme une poudre : par proportions.'},

{id:'cerat',cat:'etapes',lvl:2,t:'De l\'huile au baume : le cérat',d:'Fais une huile médicinale, puis transforme-la en baume avec de la cire.',learn:'Transformer un liquide en baume, en deux étapes.',
 stages:[
  {k:'brew',tech:'macerer',items:[['camomille_sauvage',10]],solvent:['huile_amande',100],expect:'baume',
   lesson:'La camomille cède bien ses principes à l\'huile : une huile apaisante, à la fois émolliente et digestive. Une plante à mucilages y cèderait très peu : l\'huile a ses préférences.'},
  {k:'stock'},
  {k:'brew',tech:'melanger',items:[['@0',60]],adj:['cire_brune',15],expect:'baume',
   lesson:'Mêlée à de la cire, l\'huile prend corps : c\'est un cérat. Une huile se mêle bien au gras, contrairement à l\'eau.'},
  {k:'save'}],
 variants:['Remplace la cire par de la graisse d\'oie : tu obtiens un onguent plus mou.','Ajoute plus de cire (30 g) pour un cérat plus ferme.','Ajoute de la propolis brune avant de mêler.'],
 end:'Pour transformer un liquide en baume : soit une huile et de la cire, soit un liquide réduit avec de la lanoline (mission suivante).'},

{id:'baume-lanoline',cat:'etapes',lvl:3,t:'Un baume à partir d\'une décoction',d:'Concentre une décoction, puis incorpore-la au gras avec de la lanoline.',learn:'L\'émulsion : mêler l\'eau au gras.',
 stages:[
  {k:'brew',tech:'decocter',feu:0,items:[['grande_consoude',10],['camomille_sauvage',4]],solvent:['eau_pluie',100],expect:'baume',lesson:'Voici une décoction cicatrisante. C\'est un liquide aqueux : il ne se mêlera pas au gras tel quel.'},
  {k:'finish',fin:'reduire',lvl:'fort',lesson:'On réduit fortement pour ne garder qu\'un petit volume, très concentré.'},
  {k:'stock'},
  {k:'brew',tech:'melanger',items:[['@0',20]],adj:['lanoline',30],expect:'baume',
   lesson:'Sans lanoline, l\'eau et le gras se séparent. La lanoline est un émulsifiant : elle les fait tenir ensemble.',
   after:r=>`Vérifie : aucune remarque ne signale de séparation, et la conservation est de ${r.shelf.label}.`},
  {k:'save'}],
 variants:['Remplace la lanoline par de la graisse d\'oie : la fiche prévient que le mélange se sépare.','Réduis moins (niveau « Moyen ») et compare la force.','Ajoute de la cire brune pour raffermir.'],
 end:'C\'est la méthode générale pour faire un baume avec un liquide aqueux : réduire, puis émulsionner.'},

{id:'concentrer-conserver',cat:'affiner',lvl:2,t:'Concentrer et conserver',d:'Prépare une infusion, puis réduis-la, adoucis-la et scelle-la.',learn:'Les finitions, appliquées à part.',
 stages:[
  {k:'brew',tech:'infuser',feu:1,items:[['sureau_pale',6],['bourrache_noire',4]],solvent:['eau_pluie',100],expect:'soin',lesson:'Une infusion se garde deux jours : c\'est peu. Les finitions vont l\'améliorer.',after:r=>`Conservation : ${r.shelf.label}.`},
  {k:'finish',fin:'reduire',lvl:'moyen',lesson:'On évapore la moitié : les vertus qui ne s\'envolent pas sont concentrées.'},
  {k:'finish',fin:'edulcorer',lesson:'Le miel masque l\'amertume et améliore la conservation.'},
  {k:'finish',fin:'sceller',lesson:'La cire isole la mixture de l\'air : la conservation est triplée.',after:r=>`Conservation finale : ${r.shelf.label}. Les finitions s\'appliquent à part, sur n\'importe quelle mixture, sans relancer de technique.`},
  {k:'save'}],
 variants:['Filtre ou décante une préparation trouble avant de la réduire.','Essaie la réduction « Fort » : la force est multipliée, dangers compris.','Applique une finition à un contenant de la Réserve (onglet Finition).'],
 end:'Tu peux enchaîner les finitions dans l\'ordre que tu veux ; certaines ne se font qu\'une fois.'}
];
const gMission=id=>MISSIONS.find(m=>m.id===id);
const gRecipe=sg=>({items:(sg.items||[]).map(([id,q])=>({id,q})),solvent:sg.solvent?sg.solvent[0]:null,vol:sg.solvent?sg.solvent[1]:VOLS.def,adj:sg.adj?sg.adj[0]:null,adjq:sg.adj?sg.adj[1]:ADJQ.def,tech:sg.tech,feu:TECH[sg.tech].heat?(sg.feu!=null?sg.feu:1):1});

MISSIONS.forEach(m=>{if(TKMAP[m.id])m.tk=TKMAP[m.id]});
const AF=(r,id)=>gn(gFx(r,id));
MISSIONS.push(
/* --- Broyer --- */

{id:'broyer-liants',cat:'tech',tk:'broyer',lvl:2,t:'Un liant, trois formes',d:'La même poudre, liée au miel, à la cire puis à la glycérine.',learn:'Le liant décide de la forme et de l\'usage.',
 stages:[{k:'brew',tech:'broyer',items:[['racine_amere',6],['lichen_roche',4]],adj:['miel',20],expect:'soin',lesson:'Avec du miel, la poudre devient un électuaire, à prendre par la bouche.'},
  {k:'brew',clear:true,tech:'broyer',items:[['racine_amere',6],['lichen_roche',4]],adj:['cire_brune',20],expect:'tonique',after:r=>`Avec de la cire, la même poudre devient un ${r.form.toLowerCase()} (${TYPES[r.type].n.toLowerCase()}), conservé plus longtemps.`},
  {k:'brew',clear:true,tech:'broyer',items:[['racine_amere',6],['lichen_roche',4]],adj:['glycerine',20],expect:'soin',after:r=>`Avec de la glycérine, c\'est une ${r.form.toLowerCase()}, qui ne se conserve que ${r.shelf.label}.`},{k:'save'}],

/* --- Mélanger --- */
{id:'melanger-liquides',cat:'tech',tk:'melanger',lvl:3,t:'Marier deux infusions',d:'Prépare deux infusions, mets-les en contenant, puis mêle-les.',learn:'Mélanger des liquides les dilue en proportion de leurs volumes.',

{id:'melanger-poudre',cat:'tech',tk:'melanger',lvl:2,t:'Une poudre dans un liquide',d:'Fais une poudre, puis mets-la en suspension dans de l\'alcool.',learn:'Mélanger un solide et un liquide, sans extraire.',

/* --- Infuser --- */
{id:'infuser-chaleur',cat:'tech',tk:'infuser',lvl:1,t:'Tiède, chaude, bouillante',d:'La même sauge infusée à trois températures.',learn:'La chaleur accélère l\'extraction, puis chasse les essences.',

/* multiplicateurs de paiement : spécialité, notoriété, marché (concurrent), duel */
function campSpecMult(camp,order){
  const sp=specOf(camp.spec),ty=order.ty||(order.spec&&order.spec.types[0]);let m=1;
  if(sp&&sp.types.includes(ty))m*=sp.pay;
  if(DARK_TYPES.includes(ty))m*=1+.06*shadowTier(camp);
  return m;
}
function campMarketMult(camp,order){
  const mk=camp.market||{},r=camp.rival,ty=order.ty||(order.spec&&order.spec.types[0]);let m=1;
  if(mk.type&&mk.type===ty&&mk.until!=null&&(camp.served||0)<mk.until)m*=mk.pay||.8;
  if(r&&!r.left&&r.pts>=3)m*=.9;
  return m;
}
function campPayFull(camp,order,ev,res){
  let pay=campPay(order,ev,res)*campSpecMult(camp,order)*campMarketMult(camp,order);
  if(order.duel&&ev.sat>=.8&&res.quality.score>=4)pay*=1.3;
  return Math.max(0,Math.round(pay));
}
/* prix d'achat chez le marchand */
function campBuyMult(camp){
  const mk=camp.market||{},r=camp.rival,mn=mentorStage(camp);let m=1;
  if(mk.buy&&mk.until!=null&&(camp.served||0)<mk.until)m*=mk.buy;
  if(mk.disc)m*=mk.disc;
  if(r&&!r.left&&r.pts>=3)m*=1.1;
  if(mn>=3)m*=.9;
  return m;
}
/* attrait de la clientèle : les commandes de sa spécialité viennent plus souvent */
function campSpecWeight(camp,type){
  const sp=specOf(camp.spec);let w=1;
  if(sp&&sp.types.includes(type))w*=1.6;
  if(DARK_TYPES.includes(type)&&shadowTier(camp)>=2)w*=1.3;
  return w;
}
/* notoriété */
function shadowAfterServe(camp,order,ev){
  const ty=order.ty||order.spec.types[0],t0=shadowTier(camp);
  if(DARK_TYPES.includes(ty)){if(ev.sat>=.3)camp.shadow=(camp.shadow||0)+(ev.sat>=.5?1:.5)*(camp.spec==='alchimiste'?1.5:1)}
  else if(camp.spec!=='alchimiste')camp.shadow=Math.max(0,(camp.shadow||0)-.3);
  camp.shadow=Math.round(Math.min(40,camp.shadow||0)*100)/100;
  return shadowTier(camp)!==t0?shadowTier(camp):null;
}
function campInspection(camp){
  const t=shadowTier(camp);if(t<1)return null;
  const fine=Math.round(30*t*(camp.spec==='alchimiste'?.5:1));
  camp.money=Math.max(0,camp.money-fine);camp.rating=clamp(camp.rating-.05*t,.5,5);
  return {fine,t};
}

function rivalLog(camp,txt){const r=camp.rival;r.log=r.log||[];r.log.unshift({day:camp.day,txt});if(r.log.length>8)r.log.length=8}
/* appelé après chaque client servi : renvoie un événement à raconter, ou null */
function rivalTick(camp,rng){
  rng=rng||Math.random;let r=camp.rival;
  if(!r){
    if((camp.served||0)>=10&&camp.rating>=2.5){r=camp.rival={pts:0,duels:0,won:0,lost:0,left:false,duelPending:false,next:camp.served+4,log:[]};rivalLog(camp,'Maître Corvin ouvre boutique dans le quartier.');return {kind:'intro'}}
    return null;
  }
  if(r.left)return null;
  camp.market=camp.market||{};const mk=camp.market;
  if(mk.until!=null&&camp.served>=mk.until){mk.type=null;mk.buy=null;mk.until=null}
  if(camp.served<r.next)return null;
  r.next=camp.served+5+Math.floor(rng()*4);
  const roll=rng();
  if(roll<.4){r.duelPending=true;return {kind:'duel'}}
  if(roll<.72){
    const types=Object.keys(TYPES).filter(t=>t!=='bourbe'&&(camp.typesServed||{})[t]);
    const t=types.length?rngPick(types,rng):'soin';
    mk.type=t;mk.pay=.8;mk.until=camp.served+6;rivalLog(camp,'Corvin casse les prix : '+TYPES[t].n.toLowerCase()+'.');
    return {kind:'war',type:t};
  }
  mk.buy=1.25;mk.until=camp.served+6;rivalLog(camp,'Corvin accapare les étals du marchand.');
  return {kind:'hoard'};
}
/* une commande de duel : un curieux vient comparer ta mixture à celle de Corvin */
function rivalDuelOrder(camp,rng){
  const pool=campTemplates(camp);if(!pool.length)return null;
  const sp=specOf(camp.spec);
  const mine=sp?pool.filter(o=>sp.types.includes(o.spec.types[0])):[];
  const tpl=rngPick(mine.length&&rng()<.6?mine:pool,rng);
  const cl=campNewClient(rngPick(tpl.who,rng),rng);cl.job='Envoyé de Maître Corvin';
  const o=campBuildOrder(camp,tpl,cl,rng,{intro:'Maître Corvin prétend faire mieux que vous. Je suis chargé de comparer.'});
  o.duel=true;o.text=o.text.replace(/^Maître Corvin prétend faire mieux que vous\./,'Maître Corvin prétend faire mieux que vous.');
  camp.rival.duelPending=false;return o;
}
function rivalDuelResult(camp,order,ev,res){
  if(!order.duel||!camp.rival)return null;
  const r=camp.rival,q=res&&res.quality?res.quality.score:0,won=ev.sat>=.8&&q>=4;
  r.duels++;if(won)r.won++;else r.lost++;
  r.pts=clamp(r.pts+(won?-1:1),-4,4);
  rivalLog(camp,won?'Tu l\'emportes sur Corvin.':'Corvin l\'emporte cette fois.');
  const out={won,pts:r.pts};
  if(r.pts<=-4&&!r.left){
    r.left=true;camp.money+=250;camp.earned+=250;camp.rating=clamp(camp.rating+.2,.5,5);
    camp.market=camp.market||{};camp.market.type=null;camp.market.buy=null;camp.market.until=null;camp.market.disc=.9;
    rivalLog(camp,'Corvin quitte le quartier.');out.left=true;
  }
  return out;
}

const HUES={noir:'très sombre',bleu:'bleue',rouge:'rouge',blanc:'blanche',jaune:'jaune',vert:'verte',violet:'violette',brun:'brune'};
const HUEDEF={bleu:[225,35],jaune:[50,14],vert:[125,45],violet:[285,35]};

/* ---------- pures : couleur, évaluation, paiement ---------- */
function hexHSL(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return {h:0,s:0,l:.5};
  const n=parseInt(m[1],16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  let h=0,s=0;const d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
  return {h,s,l};
}
function hueScore(hex,name){
  const {h,s,l}=hexHSL(hex);
  if(name==='noir')return clamp((.3-l)/.12,0,1);
  if(name==='blanc')return clamp((l-.75)/.1,0,1)*clamp((.4-s)/.2,0,1);
  if(name==='brun'){const dh=Math.max(0,Math.abs(h-28)-18);return clamp((s-.2)/.15,0,1)*clamp(1-dh/25,0,1)*clamp((.45-l)/.1,0,1)*clamp((l-.06)/.06,0,1)}
  const sat=clamp((s-.12)/.2,0,1);
  const dist=HUEDEF[name]?Math.max(0,Math.abs(h-HUEDEF[name][0])-HUEDEF[name][1]):name==='rouge'?Math.max(0,Math.min(h,360-h)-18):0;
  return sat*clamp(1-dist/40,0,1)*clamp((l-.08)/.1,0,1);
}
const tierName=v=>v<1.2?'faible':v<2.6?'modérée':v<4.4?'forte':'intense';
const fmtNum=v=>String(Math.round(v*10)/10).replace('.',',');
function campEval(spec,res,have){
  const P=[];const fxv=id=>{const f=res.fx.find(x=>x.id===id);return f?f.raw:0};
  const tn=res.type&&TYPES[res.type]?TYPES[res.type].n.toLowerCase():'?';
  let ts=spec.types.includes(res.type)?1:(res.alt||[]).some(a=>spec.types.includes(a))?.6:0;
  P.push({k:'type',w:.3,s:ts,label:'Type : '+spec.types.map(t=>TYPES[t].n.toLowerCase()).join(' ou '),got:tn});
  spec.fx.forEach(([id,min])=>{const g=fxv(id);P.push({k:'fx',w:.35/spec.fx.length,s:Math.min(1,g/min),label:FX[id].n+' : '+tierName(min)+' au moins',got:g>=.45?tierName(g)+' ('+fmtNum(g)+')':'absente'})});
  P.push({k:'qual',w:.2,s:clamp((res.quality.score-1)/3.5,0,1),label:'Qualité de fabrication',got:res.quality.label.toLowerCase()});
  const misc=[];
  if(spec.ext){const ok=res.ext===spec.ext||(res.ext==='mixte'&&spec.ext!=='inhale');misc.push({k:'ext',s:ok?1:.2,label:'Usage : '+({externe:'sur la peau',interne:'à boire',inhale:'à respirer'}[spec.ext]),got:({externe:'sur la peau',interne:'à boire',inhale:'à respirer',mixte:'boire ou peau'}[res.ext]||res.ext)})}
  if(spec.shelf){misc.push({k:'shelf',s:Math.min(1,res.shelf.days/spec.shelf),label:'Conservation : '+(spec.shelf>=365?Math.round(spec.shelf/365)+' an'+(spec.shelf>=730?'s':'')+' au moins':spec.shelf+' jours au moins'),got:res.shelf.label})}
  if(spec.hue){const s=hueScore(res.color,spec.hue);misc.push({k:'hue',s,label:'Couleur : '+HUES[spec.hue],got:res.colorName||'?'})}
  misc.forEach(m=>{m.w=.15/misc.length;P.push(m)});
  const W=P.reduce((s,p)=>s+p.w,0);
  let sat=P.reduce((s,p)=>s+p.w*p.s,0)/W;
  if(ts===0)sat*=.6;
  const qtyRatio=clamp((have==null?res.qty:have)/spec.qty,0,1);
  return {sat:clamp(sat,0,1),parts:P,qtyRatio,stars:clamp(Math.round(1+4*sat),1,5)};
}
function campPay(order,ev,res){
  const sf=ev.sat<.3?0:Math.pow(ev.sat,1.5),qf=.85+.075*res.quality.score;
  let pay=order.base*ev.qtyRatio*sf*qf;
  if(ev.sat>=.95&&res.quality.score>=4)pay*=1.15;
  return Math.max(0,Math.round(pay));
}

function campSpecLines(spec){
  const L=[];
  L.push(['Type',spec.types.map(t=>TYPES[t].n.toLowerCase()).join(' ou ')]);
  spec.fx.forEach(([id,min])=>L.push([FX[id].n,tierName(min)+' au moins']));
  if(spec.ext)L.push(['Usage',{externe:'sur la peau',interne:'à boire',inhale:'à respirer'}[spec.ext]]);
  if(spec.shelf)L.push(['Conservation',spec.shelf>=365?Math.round(spec.shelf/365)+' an'+(spec.shelf>=730?'s':'')+' au moins':spec.shelf+' jours au moins']);
  if(spec.hue)L.push(['Couleur',HUES[spec.hue]]);
  L.push(['Quantité',spec.qty+' '+spec.unit+' au moins']);
  return L;
}
